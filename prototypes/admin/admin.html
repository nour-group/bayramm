<head>
<meta charset="utf-8">

<title>BAYRAMM — панель оператора</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F5F5F4;--card:#FFFFFF;--ink:#171717;--muted:#6B6B6B;--line:#E5E5E3;--soft:#FAFAF9;
  --side:#FFFFFF;--side-ink:#171717;--side-muted:#737373;--side-hover:#F2F2F0;--side-on:#171717;--side-on-ink:#FFFFFF;--side-line:#E5E5E3;
  --coral:#C2410C;--coral-ink:#FFFFFF;--coral-soft:#FFEDE3;
  --berry:#C2410C;--berry-soft:#FFEDE3;--teal:#171717;--teal-soft:#EDEDEB;--amber:#9A3412;--amber-soft:#FFF4EC;
  --sky:#525252;--sky-soft:#F0F0EE;--grey-soft:#EDEDEB;--ring:#EA580C;--grey:#171717;
  --r-s:6px;--r-m:10px;--r-l:16px;
  --h:'Unbounded',system-ui,sans-serif;--b:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0A0A0A;--card:#161616;--ink:#F5F5F5;--muted:#A3A3A3;--line:#2A2A2A;--soft:#1D1D1D;

  --coral:#FF7A2F;--coral-ink:#0A0A0A;--coral-soft:#2E1A0F;
  --berry:#FF8A45;--berry-soft:#2E1A0F;--teal:#F5F5F5;--teal-soft:#262626;--amber:#FFB27A;--amber-soft:#26190F;
  --sky:#BDBDBD;--sky-soft:#232323;--grey-soft:#2A2A2A;--ring:#FF7A2F;color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#0A0A0A;--card:#161616;--ink:#F5F5F5;--muted:#A3A3A3;--line:#2A2A2A;--soft:#1D1D1D;
  --side:#000000;--side-ink:#F5F5F5;--side-muted:#8A8A8A;--side-hover:#1A1A1A;--side-on:#F5F5F5;--side-on-ink:#0A0A0A;--side-line:#262626;
  --coral:#FF7A2F;--coral-ink:#0A0A0A;--coral-soft:#2E1A0F;
  --berry:#FF8A45;--berry-soft:#2E1A0F;--teal:#F5F5F5;--teal-soft:#262626;--amber:#FFB27A;--amber-soft:#26190F;
  --sky:#BDBDBD;--sky-soft:#232323;--grey-soft:#2A2A2A;--ring:#FF7A2F;color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 var(--b)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--coral);outline-offset:2px}
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
/* sidebar */
.side{background:var(--side);color:var(--side-ink);border-right:1px solid var(--side-line);padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:18px;overflow:auto}
.brand{font-family:var(--h);font-size:19px;letter-spacing:.01em;padding:0 10px}
.brand small{display:block;font:500 12px var(--b);color:var(--side-muted);margin-top:2px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--r-s);color:var(--side-ink);text-decoration:none;font-weight:600;font-size:14px}
.nav a:hover{background:var(--side-hover)}
.nav a.on{background:var(--side-on);color:var(--side-on-ink)}
.nav a svg{width:18px;height:18px;flex:none;opacity:.85}
.nav .badge{margin-left:auto;background:var(--coral);color:#fff;border-radius:20px;font-size:11px;font-weight:800;padding:1px 7px}
.nav .sep{height:1px;background:var(--side-line);margin:8px 10px}
.side-foot{margin-top:auto;padding:0 10px;display:flex;flex-direction:column;align-items:flex-start;gap:10px;font-size:13px;color:var(--side-muted)}
.seg{display:inline-flex;border:1px solid var(--side-line);border-radius:20px;overflow:hidden;width:max-content}
.seg button{background:none;border:0;padding:4px 12px;cursor:pointer;color:var(--side-muted);font-weight:700;font-size:12px}
.seg button.on{background:var(--side-on);color:var(--side-on-ink)}
/* main */
main{min-width:0;padding:24px 32px 60px}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:22px}
.top h1{font-family:var(--h);font-weight:600;font-size:24px;margin:0;margin-right:auto;line-height:1.2}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:var(--r-s);padding:8px 14px;font-weight:700;font-size:14px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--coral);border-color:var(--coral);color:var(--coral-ink)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.good{background:var(--ink);border-color:var(--ink);color:var(--card)}
.btn.bad{color:var(--berry);border-color:var(--berry-soft)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.search{border:1px solid var(--line);background:var(--card);border-radius:var(--r-s);padding:8px 12px;min-width:220px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r-m);padding:18px 20px}
.panel h2{font-family:var(--h);font-weight:600;font-size:15px;margin:0 0 12px;line-height:1.3}
.panel h2 .n{color:var(--muted);font-family:var(--b);font-weight:700;margin-left:6px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:1.4fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
.muted{color:var(--muted)}
.small{font-size:13px}
.empty{padding:26px;text-align:center;color:var(--muted)}
/* pipeline — the one bold element */
.pipe{display:grid;grid-template-columns:repeat(4,1fr);gap:0;background:var(--card);border:1px solid var(--line);border-radius:var(--r-l);overflow:hidden;margin-bottom:16px}
.stage{padding:18px 20px 16px;border-right:1px solid var(--line);cursor:pointer;background:none;border-top:0;border-bottom:0;border-left:0;text-align:left;position:relative}
.stage:last-child{border-right:0}
.stage:hover{background:var(--soft)}
.stage .num{font-family:var(--h);font-size:34px;line-height:1}
.stage .lbl{font-weight:700;margin-top:8px}
.stage .hint{font-size:13px;color:var(--muted)}
.stage.active{background:var(--ink);color:var(--card)}
.stage.active .hint{color:var(--muted)}.stage.active .num{color:var(--ring)}
.stage.active:hover{background:var(--ink);opacity:.92}
.target{grid-column:1/-1;border-top:1px solid var(--line);padding:12px 20px;display:flex;align-items:center;gap:14px;font-size:13px}
.bar{flex:1;height:8px;background:var(--grey-soft);border-radius:8px;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r-m);padding:14px 16px}
.kpi b{display:block;font-size:22px;font-weight:800}
.kpi span{font-size:13px;color:var(--muted)}
.kpi.warn b{color:var(--berry)}
.todo{display:flex;flex-direction:column}
.todo button{display:flex;align-items:center;gap:12px;padding:11px 4px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;cursor:pointer}
.todo button:last-child{border-bottom:0}
.todo button:hover{background:var(--soft)}
.todo .c{min-width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800}
.todo .t{flex:1}
/* table */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-m);background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font-weight:700;color:var(--muted);font-size:13px;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--soft)}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--soft)}
td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.nm{font-weight:700}
.id{font-size:12px;color:var(--muted)}
.pill{display:inline-block;border-radius:20px;padding:2px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.s-lead{background:var(--grey-soft);color:var(--muted)}
.s-draft{background:var(--amber-soft);color:var(--amber)}
.s-review{background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.s-active{background:var(--ink);color:var(--card)}
.s-suspended,.s-rejected,.s-overdue,.s-blocked{background:var(--berry-soft);color:var(--berry)}
.s-new{background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.s-viewed{background:var(--amber-soft);color:var(--amber)}
.s-replied{background:var(--grey-soft);color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.chip{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:5px 12px;font-size:13px;font-weight:700;cursor:pointer}
.chip.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.chip span{opacity:.6;margin-left:4px}
.chips select{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:5px 10px;font-size:13px;font-weight:600}
.chips .search{margin-left:auto}
/* readiness ring */
.ring{--p:0;width:30px;height:30px;border-radius:50%;display:inline-grid;place-items:center;font-size:11px;font-weight:800;
  background:conic-gradient(var(--ring) calc(var(--p)*1%),var(--grey-soft) 0)}
.ring::before{content:attr(data-v);width:22px;height:22px;border-radius:50%;background:var(--card);display:grid;place-items:center}
.rate{display:inline-flex;align-items:center;gap:6px}
.rate i{width:40px;height:5px;border-radius:5px;background:var(--grey-soft);position:relative;overflow:hidden}
.rate i::after{content:"";position:absolute;inset:0;width:var(--w);background:var(--c,var(--teal))}
/* drawer */
.scrim{position:fixed;inset:0;background:rgba(20,10,22,.42);z-index:40;display:none}
.scrim.on{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(620px,100%);background:var(--paper);z-index:41;transform:translateX(100%);transition:transform .22s ease;display:flex;flex-direction:column;box-shadow:-10px 0 40px rgba(20,10,22,.18)}
.drawer.on{transform:none}
.dh{padding:18px 22px;border-bottom:1px solid var(--line);background:var(--card);display:flex;gap:12px;align-items:flex-start}
.dh h3{font-family:var(--h);font-weight:600;font-size:19px;margin:0 0 4px;line-height:1.25}
.dh .x{margin-left:auto;border:0;background:none;font-size:22px;cursor:pointer;line-height:1;padding:4px 8px;color:var(--muted)}
.db{overflow:auto;padding:18px 22px 40px;display:flex;flex-direction:column;gap:14px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.check{display:flex;flex-direction:column}
.check label{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer}
.check label:last-child{border-bottom:0}
.check input{width:18px;height:18px;accent-color:var(--ring)}
.check .auto{margin-left:auto;font-size:12px;color:var(--muted)}
.dl{display:grid;grid-template-columns:150px 1fr;gap:6px 14px;font-size:14px;margin:0}
.dl dt{color:var(--muted)}
.dl dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.ph{aspect-ratio:4/3;border-radius:var(--r-s);background-size:cover;background-position:center;position:relative;overflow:hidden;border:1px solid var(--line)}
.ph.seed{background:radial-gradient(circle at 50% 50%,transparent 9px,var(--muted) 9.5px,var(--muted) 10.5px,transparent 11px),var(--grey-soft)}
.ph button{position:absolute;top:3px;right:3px;border:0;border-radius:50%;width:22px;height:22px;background:rgba(0,0,0,.6);color:#fff;cursor:pointer;line-height:1}
.alert{border-radius:var(--r-m);padding:10px 14px;font-size:14px;border:1px solid}
.alert.info{background:var(--soft);color:var(--ink);border-color:var(--line)}
.alert.warn{background:var(--coral-soft);color:var(--ink);border-color:transparent;border-left:3px solid var(--coral)}
.alert.bad{background:var(--berry-soft);color:var(--berry);border-color:transparent}
.notes{display:flex;flex-direction:column;gap:8px}
.note{background:var(--soft);border-radius:var(--r-s);padding:8px 12px;font-size:14px}
.note .m{font-size:12px;color:var(--muted)}
textarea,.field input,.field select{width:100%;border:1px solid var(--line);background:var(--card);border-radius:var(--r-s);padding:8px 10px}
textarea{min-height:70px;resize:vertical}
/* form */
.form{display:grid;gap:16px;max-width:980px}
.fs{background:var(--card);border:1px solid var(--line);border-radius:var(--r-m);padding:18px 20px;display:grid;grid-template-columns:200px 1fr;gap:20px}
.fs>div:first-child h2{font-family:var(--h);font-weight:600;font-size:15px;margin:0 0 6px}
.fs>div:first-child p{margin:0;font-size:13px;color:var(--muted)}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:700}
.field.full{grid-column:1/-1}
.field .err{color:var(--berry);font-weight:600;font-size:12px}
.field.bad input,.field.bad select{border-color:var(--berry)}
.upload{border:1.5px dashed var(--line);border-radius:var(--r-m);padding:16px;text-align:center;cursor:pointer;color:var(--muted);font-size:14px}
.upload:hover{border-color:var(--muted)}
.formbar{position:sticky;bottom:0;background:var(--paper);padding:12px 0;display:flex;gap:10px;justify-content:flex-end;border-top:1px solid var(--line)}
/* moderation */
.mod{display:grid;gap:12px}
.diff{display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:14px;margin:10px 0}
.diff div{border-radius:var(--r-s);padding:8px 10px}
.diff .was{background:var(--berry-soft)}
.diff .now{background:var(--grey-soft)}
.diff b{display:block;font-size:12px;color:var(--muted)}
.stars{color:var(--ring);letter-spacing:2px}
/* modal & toast */
.modal{position:fixed;inset:0;display:none;place-items:center;z-index:60;background:rgba(20,10,22,.45);padding:16px}
.modal.on{display:grid}
.mbox{background:var(--card);border-radius:var(--r-l);width:min(460px,100%);padding:20px 22px;display:flex;flex-direction:column;gap:12px}
.mbox.wide{width:min(620px,100%);max-height:calc(100vh - 32px);overflow:auto}
.mbox h4{font-weight:800;font-size:13px;color:var(--muted);margin:6px 0 0}
.linkrow{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:var(--r-s);padding:6px 6px 6px 10px;background:var(--soft)}
.linkrow code{flex:1;font:600 13px var(--b);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.person{border:1px solid var(--line);border-radius:var(--r-m);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.person .nm{font-size:16px}
.mbox h3{font-family:var(--h);font-weight:600;font-size:17px;margin:0}
.mbox .acts{justify-content:flex-end}
.toasts{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:70;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:var(--ink);color:var(--card);padding:10px 16px;border-radius:var(--r-s);font-weight:600;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.switch{position:relative;width:38px;height:22px;flex:none}
.switch input{opacity:0;width:100%;height:100%;margin:0;position:absolute;cursor:pointer;z-index:1}
.switch i{position:absolute;inset:0;border-radius:22px;background:var(--grey-soft);transition:.15s}
.switch i::after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:var(--card);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:.15s}
.switch input:checked+i{background:var(--ring)}
.switch input:checked+i::after{left:19px}
.switch input:disabled+i{opacity:.5}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .grow{flex:1}
.yes{color:var(--ring);font-weight:800}.no{color:var(--muted)}
@media (max-width:1100px){.g2,.g3{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:sticky;height:auto;flex-direction:row;align-items:center;padding:10px 12px;z-index:30;gap:10px}
  .side::after{display:none}
  .brand small{display:none}.brand{font-size:16px;padding:0 4px}
  .nav{flex-direction:row;overflow-x:auto;flex:1}
  .nav a{white-space:nowrap}.nav .sep{display:none}
  .side-foot{margin:0;padding:0}.side-foot .who{display:none}
  main{padding:18px 14px 60px}
  .pipe{grid-template-columns:repeat(2,1fr)}.stage:nth-child(2){border-right:0}.stage:nth-child(-n+2){border-bottom:1px solid var(--line)}
  .fs{grid-template-columns:1fr}.fields{grid-template-columns:1fr}
  .dl{grid-template-columns:1fr}.dl dt{margin-top:6px}
  .chips .search{margin-left:0;width:100%}
  .search{min-width:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

function checks(v){return {contract:!!v.check.contract,stir:!!v.check.stir,photos:v.photos.length>=S.settings.minPhotos,prices:v.priceFrom>0&&v.capMax>0,contacts:!!v.check.contacts,consent:!!v.check.consent}}
const readyN=v=>Object.values(checks(v)).filter(Boolean).length;
const overdue=r=>r.status!=='replied'&&Date.now()-r.created>S.settings.sla*HOUR;
const rStatus=r=>overdue(r)?'overdue':r.status;
function vStats(v){const rs=S.requests.filter(r=>r.vendor===v.id&&Date.now()-r.created<30*DAY);const rep=rs.filter(r=>r.status==='replied');
  return {n:rs.length,rate:rs.length?Math.round(rep.length/rs.length*100):null,avg:rep.length?Math.round(rep.reduce((s,r)=>s+r.replyH,0)/rep.length):null,over:rs.filter(overdue).length}}
const pill=(s,label)=>`<span class="pill s-${s}">${esc(label||t(s))}</span>`;
const ring=v=>{const n=readyN(v);return `<span class="ring" style="--p:${Math.round(n/6*100)}" data-v="${n}" title="${n}/6"></span>`};
const rate=p=>p==null?'<span class="muted">—</span>':`<span class="rate"><i style="--w:${p}%;--c:${p<60?'var(--coral)':p<80?'var(--muted)':'var(--ink)'}"></i>${p}%</span>`;
const fmtPhone=p=>{const d=(p||'').replace(/\D/g,'');return d.length===12?`+${d.slice(0,3)} ${d.slice(3,5)} ${d.slice(5,8)} ${d.slice(8,10)} ${d.slice(10)}`:(p||'—')};
const mask=p=>{const d=(p||'').replace(/\D/g,'');return d.length===12?`+${d.slice(0,3)} ${d.slice(3,5)} ••• •• ${d.slice(10)}`:'—'};

function vendorActions(v){
  const b=(act,label,cls='')=>`<button class="btn ${cls}" data-act="${act}" data-v="${v.id}">${label}</button>`;

  switch(v.status){

    case 'draft':return b('edit',t('edit'))+b('toReview',t('toReview'),'pri')+b('reject',t('reject'),'bad');
    case 'review':return `<button class="btn good" data-act="activate" data-v="${v.id}" ${full?'':'disabled'}>${t('activate')}</button>`+b('edit',t('edit'))+b('toDraft',t('toDraft'))+b('reject',t('reject'),'bad');
    case 'active':return b('edit',t('edit'))+b('suspend',t('suspend'),'bad');
    case 'suspended':return `<button class="btn good" data-act="restore" data-v="${v.id}" ${full?'':'disabled'}>${t('restore')}</button>`+b('edit',t('edit'));
    case 'rejected':return b('toDraft',t('toDraft'));
  }return '';
}

      UI.form.photos.push(cv.toDataURL('image/jpeg',.72));refreshPhotos()};img.src=rd.result};rd.readAsDataURL(file)});

function validate(f,mode){
  const E={},strict=mode!=='draft';
  if(!f.name.trim())E.name=t('eName');
  const ph=f.phone.replace(/[^\d+]/g,'');
  if(strict||ph.length>4){if(!/^\+998\d{9}$/.test(ph))E.phone=t('ePhone')}
  if((strict||f.stir)&&!/^\d{9}$/.test(String(f.stir).trim()))E.stir=t('eStir');
  if(strict){
    if(f.district===''||f.district==null)E.district=t('eDistrict');
    if(!String(f.contact).trim())E.contact=t('eContact');
    if(!(+f.priceFrom>0))E.priceFrom=t('ePrice');
    if(!(+f.capMax>0)||+f.capMax<=+f.capMin)E.capMax=t('eCap');
    if(f.photos.length<S.settings.minPhotos)E.photos=t('ePhotos',{n:S.settings.minPhotos});
  }
  return E;
}

  const person=isRev?{name:c.name,phone:c.phone,tg:c.tg,role:t('reviewAuthor'),hint:t('hintClient'),masked:!UI.revealed[c.id]}
                    :{name:v.contact,phone:v.phone,tg:v.tg,role:t('submittedBy')+', '+t('contactP').toLowerCase(),hint:t('hintVendor'),masked:false};
  const tel=(person.phone||'').replace(/[^\d+]/g,'');
  $('#mbox').className='mbox wide';
  $('#mbox').innerHTML=`
   <div class="acts" style="align-items:center"><h3 style="margin-right:auto">${t(m.type==='card'?'mCard':m.type==='photos'?'mPhotos':'mReview')}</h3><span class="small muted">${t('sentAt')}: ${ftime(m.at)}</span></div>
   <h4>${t('change')}</h4>${modBody(m)}
   <h4>${t('service')}</h4>
   <dl class="dl"><dt>${t('name')}</dt><dd>${esc(v.name)} <span class="muted">${esc(v.id)}</span></dd>
     <dt>${t('category')}</dt><dd>${v.cat?cn(v.cat):'—'}</dd><dt>${t('district')}</dt><dd>${dn(v.district)}</dd>
     <dt>${t('address')}</dt><dd>${esc(v.address)||'—'}</dd>
     <dt>${t('capacity')}</dt><dd>${v.capMax?`${v.capMin}–${v.capMax} ${t('guests')}`:'—'}</dd>
     <dt>${t('priceFrom')}</dt><dd>${v.priceFrom?money(v.priceFrom):'—'}</dd><dt>${t('status')}</dt><dd>${v.status?pill(v.status):'—'}</dd></dl>
   <h4>${t('cardLink')}</h4>
   <div class="linkrow"><code>${esc(cardUrl(v))}</code><button class="btn sm" data-act="copyLink" data-v="${esc(cardUrl(v))}">${t('copy')}</button><a class="btn sm" href="${esc(cardUrl(v))}" target="_blank" rel="noopener">${t('openLink')}</a></div>
   <h4>${esc(person.role)}</h4>
   <div class="person"><span class="nm">${esc(person.name)||'—'}</span>
     <span>${person.masked?`${mask(person.phone)} <button class="btn sm" data-act="modReveal" data-v="${m.id}">${t('show')}</button>`:fmtPhone(person.phone)}${person.tg?` <span class="muted">${esc(person.tg)}</span>`:''}</span>
     <div class="acts">${!person.masked&&tel?`<a class="btn sm" href="tel:${esc(tel)}">${t('call')}</a>`:''}${person.tg?`<a class="btn sm" href="${esc(tgLink(person.tg))}" target="_blank" rel="noopener">${t('writeTg')}</a>`:''}</div>
     <span class="small muted">${person.hint}</span></div>
   ${isRev?`<h4>${t('clientReq')}</h4>${reqs.length?reqs.map(r=>`<div class="row small"><span class="grow">${ftime(r.created)}, ${r.guests} ${t('guests')}, ${t('eventDate').toLowerCase()} ${fdate(r.event)}</span>${pill(rStatus(r),t(rStatus(r)))}</div>`).join(''):`<div class="alert warn">${t('noClientReq')}</div>`}`:''}
   <div class="acts" style="margin-top:6px"><button class="btn" data-act="mCancel">${t('closeB')}</button><button class="btn bad" data-act="modNo" data-v="${m.id}">${t('decline')}</button><button class="btn good" data-act="modOk" data-v="${m.id}">${t('approve')}</button></div>`;
}
const A={
  modInfo(id){lastFocus=document.activeElement;modalCb=null;renderModInfo(id);$('#modal').classList.add('on');setTimeout(()=>{const b=$('#mbox [data-act=mCancel]');b&&b.focus()},30)},
  modReveal(id){const m=S.moderation.find(x=>x.id===id),c=S.clients.find(x=>x.id===m.client);UI.revealed[c.id]=true;log('aPii',c.id+' '+c.name);save();renderModInfo(id)},
  copyLink(u){const done=()=>toast(t('copied'));try{navigator.clipboard.writeText(u).then(done,()=>{})}catch(e){}},
  goAdd(){UI.form=null;UI.editId=null;UI.errors={};closeDrawer();if(route()==='add')render();else location.hash='add'},
  vfilter(v){UI.vf=v;if(route()!=='vendors')location.hash='vendors';else render()},
  rfilter(v){UI.rf=v;render()},
  todo(v){if(v==='review'){UI.vf='review';location.hash='vendors'}else if(v==='overdue'){UI.rf='overdue';location.hash='requests'}else if(v==='mod')location.hash='moderation';else if(v==='free')location.hash='payments';else{UI.vf='draft';location.hash='vendors'}},
  openV:openDrawer,close:closeDrawer,
  edit(id){UI.editId=id;UI.form=null;UI.errors={};closeDrawer();location.hash='add';if(route()==='add')render()},
  cancelForm(){UI.form=null;const id=UI.editId;UI.editId=null;UI.errors={};location.hash='vendors';if(id)setTimeout(()=>openDrawer(id),30)},
  saveForm:saveForm,
  rmPhoto(i){UI.form.photos.splice(+i,1);refreshPhotos()},
  activate(id){const v=V(id);if(readyN(v)<6)return;v.status='active';v.activated=Date.now();v.freeUntil=Date.now()+S.settings.freeDays*DAY;log('aActivate',id+' '+v.name);toast(t('activated'));refresh()},
  restore(id){const v=V(id);if(readyN(v)<6)return;v.status='active';log('aRestore',id+' '+v.name);toast(t('activated'));refresh()},
  toReview(id){const v=V(id),E=validate({...v,phone:v.phone,district:v.district},'review');
    if(Object.keys(E).length){UI.editId=id;UI.form=JSON.parse(JSON.stringify(v));UI.errors=E;closeDrawer();location.hash='add';if(route()==='add')render();toast(t('fixErrors'));return}
    v.status='review';log('aReview',id+' '+v.name);toast(t('sentReview'));refresh()},
  toDraft(id){const v=V(id);v.status='draft';log('aDraft',id+' '+v.name);refresh()},
  suspend(id){const v=V(id);modal(t('suspend')+': '+esc(v.name),reasonBody(),t('suspend'),withReason(r=>{v.status='suspended';v.notes.push({by:S.me,at:Date.now(),text:r});S.audit.unshift({at:Date.now(),by:S.me,a:'aSuspend',obj:id+' '+v.name,detail:r});toast(t('suspendedT'));refresh()}),'bad')},
  reject(id){const v=V(id);modal(t('reject')+': '+esc(v.name),reasonBody(),t('reject'),withReason(r=>{v.status='rejected';v.notes.push({by:S.me,at:Date.now(),text:r});S.audit.unshift({at:Date.now(),by:S.me,a:'aReject',obj:id+' '+v.name,detail:r});toast(t('rejectedT'));refresh()}),'bad')},
  note(id){const v=V(id),tx=$('#noteIn').value.trim();if(!tx)return;v.notes.push({by:S.me,at:Date.now(),text:tx});log('aNote',id+' '+v.name);refresh()},
  nudge(id){const r=S.requests.find(x=>x.id===id);r.nudges=(r.nudges||0)+1;log('aNudge',(V(r.vendor)||{}).id+' '+id);toast(t('nudged'));refresh()},
  replied(id){const r=S.requests.find(x=>x.id===id);r.status='replied';r.replyH=Math.max(1,Math.round((Date.now()-r.created)/HOUR));log('aReplied',r.vendor+' '+id);refresh()},
  reassign(id){const r=S.requests.find(x=>x.id===id),cur=V(r.vendor);
    const opts=S.vendors.filter(v=>v.status==='active'&&v.id!==r.vendor&&v.capMax>=r.guests).map(v=>{const s=vStats(v);return `<option value="${v.id}">${esc(v.name)}, ${dn(v.district)}, ${v.capMin}–${v.capMax}, ${s.rate??'—'}%</option>`}).join('');
    modal(t('reassign')+' '+id,`<p class="small muted" style="margin:0">${esc(cur?cur.name:'')}, ${r.guests} ${t('guests')}, ${fdate(r.event)}</p><label class="field">${t('chooseVendor')}<select id="mSel">${opts}</select></label>`,t('reassign'),()=>{
      const nv=$('#mSel').value;if(!nv)return false;const old=r.vendor;r.vendor=nv;r.status='new';r.created=Date.now();r.nudges=0;
      S.audit.unshift({at:Date.now(),by:S.me,a:'aReassign',obj:id,detail:old+' › '+nv});toast(t('reassigned'));refresh()})},
  reveal(id){UI.revealed[id]=true;const c=S.clients.find(x=>x.id===id);log('aPii',id+' '+c.name);refresh()},
  block(id){const c=S.clients.find(x=>x.id===id);
    if(c.blocked){c.blocked=false;log('aUnblock',id+' '+c.name);refresh();return}
    modal(t('block')+': '+esc(c.name),reasonBody(),t('block'),withReason(r=>{c.blocked=true;S.audit.unshift({at:Date.now(),by:S.me,a:'aBlock',obj:id+' '+c.name,detail:r});refresh()}),'bad')},
  modOk(id){if($('#modal').classList.contains('on'))closeModal();const m=S.moderation.find(x=>x.id===id),v=V(m.vendor);m.status='approved';
    if(m.type==='card'&&v){if(m.field==='priceFrom')v.priceFrom=+m.after.replace(/\D/g,'');if(m.field==='capacity'){const [a,b]=m.after.split('–');v.capMin=+a;v.capMax=+b}}
    if(m.type==='photos'&&v)for(let i=0;i<m.count;i++)v.photos.push('seed');
    log('aApprove',m.vendor+' '+(v?v.name:''));toast(t('approved'));refresh()},
  modNo(id){const m=S.moderation.find(x=>x.id===id),v=V(m.vendor);modal(t('decline'),reasonBody(),t('decline'),withReason(r=>{m.status='declined';S.audit.unshift({at:Date.now(),by:S.me,a:'aDecline',obj:m.vendor+' '+(v?v.name:''),detail:r});toast(t('declined'));refresh()}),'bad')},
  extend(id){const v=V(id);v.freeUntil+=30*DAY;log('aExtend',id+' '+v.name);toast(t('extended'));refresh()},
  pay(id){const v=V(id);modal(t('recordPay')+': '+esc(v.name),`<label class="field">${t('amount')}<input id="mAmt" type="number" min="0" step="1000"></label>
    <label class="field">${t('method')}<select id="mMeth"><option value="transfer">${t('transfer')}</option><option value="cash">${t('cash')}</option></select></label>
    <label class="field">${t('period')}<input id="mMon" type="number" min="1" value="1"></label><span class="err small" id="mErr" style="color:var(--berry)"></span>`,t('recordPay'),()=>{
      const amt=+$('#mAmt').value;if(!(amt>0)){$('#mErr').textContent=t('ePrice');return false}
      S.payments.push({id:'P'+(S.payments.length+1),vendor:id,at:Date.now(),amount:amt,method:$('#mMeth').value,months:+$('#mMon').value||1,by:S.me});
      S.audit.unshift({at:Date.now(),by:S.me,a:'aPay',obj:id+' '+v.name,detail:money(amt)});toast(t('paySaved'));refresh()})},
  member(){modal(t('addMember'),`<label class="field">${t('nameP')}<input id="mName"></label><label class="field">Telegram<input id="mTg" placeholder="@username"></label>
    <label class="field">${t('role')}<select id="mRole"><option value="sales">${t('sales')}</option><option value="moder">${t('moder')}</option><option value="admin">${t('admin')}</option></select></label><span class="err small" id="mErr" style="color:var(--berry)"></span>`,t('addMember'),()=>{
      const n=$('#mName').value.trim();if(!n){$('#mErr').textContent=t('eName');return false}
      S.team.push({id:'u'+(S.team.length+1+Math.floor(Math.random()*1000)),name:n,tg:$('#mTg').value.trim(),role:$('#mRole').value});log('aMember',n);toast(t('memberAdded'));refresh()})},
  reset(){modal(t('reset'),`<p style="margin:0">${t('resetQ')}</p>`,t('reset'),()=>{const lang=S.lang;S=seed();S.lang=lang;UI.revealed={};closeDrawer();save();toast(t('resetDone'));render()},'bad')},
  mCancel:closeModal,
  mOk(){if(modalCb&&modalCb()===false)return;closeModal()},
};

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const th=e.target.closest('#themeSeg button');if(th){S.theme=th.dataset.th;save();render();return}
  const l=e.target.closest('#langSeg button');if(l){S.lang=l.dataset.l;save();render();return}
  const el=e.target.closest('[data-act]');if(!el)return;
  const act=el.dataset.act;if(['check','mgr','vdist'].includes(act))return;
  if(A[act]){e.preventDefault();A[act](el.dataset.v)}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if($('#modal').classList.contains('on'))closeModal();else if(UI.open)closeDrawer()}
  if(e.key==='Enter'&&e.target.matches('tr.click'))A.openV(e.target.dataset.v);
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset.act==='check'){const v=V(el.dataset.v),k=el.dataset.k;v.check[k]=el.checked;S.audit.unshift({at:Date.now(),by:S.me,a:el.checked?'aCheck':'aUncheck',obj:v.id+' '+v.name,detail:t(k,{n:S.settings.minPhotos})});refresh()}
  if(el.dataset.act==='mgr'){const v=V(el.dataset.v);v.manager=el.value;S.audit.unshift({at:Date.now(),by:S.me,a:'aMgr',obj:v.id+' '+v.name,detail:user(el.value).name});refresh()}
  if(el.dataset.act==='vdist'){UI.vd=el.value;render()}
  if(el.dataset.cat){S.settings.cats[el.dataset.cat]=el.checked;S.audit.unshift({at:Date.now(),by:S.me,a:'aSettings',obj:cn(el.dataset.cat),detail:el.checked?'on':'off'});refresh()}
  if(el.dataset.seturl){const u=el.value.trim();if(/^https?:\/\/\S+$/.test(u)){S.settings.siteUrl=u;S.audit.unshift({at:Date.now(),by:S.me,a:'aSettings',obj:'siteUrl',detail:u});refresh()}else{el.value=siteUrl()}}
  if(el.dataset.set){const n=Math.max(1,+el.value||1);S.settings[el.dataset.set]=n;S.audit.unshift({at:Date.now(),by:S.me,a:'aSettings',obj:el.dataset.set,detail:String(n)});refresh()}
});
document.addEventListener('input',e=>{
  if(e.target.id==='vq'){UI.vq=e.target.value;const pos=e.target.selectionStart;render();const i=$('#vq');i.focus();i.setSelectionRange(pos,pos)}
  if(e.target.id==='lq'){UI.lq=e.target.value;const pos=e.target.selectionStart;render();const i=$('#lq');i.focus();i.setSelectionRange(pos,pos)}
});
$('#scrim').onclick=closeDrawer;
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
$('#fileIn').onchange=e=>{addFiles(e.target.files);e.target.value=''};
window.addEventListener('hashchange',()=>{if(route()!=='add'){UI.form=null;UI.editId=null;UI.errors={}}render();window.scrollTo(0,0)});

S=load();render();
window.__bayramAdmin={get S(){return S},A,UI};
})();
</script>
</body>
</html>
