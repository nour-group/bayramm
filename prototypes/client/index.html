     contentSafeArea — собственные кнопки Telegram в полноэкранном режиме. */
  --sa-t:var(--tg-safe-area-inset-top, env(safe-area-inset-top, 0px));
  --sa-b:var(--tg-safe-area-inset-bottom, env(safe-area-inset-bottom, 0px));
  --sa-l:var(--tg-safe-area-inset-left, env(safe-area-inset-left, 0px));
  --sa-r:var(--tg-safe-area-inset-right, env(safe-area-inset-right, 0px));
  --csa-t:var(--tg-content-safe-area-inset-top, 0px);
  --csa-b:var(--tg-content-safe-area-inset-bottom, 0px);
  --pad-t:calc(var(--sa-t) + var(--csa-t));
  --pad-b:calc(var(--sa-b) + var(--csa-b));

  --t0:90ms;
  --t1:150ms;  /* taps, toggles, hovers  */
  --t2:270ms;  /* cards, chips, reveals  */
  --t3:400ms;  /* screens, sheets, modals*/
  --ease:cubic-bezier(.32,.72,0,1);        /* мягкая посадка вместо резкого щелчка */
  --ease-soft:cubic-bezier(.4,.14,.3,1);      /* enters — decelerates */
  --ease-in:cubic-bezier(.55,.06,.68,.19);     /* exits — accelerates */
  --ease-io:cubic-bezier(.65,0,.35,1);    /* moves within  */
  --r-m:16px; --r-l:22px;
  --shadow:0 2px 8px rgba(44,27,71,.06), 0 12px 28px rgba(44,27,71,.07);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
html,body{height:100%;margin:0;overscroll-behavior:none}
body{
  font-family:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
  color:var(--ink);background:var(--paper);
  -webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;
  display:flex;align-items:stretch;justify-content:center;
  overflow:hidden;
}
.stage{position:relative;display:flex;width:100%;height:100%;justify-content:center}
.shell{
  /* телефон: во весь экран. Широкий экран: колонка по центру —
     ровно так Telegram показывает мини-приложение на десктопе. */
  width:100%;max-width:440px;
  height:100vh;height:100dvh;height:var(--tg-viewport-stable-height, 100dvh);
  background:var(--paper);border-radius:0;
  overflow:hidden;overflow:clip;
  position:relative;display:flex;flex-direction:column;box-shadow:none;
}

/* header */
.tg-bar{
  flex:0 0 auto;background:var(--paper);border-bottom:1px solid var(--rule);
  padding:calc(16px + var(--pad-t)) 18px 12px;display:flex;align-items:center;justify-content:space-between;gap:12px;z-index:6;
}
.wordmark{font-family:'Unbounded',sans-serif;font-weight:700;font-size:16px;letter-spacing:-.02em;color:var(--plum)}
.wordmark span{color:var(--coral)}
/* Переключатель языка.
   Размер подобран под шапку: визуально компактный, но зона нажатия 45px по высоте. */
/* Переключатель языка: глобус и код текущего языка.
   Без флагов — флаг обозначает страну, а не язык. */
.tg-lead,.tg-acts{display:flex;align-items:center;gap:9px;flex:0 0 auto;min-width:0}
/* Два кода в общей дорожке: видно, что есть второй язык,
   и переключение в один тап без угадывания. */
.lang{position:relative;display:inline-flex;gap:3px;background:var(--lilac);
  border-radius:999px;padding:3px}
/* белая плашка едет между кодами, а не появляется заново */
.lang-pill{position:absolute;top:3px;left:3px;width:38px;height:calc(100% - 6px);
  background:var(--white);border-radius:999px;
  box-shadow:0 1px 2px rgba(44,27,71,.10),0 2px 6px rgba(44,27,71,.05);
  transition:transform var(--t2) var(--ease)}
.lang[data-l="uz"] .lang-pill{transform:translateX(41px)}
.lang button{border:0;background:none;cursor:pointer;font-family:inherit;
  font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--muted);
  width:38px;padding:8px 0;border-radius:999px;line-height:1;position:relative;z-index:1;
  transition:color var(--t2) var(--ease)}
.lang button:hover{color:var(--plum)}
.lang button.on{color:var(--plum)}
.lang button:focus-visible{outline:2px solid var(--coral);outline-offset:2px}

.me-btn{width:34px;height:34px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
  border:1px solid var(--rule);border-radius:11px;background:var(--white);color:var(--muted);
  cursor:pointer;-webkit-tap-highlight-color:transparent;
  transition:background var(--t1) var(--ease),border-color var(--t1) var(--ease),color var(--t1) var(--ease)}
.me-btn:hover{background:var(--lilac);border-color:var(--plum-mid);color:var(--plum)}
.me-btn[aria-pressed="true"]{background:var(--plum);border-color:var(--plum);color:#fff}
.me-btn:focus-visible{outline:2px solid var(--coral);outline-offset:3px}

.critwrap{position:sticky;top:0;z-index:5;background:var(--paper);padding:10px 18px 10px}
/* Главный элемент экрана: от него зависит вся выдача.
   Поэтому подпись над значением и заметная высота, а не тонкое поле. */
.crit{width:100%;min-height:64px;box-sizing:border-box;
  background:var(--white);border:1px solid var(--rule);border-radius:18px;
  padding:0 8px 0 4px;display:flex;align-items:stretch;cursor:pointer;
  font-family:inherit;text-align:left;
  box-shadow:0 1px 2px rgba(44,27,71,.04),0 6px 18px rgba(44,27,71,.06);
  transition:border-color var(--t2) var(--ease),box-shadow var(--t2) var(--ease)}
.crit:hover{border-color:var(--plum-mid);box-shadow:0 2px 4px rgba(44,27,71,.06),0 10px 26px rgba(44,27,71,.10)}
.crit.empty{border-color:var(--coral);box-shadow:0 0 0 3px var(--coral-soft),0 6px 18px rgba(238,108,77,.14)}

.seg{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:3px;
  padding:12px 10px;border-radius:14px;transition:background var(--t1) var(--ease)}
.seg:hover{background:var(--lilac)}
.seg-l{font-size:9.5px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;
  color:var(--muted-lt);line-height:1}
.seg-v{font-size:13.5px;font-weight:600;color:var(--muted-lt);line-height:1.15;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color var(--t2) var(--ease)}
.seg.on .seg-v{color:var(--ink);font-weight:700}
.seg-div{width:1px;align-self:center;height:26px;background:var(--rule);flex:0 0 auto}

.crit-go{align-self:center;width:34px;height:34px;border-radius:11px;flex:0 0 auto;
  background:var(--lilac);color:var(--plum);
  display:flex;align-items:center;justify-content:center;
  transition:background var(--t2) var(--ease),color var(--t2) var(--ease)}
.crit.empty .crit-go{background:var(--coral);color:#fff}

.hint{position:absolute;left:18px;right:18px;top:100%;margin-top:9px;z-index:6;
  display:none;align-items:center;gap:7px;background:var(--plum-deep);color:#fff;
  font-size:11px;font-weight:600;padding:8px 12px;border-radius:11px;
  box-shadow:0 8px 20px rgba(27,16,48,.3)}
.hint.on{display:flex;animation:hintIn .34s ease-out}
.hint::before{content:'';position:absolute;left:24px;top:-5px;width:10px;height:10px;
  background:var(--plum-deep);transform:rotate(45deg)}
.hint-i{width:6px;height:6px;border-radius:50%;background:var(--coral);flex:0 0 auto;
  animation:pulse 1.6s ease-in-out infinite}
@keyframes hintIn{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(1.5)}}
.critwrap{position:relative}

/* hero banner */
.hero{margin:12px 18px 0;position:relative}
.hero-track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;border-radius:18px;scroll-behavior:smooth;
  scrollbar-width:none;-webkit-overflow-scrolling:touch}
.hero-track::-webkit-scrollbar{height:0}
.slide{flex:0 0 100%;scroll-snap-align:center;aspect-ratio:16/7;position:relative;
  display:flex;align-items:flex-end;padding:12px;overflow:hidden}
.slide-ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  color:rgba(255,255,255,.5)}
.slide::after{content:'';position:absolute;inset:0;
  background:linear-gradient(to top,rgba(27,16,48,.78) 0%,rgba(27,16,48,.28) 46%,transparent 74%)}
.slide .adtag{position:absolute;left:12px;top:12px;z-index:2;background:rgba(255,255,255,.92);
  color:var(--plum);font-size:9.5px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;
  padding:3px 6px;border-radius:999px}
.slide-txt{position:relative;z-index:2;color:#fff;display:flex;flex-direction:column;gap:3px;width:100%}
.slide-txt b{font-family:'Unbounded',sans-serif;font-size:15px;font-weight:600;letter-spacing:-.01em}
.slide-txt span{font-size:11px;color:rgba(255,255,255,.82);line-height:1.35;max-width:78%}
.slide-cta{align-self:flex-start;margin-top:6px;display:inline-flex;align-items:center;gap:5px;
  font-family:inherit;font-size:11px;font-weight:700;border:0;cursor:pointer;
  background:var(--coral-deep);color:#fff;padding:6px 12px;border-radius:8px;transition:background var(--t1) var(--ease)}
.slide-cta:hover{background:#e2593a}
.dots{display:flex;gap:9px;justify-content:center;margin-top:8px;padding:4px 0;position:relative;z-index:1}
.dots button{width:5px;height:5px;border:0;padding:0;cursor:pointer;border-radius:999px;background:var(--line);transition:width var(--t2) var(--ease),background var(--t2) var(--ease)}
.dots button.on{width:16px;background:var(--coral)}
.dots button:hover{background:var(--muted)}

.scroll{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;
  transition:opacity var(--t2) var(--ease);padding-bottom:100px;
  scroll-behavior:smooth;transition:transform var(--t3) var(--ease),opacity var(--t3) var(--ease)}
.shell.deep .scroll,.shell.deep .tg-bar,.shell.deep .nav{transform:scale(.965);opacity:.6}
.tg-bar,.nav{transition:transform var(--t3) var(--ease),opacity var(--t3) var(--ease)}
.scroll::-webkit-scrollbar{width:0}
.block{padding:16px 18px 0}
.eyebrow{font-size:13.5px;font-weight:700;letter-spacing:-.01em;text-transform:none;
  color:var(--muted-lt);margin-bottom:11px;display:flex;align-items:center;gap:9px}
.eyebrow::after{content:'';flex:1;height:1px;background:var(--rule)}

/* categories */
.cats{display:flex;gap:9px;overflow-x:auto;margin:0 -18px;padding:0 18px 2px}
.cats::-webkit-scrollbar{height:0}
.cat{
  flex:0 0 auto;border:1px solid var(--rule);background:none;border-radius:999px;
  padding:8px 14px 8px 12px;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:7px;
  transition:border-color var(--t1) var(--ease),background var(--t1) var(--ease);
}
.cat:hover{border-color:var(--plum-mid)}
.cat[aria-pressed="true"]{background:var(--plum);border-color:var(--plum)}
.cat[aria-pressed="true"] .cat-n{color:#fff}
.cat[aria-pressed="true"] .cat-i{color:var(--peach)}
.cat-i{color:var(--coral);display:flex;transition:color var(--t1) var(--ease)}
.cat-n{font-size:12.5px;font-weight:600;color:var(--ink);white-space:nowrap}

/* results */
.sortbar{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:0 0 14px;margin-bottom:13px;border-bottom:1px solid var(--rule)}
.sortbar>span{font-size:9.5px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--muted-lt)}
.sortbtn{display:inline-flex;align-items:center;gap:9px;font-family:inherit;font-size:12.5px;
  font-weight:700;border:1px solid var(--rule);background:var(--white);color:var(--plum);
  padding:5px 10px 5px 5px;border-radius:11px;cursor:pointer;
  transition:border-color var(--t1) var(--ease),background var(--t1) var(--ease)}
.sortbtn:hover{border-color:var(--plum-mid);background:var(--lilac)}
/* ползунки в скруглённом квадрате — заливка, а не вторая обводка внутри рамки */
.sortbtn-i{width:24px;height:24px;border-radius:8px;flex:0 0 auto;
  background:var(--coral);color:#fff;display:flex;align-items:center;justify-content:center;
  transition:background var(--t1) var(--ease)}
.sortbtn:hover .sortbtn-i{background:#e2593a}
.sortbtn-t{line-height:1}
.sortbtn>svg{color:var(--muted-lt)}
.sortopt{align-items:center}
.sortopt.on{border-color:var(--plum);background:var(--lilac)}
.sortopt .ch-c{color:var(--teal)}
.b-rate i{font-style:normal;font-size:11px;font-weight:600;color:var(--muted-lt);margin-left:4px}
.res-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:5px}
.res-title{font-family:'Unbounded',sans-serif;font-weight:600;font-size:23px;color:var(--plum);
  letter-spacing:-.035em;line-height:1.05}
.dens{display:none}
.res-count{font-size:12.5px;font-weight:700;color:var(--muted);background:none;padding:0;
  white-space:nowrap;align-self:flex-end;padding-bottom:3px}
@keyframes tick{0%{transform:translateY(-5px);opacity:0}100%{transform:none;opacity:1}}
.res-count.tick{animation:tick var(--t2) var(--ease)}
.res-note{font-size:11px;color:var(--muted-lt);margin:0 0 12px}

.card{background:none;border:0;border-radius:0;box-shadow:none;overflow:visible;
  padding:0 0 18px;margin-bottom:18px;border-bottom:1px solid var(--rule);cursor:pointer;transition:opacity var(--t2) var(--ease)}
.card:last-child{border-bottom:0}
.card:hover .b-name{color:var(--coral)}
.card.promo .ph{outline:2px solid var(--coral);outline-offset:-2px}
.card.busy{opacity:.62}
.promo-tag{font-size:9.5px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;
  color:var(--coral);background:none;padding:0 0 6px}
.ph{aspect-ratio:3/2;position:relative;display:flex;align-items:flex-end;padding:12px;
  border-radius:44px 44px 20px 20px;overflow:hidden}
.slide::before{content:'';position:absolute;inset:0;
  background-image:var(--star);background-size:46px 46px;opacity:.3;pointer-events:none}
/* the picture is its own layer, so the tint never touches the chips on top */
.ph::before,.gal>div::before,.sv-ph::before,.rq-who-ph::before{
  content:'';position:absolute;inset:0;background-image:var(--pic);
  background-size:var(--fit);background-position:var(--pos);background-repeat:no-repeat;
  filter:hue-rotate(var(--hue,0deg));pointer-events:none}
.ph{background:var(--lilac)}
.gal>div{background:var(--lilac)}
.sv-ph,.rq-who-ph{background:var(--lilac)}
.ph-badges{display:flex;gap:7px;align-items:center}
.chip{font-size:9.5px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;
  padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.93);
  color:var(--plum);display:inline-flex;align-items:center;gap:5px}
.chip.ok{color:var(--teal)} .chip.no{color:var(--berry)}
.heart{position:absolute;right:12px;top:12px;width:34px;height:34px;border-radius:50%;border:0;
  background:rgba(255,255,255,.94);box-shadow:0 2px 8px rgba(44,27,71,.22);cursor:pointer;color:var(--plum);display:flex;align-items:center;
  justify-content:center;transition:color var(--t1) var(--ease),transform var(--t1) var(--ease)}
.heart:hover{transform:scale(1.08)}
.heart[aria-pressed="true"]{color:var(--coral)}
.body{padding:12px 2px 0}
.b-top{display:flex;align-items:baseline;justify-content:space-between;gap:9px}
.b-name{font-family:'Unbounded',sans-serif;font-size:19px;font-weight:600;color:var(--ink);
  line-height:1.25;letter-spacing:-.02em;transition:color var(--t1) var(--ease)}
.b-rate{display:inline-flex;align-items:baseline;gap:3px;
  font-size:12.5px;font-weight:700;color:var(--coral-deep);white-space:nowrap}
.b-meta{font-size:12.5px;color:var(--muted);margin-top:3px}
.b-foot{display:flex;align-items:flex-end;justify-content:space-between;margin-top:13px}
.b-price b{font-family:'Unbounded',sans-serif;font-size:19px;font-weight:600;color:var(--plum);
  letter-spacing:-.03em;line-height:1}
.b-cta{font-family:inherit;font-size:12.5px;font-weight:700;letter-spacing:0;text-transform:none;
  border:0;border-bottom:1.5px solid var(--plum);cursor:pointer;background:none;color:var(--plum);
  padding:0 0 4px;border-radius:0;transition:color var(--t1) var(--ease),border-color var(--t1) var(--ease)}
.b-cta:hover{color:var(--coral);border-color:var(--coral)}
.b-cta:disabled{color:var(--muted-lt);border-color:var(--rule);cursor:default}

.card.ad{border-color:var(--coral-soft);box-shadow:none}
.b-cta.ghost{background:var(--white);color:var(--coral);border:1.5px solid var(--coral)}
.b-cta.ghost:hover{background:var(--coral-soft)}
.empty{text-align:center;padding:40px 22px;background:none;border:0;border-top:1px solid var(--rule)}
.empty h4{font-family:'Unbounded',sans-serif;font-size:14px;color:var(--plum);margin-bottom:6px;font-weight:600}
.empty p{font-size:12.5px;color:var(--muted);line-height:1.5}

/* ---- setup sheet ---- */
.scrim{position:absolute;inset:0;background:rgba(20,11,36,.55);backdrop-filter:blur(2px);
  opacity:0;pointer-events:none;transition:opacity var(--t3) var(--ease);z-index:8}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{
  position:absolute;left:0;right:0;bottom:0;background:var(--paper);z-index:9;
  border-radius:22px 22px 0 0;padding:8px 18px calc(20px + var(--pad-b));transform:translateY(102%);
  transition:transform var(--t3) var(--ease);max-height:92%;overflow-y:auto;overflow-x:hidden;
}
.sheet.on{transform:translateY(0)}
.sheet::-webkit-scrollbar{width:0}
.grab{width:38px;height:4px;border-radius:999px;background:var(--line);margin:0 auto 14px}
.sh-title{font-family:'Unbounded',sans-serif;font-size:19px;font-weight:600;color:var(--plum);letter-spacing:-.02em}
.sh-sub{font-size:12.5px;color:var(--muted);margin-top:5px;line-height:1.5}
.step{margin-top:20px}
.step-h{display:flex;align-items:center;gap:9px;margin-bottom:9px}
.step-n{width:19px;height:19px;border-radius:8px;background:var(--plum);color:var(--peach);
  font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center}
.step-l{font-size:12.5px;font-weight:700;color:var(--ink)}
.rail{display:flex;gap:7px;overflow-x:auto;margin:0 -18px;padding:0 18px 2px}
.rail::-webkit-scrollbar{height:0}
.pill{flex:0 0 auto;font-family:inherit;font-size:13.5px;font-weight:600;border:1px solid var(--line);
  background:var(--white);color:var(--muted);padding:10px 16px;border-radius:999px;cursor:pointer;white-space:nowrap;
  transition:background var(--t1) var(--ease),color var(--t1) var(--ease),border-color var(--t1) var(--ease)}
.pill:hover{border-color:var(--plum-mid)}
.pill[aria-pressed="true"]{background:var(--plum);border-color:var(--plum);color:#fff}


.gwrap{display:flex;align-items:center;gap:12px}
.stepper{display:flex;align-items:center;gap:12px;background:var(--white);border:1px solid var(--line);
  border-radius:14px;padding:6px 10px}
.stepper button{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:var(--white);
  color:var(--plum);font-size:16px;font-weight:700;font-family:inherit;cursor:pointer;line-height:1;
  display:flex;align-items:center;justify-content:center;transition:background var(--t1) var(--ease)}
.stepper button:hover{background:var(--lilac)}
.stepper b{font-size:15px;font-weight:800;min-width:46px;text-align:center}
.presets{display:flex;gap:7px;flex:1}
.preset{flex:1;font-family:inherit;font-size:12.5px;font-weight:600;border:1px solid var(--line);
  background:var(--white);color:var(--muted);padding:10px 0;border-radius:11px;cursor:pointer;transition:background var(--t1) var(--ease),color var(--t1) var(--ease)}
.preset:hover{border-color:var(--plum-mid)}
.preset[aria-pressed="true"]{background:var(--lilac);border-color:var(--plum-mid);color:var(--plum)}

.go{width:100%;margin-top:22px;font-family:inherit;font-size:14px;font-weight:700;border:0;cursor:pointer;
  background:var(--coral-deep);color:#fff;padding:16px;border-radius:14px;transition:background var(--t1) var(--ease)}
.go:hover{background:#e2593a}
.skip{display:block;width:100%;margin-top:10px;background:none;border:0;font-family:inherit;font-size:12.5px;
  font-weight:600;color:var(--muted-lt);cursor:pointer;padding:4px}
.skip:hover{color:var(--plum)}

/* ---- vendor profile ---- */
.screen{position:absolute;inset:0;background:var(--paper);z-index:8;display:flex;flex-direction:column;box-shadow:-14px 0 40px rgba(27,16,48,0);
  transform:translateX(100%);transition:transform var(--t3) var(--ease),visibility var(--t3);visibility:hidden}
.screen.on{transform:none;visibility:visible;box-shadow:-14px 0 40px rgba(27,16,48,.16)}
.pf-top{position:absolute;left:0;right:0;top:0;z-index:3;display:flex;gap:9px;padding:14px 16px}
.pf-spacer{flex:1}
.rnd{width:38px;height:38px;border-radius:50%;border:0;background:rgba(255,255,255,.9);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  color:var(--plum);cursor:pointer;display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 10px rgba(27,16,48,.16);transition:transform var(--t1) var(--ease),color var(--t1) var(--ease)}
.rnd:hover{transform:scale(1.07)}
.rnd[aria-pressed="true"]{color:var(--coral)}
.pf-scroll{flex:1;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;padding-bottom:20px}
.pf-scroll::-webkit-scrollbar{width:0}
.gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;
  scroll-behavior:smooth;-webkit-overflow-scrolling:touch}
.gal::-webkit-scrollbar{height:0}
.gal{position:relative}
.gal>div{flex:0 0 100%;aspect-ratio:3/2;scroll-snap-align:center;display:flex;position:relative;
  align-items:center;justify-content:center;color:rgba(255,255,255,.42)}
.gal>div::after{content:'';position:absolute;left:0;right:0;bottom:0;height:86px;
  background:linear-gradient(to top,var(--paper) 0%,rgba(250,247,244,.72) 34%,transparent 100%)}
.gdots{display:flex;gap:5px;justify-content:center;margin:-26px 0 0;position:relative;z-index:2}
.gdots i{width:5px;height:5px;border-radius:999px;background:var(--rule);
  transition:width var(--t2) var(--ease),background var(--t2) var(--ease)}
.gdots i.on{width:16px;background:var(--plum)}
.pf-body{padding:16px 18px 0}
.pf-name{font-family:'Unbounded',sans-serif;font-size:27px;font-weight:600;color:var(--plum);
  letter-spacing:-.04em;line-height:1.05}
.pf-meta{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--muted);margin-top:7px;flex-wrap:wrap}
.pf-meta>span{display:inline-flex;align-items:center}
.dot-sep{width:3px;height:3px;border-radius:50%;background:var(--rule);flex:0 0 auto}
.pf-meta b{display:inline-flex;align-items:center;gap:5px;color:var(--coral);font-weight:700}
.sec{margin-top:20px}
.sec-h{font-size:13.5px;font-weight:700;letter-spacing:-.01em;text-transform:none;
  color:var(--muted-lt);margin-bottom:11px;display:flex;align-items:center;gap:9px}
.sec-h::after{content:'';flex:1;height:1px;background:var(--rule)}
.ver{width:100%;border:0;border-left:2px solid var(--teal);background:none;border-radius:0;
  padding:3px 0 3px 14px;cursor:pointer;font-family:inherit;text-align:left;display:flex;gap:12px;align-items:flex-start}
.ver-t{flex:1;min-width:0}
.ver-c{flex:0 0 auto;color:var(--teal);margin-top:2px;transition:transform var(--t2) var(--ease)}
.ver.open .ver-c{transform:rotate(180deg)}
.ver-i{color:var(--teal);flex:0 0 auto;display:flex;margin-top:1px}
.ver b{font-size:13.5px;font-weight:700;color:var(--teal);display:block}
.ver small{font-size:11px;color:#4B8A83;display:block;margin-top:2px}
.ver ul{margin:8px 0 0;padding-left:16px;display:none}
.ver.open ul{display:block}
.ver li{font-size:11px;color:#3F7A73;line-height:1.5}
.pk{display:flex;flex-direction:column}
.pk>div{display:flex;align-items:baseline;justify-content:space-between;gap:12px;
  padding:12px 0;border-bottom:1px solid var(--rule)}
.pk>div:last-child{border-bottom:0}
.pk span{font-size:12.5px;color:var(--ink);font-weight:600}
.pk b{font-family:'Unbounded',sans-serif;font-size:19px;font-weight:600;color:var(--plum);letter-spacing:-.03em}
.cal-note{display:flex;gap:7px;align-items:flex-start;font-size:11px;color:var(--muted-lt);margin-top:8px;line-height:1.4}
.fts{display:flex;flex-wrap:wrap;gap:7px}
.ft{display:inline-flex;align-items:center;gap:7px;background:none;border:1px solid var(--rule);
  border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:600;color:var(--ink)}
.ft svg{color:var(--coral)}
.about{font-size:13.5px;color:var(--ink);line-height:1.5}
.rv{background:none;border:0;border-bottom:1px solid var(--rule);border-radius:0;padding:0 0 14px;margin-bottom:13px}
.rv:last-child{border-bottom:0;margin-bottom:0}
.rv-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}
.rv-h b{font-size:12.5px;font-weight:700;color:var(--ink)}
.rv-h i{font-style:normal;font-size:11px;color:var(--muted-lt)}
.rv-s{color:var(--coral-deep);font-size:11px;letter-spacing:1px}
.rv p{font-size:12.5px;color:var(--muted);line-height:1.5;margin-top:3px}
.pf-bar{flex:0 0 auto;background:rgba(250,247,244,.97);backdrop-filter:blur(12px);
  border-top:1px solid var(--rule);padding:12px 16px 20px;display:flex;align-items:center;gap:9px}
.pf-price b{font-family:'Unbounded',sans-serif;font-size:22px;font-weight:600;color:var(--plum);display:block;letter-spacing:-.03em;line-height:1}
.pf-price span{font-size:11px;color:var(--muted-lt)}
.pf-acts{margin-left:auto;display:flex;gap:9px}
.pf-call{width:44px;height:44px;border-radius:14px;border:1.5px solid var(--line);background:var(--white);
  color:var(--plum);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background var(--t1) var(--ease)}
.pf-call:hover{background:var(--lilac)}
.pf-req{font-family:inherit;font-size:14px;font-weight:700;border:0;cursor:pointer;background:var(--coral-deep);
  color:#fff;padding:0 20px;height:44px;border-radius:14px;transition:background var(--t1) var(--ease)}
.pf-req:hover{background:#e2593a}
.pf-note{font-size:11px;color:var(--muted-lt);text-align:center;padding:0 18px 10px;line-height:1.4}

.me-top{display:flex;align-items:center;gap:12px;padding:4px 0 16px;border-bottom:1px solid var(--rule)}
.me-av{width:52px;height:52px;border-radius:18px;background:var(--plum);color:var(--peach);
  flex:0 0 auto;display:flex;align-items:center;justify-content:center}
.me-top b{display:block;font-family:'Unbounded',sans-serif;font-size:16px;font-weight:600;
  color:var(--plum);letter-spacing:-.03em}
.me-top span{display:block;font-size:11px;color:var(--muted);margin-top:3px}
.me-row{width:100%;display:flex;align-items:center;gap:12px;padding:14px 0;background:none;border:0;
  border-bottom:1px solid var(--rule);cursor:pointer;font-family:inherit;text-align:left}
.me-i{width:32px;height:32px;border-radius:11px;flex:0 0 auto;display:flex;align-items:center;
  justify-content:center;background:var(--lilac);color:var(--plum)}
.me-b{flex:1;min-width:0}
.me-b b{display:block;font-size:13.5px;font-weight:700;color:var(--ink)}
.me-b span{display:block;font-size:11px;color:var(--muted);margin-top:2px;line-height:1.4}
.sw-t{width:42px;height:24px;border-radius:999px;background:var(--rule);flex:0 0 auto;position:relative;
  transition:background var(--t2) var(--ease)}
.sw-t i{position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;
  transition:transform var(--t2) var(--ease);box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw-t.on{background:var(--teal)}
.sw-t.on i{transform:translateX(18px)}
.info-b{margin-top:12px}
.info-b p{font-size:12.5px;color:var(--ink);line-height:1.5;margin-bottom:9px}
.info-b p.warn{border-left:2px solid var(--coral);padding-left:12px;color:var(--muted)}
.info-b ul{list-style:none;margin:0 0 10px;padding:0}
.info-b li{font-size:12.5px;color:var(--ink);padding:6px 0 6px 16px;position:relative;
  border-bottom:1px solid var(--rule)}
.info-b li:last-child{border-bottom:0}
.info-b li::before{content:'';position:absolute;left:2px;top:13px;width:4px;height:4px;
  border-radius:50%;background:var(--teal)}
.perm-i.dgr{background:#FAE7EC;color:var(--berry)}
.perm-i.coral{background:var(--coral-soft);color:var(--coral)}
.me-legal{margin-top:24px;padding:14px;border:1px dashed var(--rule);border-radius:14px;background:none}
.me-legal b{display:block;font-size:11px;font-weight:700;color:var(--muted)}
.me-legal p{font-size:11px;color:var(--muted-lt);margin-top:4px;line-height:1.5}
.me-foot{margin-top:26px;padding-top:18px;border-top:1px solid var(--rule);text-align:center}
.me-wipe{font-family:inherit;font-size:11px;font-weight:600;border:0;background:none;
  color:var(--muted-lt);cursor:pointer;padding:6px 10px;border-radius:8px;
  text-decoration:underline;text-decoration-color:var(--rule);text-underline-offset:3px;
  transition:color var(--t1) var(--ease),background var(--t1) var(--ease)}
.me-wipe:hover{color:var(--berry);background:#FAE7EC;text-decoration-color:var(--berry)}
.me-ver{text-align:center;font-size:10px;color:var(--muted-lt);margin-top:12px;letter-spacing:.06em}
.mt-card{background:var(--white);border:1px solid var(--rule);border-radius:18px;
  padding:14px 16px;box-shadow:0 2px 10px rgba(44,27,71,.05)}
.mt-ask{padding:0}
.mt-ask-t{font-family:'Unbounded',sans-serif;font-size:19px;font-weight:600;color:var(--plum);
  letter-spacing:-.03em;margin-bottom:11px}
.mt-ask-s{font-size:12.5px;color:var(--muted);line-height:1.5;margin-top:10px}
#critToy{margin:0}

.mt-head{display:flex;align-items:center;gap:12px}
.mt-oc{width:48px;height:48px;border-radius:14px;background:var(--plum);color:var(--peach);
  flex:0 0 auto;display:flex;align-items:center;justify-content:center}
.mt-h-t{flex:1;min-width:0}
.mt-h-t b{display:block;font-family:'Unbounded',sans-serif;font-size:19px;font-weight:600;
  color:var(--plum);letter-spacing:-.035em;line-height:1.15;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mt-h-t span{display:block;font-size:12.5px;color:var(--muted);margin-top:4px}
.mt-edit{width:38px;height:38px;border-radius:11px;border:1px solid var(--rule);background:none;
  color:var(--plum);cursor:pointer;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
  transition:background var(--t1) var(--ease)}
.mt-edit:hover{background:var(--lilac)}

/* прогресс живёт внутри карточки, отделён линией */
.mt-prog{margin-top:14px;padding-top:14px;border-top:1px solid var(--rule)}
.mt-prog-t{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.mt-prog-t span{font-size:9.5px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--muted-lt)}
.mt-prog-t b{font-family:'Unbounded',sans-serif;font-size:15px;font-weight:600;color:var(--plum);letter-spacing:-.03em}
.mt-bar{height:6px;border-radius:3px;background:var(--lilac);overflow:hidden;position:relative}
.mt-bar i{display:block;height:100%;background:var(--teal);border-radius:3px;
  transition:width 620ms var(--ease)}
.mt-bar::after{content:'';position:absolute;inset:0;width:40%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);
  animation:sweep 1.9s var(--ease-io) .4s 2}
.mt-bill{position:relative;margin-top:14px;background:var(--white);border:1px solid var(--rule);
  border-bottom:0;border-radius:14px 14px 0 0;padding:16px 16px 12px}
.mt-bill::after{content:'';position:absolute;left:-1px;right:-1px;bottom:-9px;height:10px;
  background:
    radial-gradient(circle at 5px 0, transparent 5px, var(--rule) 5px, var(--rule) 6px, transparent 6px) repeat-x,
    radial-gradient(circle at 5px 0, transparent 5px, var(--paper) 6px) repeat-x;
  background-size:10px 10px}
.bill-h{font-size:9.5px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;
  color:var(--muted-lt);padding-bottom:12px;border-bottom:1px dashed var(--rule)}
.bill-row{display:flex;align-items:baseline;gap:7px;padding:10px 0 0}
.bill-n{font-size:12.5px;font-weight:600;color:var(--ink);white-space:nowrap}
.bill-n i{font-style:normal;font-size:10px;color:var(--muted-lt);margin-left:6px;font-weight:600}
.bill-d{flex:1;border-bottom:1px dotted var(--rule);transform:translateY(-3px)}
.bill-p{font-family:'Unbounded',sans-serif;font-size:13.5px;font-weight:600;color:var(--ink);
  letter-spacing:-.02em;white-space:nowrap}
.bill-sum{display:flex;align-items:baseline;justify-content:space-between;gap:12px;
  margin-top:13px;padding-top:12px;border-top:1px dashed var(--rule)}
.bill-sum span{font-size:9.5px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.bill-sum b{font-family:'Unbounded',sans-serif;font-size:22px;font-weight:600;color:var(--plum);letter-spacing:-.04em}
.bill-note{font-size:11px;color:var(--muted-lt);line-height:1.5;margin-top:11px}
.mt-add{width:100%;display:flex;align-items:center;justify-content:center;gap:7px;margin-top:14px;
  font-family:inherit;font-size:12.5px;font-weight:700;letter-spacing:.06em;
  border:1px dashed var(--rule);background:none;color:var(--plum);padding:14px;border-radius:14px;
  cursor:pointer;transition:background var(--t1) var(--ease),border-color var(--t1) var(--ease)}
.mt-add:hover{background:var(--lilac);border-color:var(--plum-mid);border-style:solid}
.mt-x{position:absolute;right:0;top:50%;transform:translateY(-50%);width:26px;height:26px;
  border-radius:50%;border:1px solid var(--rule);background:var(--paper);color:var(--muted);
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:color var(--t1) var(--ease),border-color var(--t1) var(--ease)}
.mt-row[data-extra]{position:relative;padding-right:34px}
.mt-x:hover{color:var(--berry);border-color:var(--berry)}
.add-in{min-height:auto;padding:14px 14px;font-size:14px;margin-top:14px}
.add-hint{font-size:11px;color:var(--muted-lt);margin-top:9px;line-height:1.5}
.ch-list{display:flex;flex-direction:column;gap:9px;margin-top:14px}
.ch{display:flex;align-items:center;gap:12px;width:100%;padding:12px;border:1px solid var(--rule);
  background:var(--white);border-radius:14px;cursor:pointer;font-family:inherit;text-align:left;
  transition:border-color var(--t1) var(--ease),background var(--t1) var(--ease)}
.ch:hover{border-color:var(--plum-mid);background:var(--lilac)}
.ch-i{width:38px;height:38px;border-radius:11px;flex:0 0 auto;display:flex;align-items:center;justify-content:center}
.ch-i.tg{background:var(--lilac);color:var(--plum)}
.ch-i.mail{background:var(--coral-soft);color:var(--coral)}
.ch-b{flex:1;min-width:0}
.ch-b b{display:block;font-size:13.5px;font-weight:700;color:var(--ink)}
.ch-b span{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.ch-c{color:var(--muted-lt);flex:0 0 auto}
.sent-nav{display:flex;gap:9px;margin-top:18px}
.sent-nav button{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;
  font-family:inherit;font-size:12.5px;font-weight:700;cursor:pointer;border:1px solid var(--rule);
  background:none;color:var(--plum);padding:14px 0;border-radius:14px;
  transition:background var(--t1) var(--ease)}
.sent-nav button:hover{background:var(--lilac)}
.mt-row{transition:background var(--t1) var(--ease);display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--rule);cursor:pointer}
.mt-row:last-child{border-bottom:0}
.mt-row.done{cursor:default}
.mt-i{width:32px;height:32px;border-radius:11px;flex:0 0 auto;display:flex;align-items:center;
  justify-content:center;background:var(--lilac);color:var(--muted-lt)}
.mt-i.ok{background:var(--teal-soft);color:var(--teal)}
.mt-b{flex:1;min-width:0}
.mt-b b{display:block;font-size:13.5px;font-weight:700;color:var(--ink)}
.mt-b span{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.mt-go{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:700;
  letter-spacing:.12em;text-transform:uppercase;color:var(--plum);flex:0 0 auto}
.st{font-size:9.5px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;
  padding:5px 10px;border-radius:999px;flex:0 0 auto;white-space:nowrap}
.st-new{background:var(--lilac);color:var(--muted)}
.st-ans{background:#FDE7DC;color:#9E3F22}
.st-deal{background:var(--teal-soft);color:#1F6E66}
#viewSearch,#viewSaved,#viewToy,#viewSoon{animation:riseIn var(--t2) var(--ease) both}
.sv-empty{text-align:center;padding:70px 30px}
.sv-empty>span{color:var(--rule);display:flex;justify-content:center;margin-bottom:16px}
.sv-empty h4{font-family:'Unbounded',sans-serif;font-size:19px;font-weight:600;color:var(--plum);letter-spacing:-.03em}
.sv-empty p{font-size:12.5px;color:var(--muted);line-height:1.5;margin-top:8px}
.sv-go{margin-top:18px;font-family:inherit;font-size:11px;font-weight:700;letter-spacing:.12em;
  text-transform:uppercase;border:0;border-bottom:1.5px solid var(--plum);background:none;color:var(--plum);
  padding:0 0 4px;cursor:pointer}
.sv-row{transition:background var(--t1) var(--ease);display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--rule)}
.sv-row:last-child{border-bottom:0}
.sv-row.pick .sv-b b{color:var(--coral)}
.sv-chk{width:22px;height:22px;border-radius:8px;border:1.5px solid var(--rule);background:var(--white);
  flex:0 0 auto;cursor:pointer;color:transparent;display:flex;align-items:center;justify-content:center;transition:all var(--t1) var(--ease)}
.sv-chk[aria-pressed="true"]{background:var(--coral);border-color:var(--coral);color:#fff}
.sv-ph{width:44px;height:44px;border-radius:11px;flex:0 0 auto;position:relative;overflow:hidden}
.sv-ph::before{content:'';position:absolute;inset:0;background-image:var(--star);background-size:44px 44px;opacity:.38}
.sv-b{flex:1;min-width:0;cursor:pointer}
.sv-b b{display:block;font-family:'Unbounded',sans-serif;font-size:13.5px;font-weight:600;color:var(--ink);letter-spacing:-.02em}
.sv-b>span{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.sv-b i{display:block;font-style:normal;font-size:10px;font-weight:700;margin-top:3px;letter-spacing:.04em}
.good{color:var(--teal)} .bad{color:var(--berry)}
.sv-x{width:24px;height:24px;border-radius:50%;border:1px solid var(--rule);background:none;color:var(--muted-lt);
  flex:0 0 auto;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:color var(--t1) var(--ease)}
.sv-x:hover{color:var(--berry);border-color:var(--berry)}
.sv-share{width:100%;display:flex;align-items:center;justify-content:center;gap:9px;font-family:inherit;
  font-size:13.5px;font-weight:700;border:1px solid var(--rule);background:none;color:var(--plum);
  padding:14px;border-radius:14px;cursor:pointer;transition:background var(--t1) var(--ease)}
.sv-share:hover{background:var(--lilac)}
.sv-tools{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.sv-all{display:inline-flex;align-items:center;gap:7px;font-family:inherit;font-size:11px;font-weight:700;
  letter-spacing:.06em;border:1px solid var(--rule);background:none;color:var(--plum);
  padding:6px 12px 6px 8px;border-radius:999px;cursor:pointer;white-space:nowrap;transition:all var(--t1) var(--ease)}
.sv-all:hover{border-color:var(--plum-mid)}
.sv-all-b{width:16px;height:16px;border-radius:8px;border:1.5px solid var(--rule);background:var(--white);
  display:flex;align-items:center;justify-content:center;color:transparent;transition:all var(--t1) var(--ease)}
.sv-all[aria-pressed="true"]{background:var(--plum);border-color:var(--plum);color:#fff}
.sv-all[aria-pressed="true"] .sv-all-b{background:var(--coral);border-color:var(--coral);color:#fff}
.cmp-bar{position:sticky;bottom:8px;margin:14px 18px 0;background:var(--plum);border-radius:18px;
  padding:12px 10px;display:block;box-shadow:0 8px 26px rgba(27,16,48,.34)}
.cmp-n{display:flex;align-items:baseline;gap:9px;padding:0 4px 10px;flex-wrap:wrap}
.cmp-n b{font-size:12.5px;font-weight:700;color:#fff}
.cmp-n i{font-style:normal;font-size:11px;color:var(--peach);font-weight:600}
.cmp-acts{display:flex;gap:7px}
.cmp-acts button{flex:1;min-width:0;height:52px;border-radius:14px;border:0;
  background:rgba(255,255,255,.13);color:#fff;cursor:pointer;font-family:inherit;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  transition:background var(--t1) var(--ease),opacity var(--t1) var(--ease)}
.cmp-acts button span{font-size:11px;font-weight:700;letter-spacing:.02em;white-space:nowrap}
.cmp-acts button svg{flex:0 0 auto}
.cmp-acts button:hover:not(:disabled){background:rgba(255,255,255,.24)}
.cmp-acts button:disabled{opacity:.32;cursor:not-allowed}
.cmp-acts button.pri:not(:disabled){background:var(--coral)}
.cmp-acts button.pri:not(:disabled):hover{background:#e2593a}
.cmp-acts button.dgr{color:#F6B9C6}
.cmp-acts button.dgr:hover{background:rgba(168,47,82,.42);color:#fff}
.sv-head{padding:14px 18px 4px}
.sv-back{display:inline-flex;align-items:center;gap:7px;font-family:inherit;font-size:11px;font-weight:700;
  letter-spacing:.12em;text-transform:uppercase;border:0;background:none;color:var(--plum);cursor:pointer;padding:0}
.cmp{padding:8px 18px 18px;overflow-x:auto}
.cmp table{width:100%;border-collapse:collapse}
.cmp th{font-family:'Unbounded',sans-serif;font-size:12.5px;font-weight:600;color:var(--plum);
  text-align:left;padding:0 8px 10px;letter-spacing:-.02em;vertical-align:bottom}
.cmp td{font-size:12.5px;color:var(--ink);padding:10px 8px;border-top:1px solid var(--rule);vertical-align:middle}
.cmp tr td:first-child{font-size:9.5px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;
  color:var(--muted-lt);width:74px}
.cmp td b{font-family:'Unbounded',sans-serif;font-size:14px;font-weight:600;color:var(--plum);letter-spacing:-.02em}
.cmp td i{font-style:normal;font-size:11px;font-weight:700}
.cmp-cta{font-family:inherit;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  border:0;border-bottom:1.5px solid var(--plum);background:none;color:var(--plum);padding:0 0 3px;cursor:pointer}

/* ---- date picker ---- */
.dpick{width:100%;display:flex;align-items:center;gap:12px;padding:12px 12px;cursor:pointer;
  font-family:inherit;text-align:left;background:var(--white);border:1px solid var(--rule);
  border-radius:14px;transition:border-color var(--t1) var(--ease)}
.dpick:hover{border-color:var(--plum-mid)}
.dpick.on{border-color:var(--plum)}
.dpick-i{color:var(--muted-lt);display:flex;flex:0 0 auto}
.dpick.on .dpick-i{color:var(--coral)}
.dpick-t{flex:1;font-size:13.5px;font-weight:600;color:var(--muted-lt)}
.dpick.on .dpick-t{color:var(--ink);font-weight:700}
.dpick-c{width:24px;height:24px;border-radius:8px;background:var(--lilac);color:var(--plum);
  display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.dp{margin-top:9px;background:var(--white);border:1px solid var(--rule);border-radius:18px;
  padding:14px 12px 12px;overflow:hidden}
/* в профиле календарь — часть страницы, а не виджет в рамке */
#profile .dp{background:none;border:0;border-radius:0;padding:0;margin-top:0;max-width:420px}

.dp-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;
  margin-bottom:14px;padding:0 2px}
/* Заголовок и есть контрол: текст наш, выбор — родной системный.
   Прозрачный select лежит поверх слова. */
.dp-title{display:flex;align-items:baseline;flex-wrap:wrap;gap:0 7px;min-width:0}
.dp-pick{position:relative;display:inline-flex;align-items:baseline}
.dp-mo,.dp-yr{border:0;background:none;padding:2px 4px;margin:0 -4px;border-radius:8px;
  cursor:pointer;font-family:'Unbounded',sans-serif;font-size:19px;font-weight:600;
  letter-spacing:-.035em;line-height:1.1;
  transition:background var(--t1) var(--ease),color var(--t1) var(--ease)}
.dp-mo{color:var(--plum);text-transform:capitalize}
.dp-yr{color:var(--muted-lt)}
.dp-mo:hover,.dp-yr:hover{background:var(--lilac);color:var(--plum)}
.dp-mo[aria-expanded="true"],.dp-yr[aria-expanded="true"]{background:var(--plum);color:#fff}
.dp-caret{align-self:center;color:var(--muted-lt);display:flex;margin-left:-2px;pointer-events:none}

/* свой список вместо системного */
.dp-menu{position:absolute;left:-6px;top:calc(100% + 8px);z-index:20;
  min-width:150px;max-height:236px;overflow-y:auto;overflow-x:hidden;
  background:var(--white);border:1px solid var(--rule);border-radius:14px;padding:5px;
  box-shadow:0 2px 6px rgba(44,27,71,.08),0 14px 34px rgba(44,27,71,.16);
  display:flex;flex-direction:column;gap:3px;
  animation:dpMenuIn .18s var(--ease) both}
@keyframes dpMenuIn{from{opacity:0;transform:translateY(-6px) scale(.98)}to{opacity:1;transform:none}}
.dp-menu::-webkit-scrollbar{width:0}
.dp-menu button{display:flex;align-items:center;justify-content:space-between;gap:12px;
  width:100%;border:0;background:none;cursor:pointer;font-family:inherit;
  font-size:13.5px;font-weight:600;color:var(--ink);text-align:left;
  padding:10px 12px;border-radius:8px;white-space:nowrap;
  transition:background var(--t1) var(--ease),color var(--t1) var(--ease)}
.dp-menu button:hover{background:var(--lilac)}
.dp-menu button.on{background:var(--lilac);color:var(--plum);font-weight:700}
.dp-menu button.on svg{color:var(--teal);flex:0 0 auto}

.dp-nav{display:flex;gap:5px;flex:0 0 auto}
.dp-nav button{width:30px;height:30px;border-radius:8px;border:1px solid var(--rule);background:none;
  color:var(--plum);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background var(--t1) var(--ease)}
.dp-nav button:hover:not(:disabled){background:var(--lilac)}
.dp-nav button:disabled{color:var(--muted-lt);cursor:not-allowed;opacity:.35}

.dp-g{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.dp-g em{aspect-ratio:1/.62;display:flex;align-items:center;justify-content:center;font-style:normal;
  font-size:9.5px;font-weight:700;color:var(--muted-lt);text-transform:uppercase;letter-spacing:.18em}
.dp-g em.we{color:var(--coral)}

/* Спокойный фон: свободный день — просто число.
   Цветом отмечено только то, что нельзя выбрать. */
.dp-g b{aspect-ratio:1/1.06;border-radius:11px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:3px;font-weight:600;position:relative;overflow:hidden;
  background:none;transition:transform var(--t1) var(--ease),background var(--t1) var(--ease)}
.dp-g b.we{background:#FBF6F1}
.dp-g b u{text-decoration:none;font-size:13.5px;color:var(--ink);line-height:1}
.dp-g b s{text-decoration:none;font-size:10px;font-weight:600;color:var(--muted-lt);line-height:1}
.dp-g b.ok{cursor:pointer}
.dp-g b.ok:hover{background:var(--lilac);transform:translateY(-1px)}
.dp-g b.ok.we:hover{background:#F6EDE4}
.dp-g b.no{background:#FBEEF1;cursor:not-allowed}
.dp-g b.no u{color:#B57C90;text-decoration:line-through}
.dp-g b.past{opacity:.28}
.dp-g b.past u{color:var(--muted-lt)}
.dp-g b.sel{background:var(--plum);box-shadow:0 4px 14px rgba(44,27,71,.28)}
.dp-g b.sel::after{content:'';position:absolute;inset:0;background-image:var(--star);
  background-size:38px 38px;opacity:.45}
.dp-g b.sel u,.dp-g b.sel s{color:#fff;position:relative;z-index:1}
.dp-g b.sel s{opacity:.75}
.dp-g b.pad{visibility:hidden}

/* сколько вендоров свободно в этот день — только в поиске */
.bars{display:block;width:15px;height:2.5px;border-radius:3px;background:var(--rule);position:relative;overflow:hidden}
.bars::after{content:'';position:absolute;left:0;top:0;bottom:0;width:var(--f);background:var(--teal);border-radius:3px}
.bars.mini{width:13px;margin-right:1px}

.dp-leg{display:flex;flex-wrap:wrap;gap:12px;margin-top:14px;padding-top:12px;border-top:1px solid var(--rule)}
.dp-leg span{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:600;color:var(--muted)}
.dp-hint{color:var(--muted-lt)!important}
.dp-we{color:var(--muted)!important}
.dp-we::before{content:'';width:9px;height:9px;border-radius:3px;background:#FBF6F1;border:1px solid #EDDDCE}
.sw{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
.sw.ok{background:none;border:1.5px solid var(--rule)}
.sw.no{background:#FBEEF1;border:1px solid #E7C3CD}
.sw.sel{background:var(--plum)}
.nodate2{width:100%;margin-top:8px;font-family:inherit;font-size:12.5px;font-weight:600;
  border:1px dashed var(--rule);background:none;color:var(--muted);padding:10px;border-radius:11px;cursor:pointer;
  transition:background var(--t1) var(--ease),color var(--t1) var(--ease)}
.nodate2[aria-pressed="true"]{background:var(--lilac);border-style:solid;border-color:var(--plum-mid);color:var(--plum)}


/* ============ SPLASH ============
   Одна фигура — звёздчатый восьмиугольник {8/3}, тот самый гирих.
   Ведётся одной непрерывной линией, как её выкладывает мастер.
   Два цвета: глубокий сливовый и персиковый свет. */
.splash{position:absolute;inset:0;z-index:60;overflow:hidden;
  background:radial-gradient(105% 78% at 50% 42%, #2E1C4C 0%, #1E1236 50%, #120A20 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:var(--pad-t) var(--sa-r) var(--pad-b) var(--sa-l);
  opacity:1;transition:opacity .6s var(--ease)}
.splash.done{opacity:0;pointer-events:none}
.splash.hidden{display:none}
.spl-vignette{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(66% 56% at 50% 46%, transparent 52%, rgba(6,3,13,.6) 100%)}

.spl-stage{position:relative;width:100%;height:296px;display:flex;
  align-items:center;justify-content:center;flex:0 0 auto}

.spl-girih{position:absolute;width:262px;height:262px;overflow:visible;
  fill:none;stroke:var(--peach);stroke-linejoin:miter;stroke-miterlimit:10}
/* звезда: одна линия, 1153px периметра — чертится от первой вершины до замыкания */
.g-starline{stroke-width:1;opacity:.95;stroke-dasharray:1153;stroke-dashoffset:1153}
/* центр гасим, иначе линии перечёркивают знак */
.g-clear{opacity:0;transform:scale(.7);transform-origin:100px 100px}
.is-live .g-clear{animation:splClearIn .7s var(--ease) 2.15s both}
@keyframes splClearIn{to{opacity:1;transform:scale(1)}}
.g-oct{stroke-width:.5;opacity:.4;stroke-dasharray:248;stroke-dashoffset:248}
.g-ring{stroke-width:.4;opacity:.2;stroke-dasharray:491;stroke-dashoffset:491}
.g-glow{opacity:0;transform:scale(.55);transform-origin:100px 100px}

.is-live .g-starline{animation:splDraw 2.1s cubic-bezier(.45,.02,.12,1) .25s both}
.is-live .g-oct {animation:splDraw 1s   cubic-bezier(.45,.02,.12,1) 1.75s both}
.is-live .g-ring{animation:splDraw 1.3s cubic-bezier(.45,.02,.12,1) 1.55s both}
.is-live .g-glow{animation:splGlow 1.8s var(--ease) 1.9s both}
@keyframes splDraw{to{stroke-dashoffset:0}}
@keyframes splGlow{to{opacity:1;transform:scale(1)}}

/* дочерченный узор едва дышит — экран не выглядит застывшим */
.is-live .spl-girih{animation:splBreathe 7s ease-in-out 3.4s infinite}
@keyframes splBreathe{50%{transform:scale(1.014)}}

/* --- знак: шторка, затем блик --- */
.spl-logo-wrap{position:relative;z-index:2;width:150px;overflow:hidden}
.spl-logo{display:block;width:100%;height:auto;
  clip-path:inset(0 100% 0 0);filter:drop-shadow(0 4px 20px rgba(0,0,0,.5))}
.is-live .spl-logo{animation:splWipe 1s cubic-bezier(.62,0,.12,1) 2.35s both}
@keyframes splWipe{to{clip-path:inset(0 0 0 0)}}
.spl-logo-wrap::after{content:'';position:absolute;inset:-30% -60%;
  background:linear-gradient(102deg,transparent 42%,rgba(255,255,255,.4) 50%,transparent 58%);
  transform:translateX(-130%);pointer-events:none}
.is-live .spl-logo-wrap::after{animation:splSheen 1.2s cubic-bezier(.4,0,.2,1) 3.1s both}
@keyframes splSheen{to{transform:translateX(130%)}}

/* --- слоган: антиква, тонко и просторно --- */
.spl-slogan{display:grid;place-items:center;text-align:center;margin-top:22px;
  min-height:3em;padding:0 26px;flex:0 0 auto;z-index:2}
.spl-slogan span{grid-area:1/1;max-width:20ch;
  font-family:'Cormorant',Georgia,serif;font-weight:300;font-style:italic;
  font-size:clamp(21px,5.6vw,25px);letter-spacing:.01em;line-height:1.35;
  color:rgba(255,255,255,.9);opacity:0;transform:translateY(8px);
  transition:opacity .6s var(--ease),transform .6s var(--ease)}
.spl-slogan span.on{opacity:1;transform:none}
.spl-slogan span.up{opacity:0;transform:translateY(-10px)}

@media (prefers-reduced-motion:reduce){
  .g-starline,.g-oct,.g-ring{stroke-dashoffset:0;animation:none!important}
  .g-clear{opacity:1;transform:none;animation:none!important}
  .g-glow{opacity:1;transform:none;animation:none!important}
  .is-live .spl-girih{animation:none}
  .spl-logo{clip-path:none;animation:none!important}
  .spl-logo-wrap::after{display:none}
  .spl-slogan span{transition:none}
  .splash{transition:none}
}

/* ---- search ---- */
#search{z-index:9}
.sr-top{flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:14px 18px 12px;
  border-bottom:1px solid var(--rule)}
/* на этом экране под кнопкой бумага, а не фотография — стекло тут ни к чему */
#srBack{width:46px;height:46px;flex:0 0 auto;border-radius:14px;background:none;
  border:1px solid var(--rule);box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none}
#srBack:hover{background:var(--lilac);transform:none}
.sr-field{flex:1;min-width:0;height:46px;display:flex;align-items:center;gap:9px;
  background:var(--white);border:1px solid var(--rule);border-radius:14px;padding:0 8px 0 12px;
  transition:border-color var(--t1) var(--ease)}
.sr-field:focus-within{border-color:var(--plum-mid)}
.sr-i{color:var(--muted-lt);display:flex;flex:0 0 auto}
.sr-field input{flex:1;min-width:0;height:100%;border:0;outline:none;background:none;
  appearance:none;-webkit-appearance:none;font-family:inherit;
  font-size:14px;color:var(--ink);padding:0}
.sr-field input::placeholder{color:var(--muted-lt)}
.sr-field input::-webkit-search-cancel-button,
.sr-field input::-webkit-search-decoration{display:none;-webkit-appearance:none}
#srClear{width:26px;height:26px;border-radius:50%;border:0;background:var(--lilac);color:var(--muted);
  cursor:pointer;display:none;align-items:center;justify-content:center;flex:0 0 auto;padding:0}
#srClear.on{display:flex}
#srClear:hover{background:var(--rule);color:var(--plum)}
.sr-body{flex:1;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;padding:2px 18px 24px}
.sr-body::-webkit-scrollbar{width:0}
.sr-sec{margin-top:18px}
.sr-chips{display:flex;flex-wrap:wrap;gap:7px}
.sr-chip{display:inline-flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;
  font-weight:600;border:1px solid var(--rule);background:none;color:var(--ink);
  padding:10px 14px;border-radius:999px;cursor:pointer;
  transition:background var(--t1) var(--ease),border-color var(--t1) var(--ease)}
.sr-chip svg{color:var(--coral);flex:0 0 auto}
.sr-chip:hover{background:var(--lilac);border-color:var(--plum-mid)}
.sr-note{font-size:11px;color:var(--muted-lt);line-height:1.5;margin-top:22px;
  padding-top:16px;border-top:1px solid var(--rule)}
.sr-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--rule);cursor:pointer}
.sr-row:last-child{border-bottom:0}
.sr-row:hover b{color:var(--coral)}
.sr-ph{width:48px;height:48px;border-radius:14px;flex:0 0 auto;position:relative;overflow:hidden;
  background:var(--lilac)}
.sr-ph::before{content:'';position:absolute;inset:0;background-image:var(--pic);
  background-size:var(--fit);background-position:var(--pos);background-repeat:no-repeat;
  filter:hue-rotate(var(--hue,0deg))}
.sr-b{flex:1;min-width:0}
.sr-b b{display:block;font-family:'Unbounded',sans-serif;font-size:13.5px;font-weight:600;
  color:var(--ink);letter-spacing:-.02em;transition:color var(--t1) var(--ease);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sr-b span{display:block;font-size:11px;color:var(--muted);margin-top:3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sr-p{font-family:'Unbounded',sans-serif;font-size:12.5px;font-weight:600;color:var(--plum);
  letter-spacing:-.02em;white-space:nowrap;flex:0 0 auto}
.sr-empty{text-align:center;padding:60px 24px}
.sr-empty>span{color:var(--rule);display:flex;justify-content:center;margin-bottom:14px}
.sr-empty h4{font-family:'Unbounded',sans-serif;font-size:19px;font-weight:600;color:var(--plum);letter-spacing:-.03em}
.sr-empty p{font-size:12.5px;color:var(--muted);line-height:1.5;margin-top:8px}

/* ---- request ---- */
#req{z-index:9}
.rq-top{flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:14px 16px 10px;
  border-bottom:1px solid var(--rule)}
.rq-title{font-family:'Unbounded',sans-serif;font-size:15px;font-weight:600;color:var(--plum);letter-spacing:-.02em}
.rq-scroll{flex:1;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;padding:0 18px 18px}
.rq-scroll::-webkit-scrollbar{width:0}
.rq-who{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--rule)}
.rq-who-ph{width:46px;height:46px;border-radius:14px;flex:0 0 auto;position:relative;overflow:hidden}
.rq-who-ph::before{content:'';position:absolute;inset:0;background-image:var(--star);
  background-size:56px 56px;opacity:.38}
.rq-who b{font-family:'Unbounded',sans-serif;font-size:14px;font-weight:600;color:var(--ink);letter-spacing:-.02em}
.rq-who span{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.fld{margin-top:20px}
.fld-l{font-size:9.5px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;
  color:var(--muted-lt);margin-bottom:10px;display:flex;align-items:center;gap:9px}
.fld-l::after{content:'';flex:1;height:1px;background:var(--rule)}
.fld-l em{font-style:normal;color:var(--coral-deep);letter-spacing:0;text-transform:none;font-size:10px}
.bgts{display:flex;flex-wrap:wrap;gap:7px}
.bgt{font-family:inherit;font-size:12.5px;font-weight:600;border:1px solid var(--rule);background:none;
  color:var(--muted);padding:10px 14px;border-radius:999px;cursor:pointer;transition:background var(--t1) var(--ease),color var(--t1) var(--ease)}
.bgt[aria-pressed="true"]{background:var(--plum);border-color:var(--plum);color:#fff}
.ta{width:100%;font-family:inherit;font-size:13.5px;color:var(--ink);border:1px solid var(--rule);
  background:var(--white);border-radius:14px;padding:12px;outline:none;resize:none;min-height:74px;
  transition:border-color var(--t1) var(--ease)}
.ta:focus{border-color:var(--plum-mid)}
.ta::placeholder{color:var(--muted-lt)}
.tel{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--rule);
  background:var(--lilac);border-radius:14px}
.tel b{font-size:13.5px;font-weight:700;color:var(--ink)}
.tel span{font-size:11px;color:var(--muted);display:block;margin-top:1px}
.cons[aria-pressed="true"] .rq-bar{flex:0 0 auto;background:rgba(250,247,244,.97);backdrop-filter:blur(12px);
  border-top:1px solid var(--rule);padding:12px 18px 20px}
.rq-send{width:100%;font-family:inherit;font-size:14px;font-weight:700;border:0;cursor:pointer;
  background:var(--coral-deep);color:#fff;padding:16px;border-radius:14px;transition:background var(--t1) var(--ease)}
.rq-send:hover{background:#e2593a}
.rq-send:disabled{background:var(--rule);color:var(--muted-lt);cursor:not-allowed}
.rq-note{font-size:11px;color:var(--muted-lt);text-align:center;margin-top:9px;line-height:1.4}
/* sent */
.sent{text-align:center;padding:34px 4px 0}
.sent-i{color:var(--teal);display:flex;justify-content:center;margin-bottom:14px}
.sent h3{font-family:'Unbounded',sans-serif;font-size:23px;font-weight:600;color:var(--plum);
  letter-spacing:-.035em;line-height:1.15}
.sent-warn{display:flex;gap:9px;text-align:left;background:none;border-left:2px solid var(--coral);
  padding:2px 0 2px 14px;margin:16px 0 0}
.sent-warn p{font-size:12.5px;color:var(--ink);line-height:1.5}
.sent-acts{display:flex;gap:9px;margin-top:20px}
.sent-acts button{flex:1;font-family:inherit;font-size:13.5px;font-weight:700;cursor:pointer;
  border:1px solid var(--plum);background:none;color:var(--plum);padding:14px 0;border-radius:14px;
  display:flex;align-items:center;justify-content:center;gap:7px;transition:background var(--t1) var(--ease)}
.sent-acts button:hover{background:var(--lilac)}
.sent-acts button.pri{background:var(--plum);color:#fff;border-color:var(--plum)}
.nxt{display:flex;gap:9px;overflow-x:auto;margin:0 -18px;padding:0 18px 2px}
.nxt::-webkit-scrollbar{height:0}
.nxt button{flex:0 0 132px;border:1px solid var(--rule);background:none;border-radius:14px;padding:14px 12px;
  cursor:pointer;font-family:inherit;text-align:left;transition:border-color var(--t1) var(--ease)}
.nxt button:hover{border-color:var(--plum-mid)}
.nxt-i{color:var(--coral);display:block;margin-bottom:8px}
.nxt b{display:block;font-size:12.5px;font-weight:700;color:var(--ink)}
.nxt span{display:block;font-size:11px;color:var(--muted-lt);margin-top:2px}

/* ---- data permission dialog ---- */
.perm-scrim{position:absolute;inset:0;background:rgba(20,11,36,.6);backdrop-filter:blur(3px);
  opacity:0;pointer-events:none;transition:opacity var(--t3) var(--ease);z-index:11}
.perm-scrim.on{opacity:1;pointer-events:auto}
.perm{position:absolute;left:20px;right:20px;top:50%;transform:translateY(-50%) scale(.94);
  background:var(--paper);border-radius:22px;padding:22px 20px 18px;z-index:12;
  opacity:0;pointer-events:none;transition:opacity var(--t3) var(--ease),transform var(--t3) var(--ease);
  max-height:86%;overflow-y:auto;overflow-x:hidden;box-shadow:0 24px 60px rgba(0,0,0,.45)}
.perm.on{opacity:1;pointer-events:auto;transform:translateY(-50%) scale(1)}
.perm::-webkit-scrollbar{width:0}
.perm-i{width:46px;height:46px;border-radius:14px;background:var(--teal-soft);color:var(--teal);
  display:flex;align-items:center;justify-content:center;margin-bottom:13px}
.perm h4{font-family:'Unbounded',sans-serif;font-size:19px;font-weight:600;color:var(--plum);
  letter-spacing:-.035em;line-height:1.15}
.perm-who{font-size:12.5px;font-weight:700;color:var(--muted);margin-top:12px;letter-spacing:.02em}
.perm-list{list-style:none;margin:8px 0 0;padding:0}
.perm-list li{display:flex;gap:9px;align-items:flex-start;padding:6px 0;border-bottom:1px solid var(--rule)}
.perm-list li:last-child{border-bottom:0}
.perm-list svg{color:var(--teal);flex:0 0 auto;margin-top:1px}
.perm-list span{font-size:12.5px;font-weight:600;color:var(--ink);line-height:1.35}
.perm-why{font-size:12.5px;color:var(--muted);margin-top:11px;line-height:1.5}
.perm-no{display:flex;gap:7px;align-items:flex-start;font-size:11px;color:var(--muted);
  margin-top:11px;line-height:1.5;border-left:2px solid var(--rule);padding-left:10px}
.perm-no svg{color:var(--muted-lt);flex:0 0 auto;margin-top:1px}
.perm-link{display:inline-block;margin-top:12px;font-size:11px;font-weight:600;color:var(--plum);
  text-decoration:underline;text-decoration-color:var(--rule);text-underline-offset:3px}
.perm-acts{display:flex;gap:9px;margin-top:18px}
.perm-acts button{flex:1;font-family:inherit;font-size:13.5px;font-weight:700;cursor:pointer;
  border:1px solid var(--rule);background:var(--white);color:var(--plum);padding:14px 0;border-radius:14px;
  transition:background var(--t1) var(--ease)}
.perm-acts button:hover{background:var(--lilac)}
.perm-acts button.pri{background:var(--plum);color:#fff;border-color:var(--plum)}
.perm-acts button.pri:hover{background:var(--plum-mid)}
.perm-acts button.pri.dgr{background:var(--berry);border-color:var(--berry)}
.perm-acts button.pri.dgr:hover{background:#8E2544}

/* nav + toast */
.nav{position:absolute;left:14px;right:14px;bottom:calc(10px + var(--pad-b));z-index:7;
  background:rgba(250,247,244,.92);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border:1px solid var(--rule);border-radius:22px;display:flex;align-items:flex-end;
  padding:6px 5px 10px;box-shadow:0 8px 26px rgba(27,16,48,.15),0 2px 5px rgba(27,16,48,.05);
  transition:transform var(--t3) var(--ease),opacity var(--t3) var(--ease)}

/* каждая вкладка — одинаковая колонка, иконки садятся на одну линию */
.nav button[data-tab]{flex:1 1 0;min-width:0;border:0;background:none;cursor:pointer;
  font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:5px;
  padding:0;height:50px;justify-content:flex-end;
  color:var(--muted-lt);position:relative;transition:color var(--t1) var(--ease)}
.nav .ico{position:relative;width:32px;height:32px;border-radius:11px;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;
  transition:background var(--t2) var(--ease),color var(--t2) var(--ease)}
.nav .lbl{font-size:10px;font-weight:700;letter-spacing:.01em;line-height:1;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.nav button[aria-pressed="true"]{color:var(--coral)}
.nav button[aria-pressed="true"] .ico{background:var(--coral);color:#fff}

/* поиск — главное действие, поэтому он поднят над панелью */
.nav .fab{flex:0 0 50px;width:50px;height:50px;border-radius:50%;border:0;cursor:pointer;
  background:var(--plum);color:#fff;padding:0;margin:0 0 0 4px;
  display:flex;align-items:center;justify-content:center;
  
  box-shadow:0 4px 14px rgba(27,16,48,.22);
  transition:transform var(--t2) var(--ease),background var(--t1) var(--ease)}
.nav .fab:hover{background:var(--plum-mid);transform:translateY(-16px)}
.nav .fab:active{transform:translateY(-10px) scale(.95)}

/* значок висит на иконке, а не на всей колонке */
.nav .dot{position:absolute;top:-4px;right:-7px;min-width:15px;height:15px;
  background:var(--coral-deep);color:#fff;border-radius:999px;font-size:10px;font-weight:800;
  display:flex;align-items:center;justify-content:center;padding:0 4px;
  border:1.5px solid var(--paper)}

@keyframes navHop{
  0%{transform:translateY(0) scale(1)}
  30%{transform:translateY(-6px) scale(1.14)}
  58%{transform:translateY(1px) scale(.95)}
  80%{transform:translateY(-1px) scale(1.02)}
  100%{transform:translateY(0) scale(1)}}
@keyframes navLabel{0%{opacity:.5}100%{opacity:1}}
.nav button.tapped .ico{animation:navHop 460ms var(--ease)}
.nav button.tapped .lbl{animation:navLabel 300ms var(--ease)}
.nav button:active .ico{transform:scale(.9)}

.toast{position:absolute;left:18px;right:18px;bottom:92px;will-change:transform,opacity;background:var(--plum-deep);color:#fff;border-radius:14px;
  padding:12px 14px;font-size:12.5px;line-height:1.5;opacity:0;transform:translateY(10px);pointer-events:none;
  transition:opacity var(--t2) var(--ease),transform var(--t2) var(--ease);z-index:10;box-shadow:0 12px 30px rgba(0,0,0,.4)}
.toast.on{opacity:1;transform:translateY(0) scale(1)}
.toast{transform:translateY(10px) scale(.97)}
.toast b{color:var(--peach)}

.b-rate svg{align-self:center}
.chip.ver{color:var(--teal)}
.chip svg,.b-rate svg{flex:0 0 auto}
.dotmark{width:5px;height:5px;border-radius:50%;background:currentColor;display:inline-block;flex:0 0 auto}
.cat-i svg,.nav svg,.stepper button svg,.dp-nav button svg{display:block}
.opt{font-size:10px;font-weight:600;color:var(--muted);letter-spacing:.02em;
  background:var(--lilac);padding:2px 6px;border-radius:999px;margin-left:2px}
.pill{display:inline-flex;align-items:center;gap:7px}
.pill svg{flex:0 0 auto;opacity:.9}
.pill.any,.preset.any{border-style:dashed}
.pill.any[aria-pressed="true"]{background:var(--lilac);border-color:var(--plum-mid);color:var(--plum);border-style:solid}
.preset.any{flex:1.3}
.chip.check{color:var(--coral);background:#fff;font-weight:700;cursor:pointer;border:0;font-family:inherit}
.chip.check:hover{background:var(--coral-soft)}

@media (min-width:521px) and (max-width:767px){
  body{background:#F2EEF6}
  .shell{border-left:1px solid var(--rule);border-right:1px solid var(--rule);
    box-shadow:0 0 60px rgba(44,27,71,.10)}
  /* окружение колонки темнеет вместе с ней */
  body:has(.shell[data-theme="lux"]){background:#0E0719}
  .shell[data-theme="lux"]{border-color:var(--rule);box-shadow:0 0 60px rgba(30,42,79,.10)}
}

/* ============ DESKTOP ============
   Та же разметка, другая раскладка: навигация уходит влево,
   лента становится сеткой, фотографии крупнее. */
@media (min-width:768px){
  body{background:var(--paper);align-items:stretch}
  .stage{width:100%}
  .shell{
    max-width:none;width:100%;height:100vh;height:100dvh;
    display:grid;
    grid-template-columns:var(--rail, 72px) minmax(0,1fr);
    grid-template-rows:auto minmax(0,1fr);
    grid-template-areas:"head head" "rail body";
    border:0;box-shadow:none}

  /* --- шапка на всю ширину --- */
  .tg-bar{grid-area:head;padding:18px 28px 16px;gap:20px}
  .wordmark{font-size:19px}

  /* --- навигация: вертикальная панель слева --- */
  .nav{grid-area:rail;position:static;left:auto;right:auto;bottom:auto;
    flex-direction:column;align-items:stretch;justify-content:flex-start;gap:5px;
    background:none;backdrop-filter:none;-webkit-backdrop-filter:none;
    border:0;border-right:1px solid var(--rule);border-radius:0;
    padding:18px 14px;box-shadow:none}
  .nav button[data-tab]{flex:0 0 auto;height:46px;flex-direction:row;justify-content:flex-start;
    gap:12px;padding:0 12px;border-radius:14px;
    transition:background var(--t1) var(--ease),color var(--t1) var(--ease)}
  .nav button[data-tab]:hover{background:var(--lilac)}
  .nav button[aria-pressed="true"]{background:var(--lilac)}
  .nav .ico{width:32px;height:32px}
  .nav .lbl{font-size:13.5px;font-weight:700;letter-spacing:0;text-transform:none;max-width:none}
  /* до 1024 панель свёрнута: только знаки, подпись — подсказкой при наведении */
  .shell{--rail:72px}
  .nav{padding:18px 12px;align-items:center}
  .nav button[data-tab]{width:48px;padding:0;justify-content:center}
  .nav .lbl{display:none}
  .nav .fab{width:48px;justify-content:center;padding:0;margin:10px 0 0}
  .nav .fab::before{display:none}
  .nav button[data-tab]::after{content:attr(data-title);position:absolute;left:calc(100% + 10px);
    top:50%;transform:translateY(-50%) scale(.94);transform-origin:left center;
    background:var(--plum);color:#fff;font-size:12px;font-weight:600;white-space:nowrap;
    padding:7px 10px;border-radius:9px;opacity:0;pointer-events:none;z-index:20;
    transition:opacity var(--t1) var(--ease),transform var(--t1) var(--ease)}
  .nav button[data-tab]:hover::after,
  .nav button[data-tab]:focus-visible::after{opacity:1;transform:translateY(-50%) scale(1)}
  .nav .dot{top:-2px;right:-4px}
  /* поиск — первым в списке, а не посередине */
  .nav .fab{order:-1;width:100%;height:46px;border-radius:14px;margin:0 0 10px;
    transform:none;justify-content:flex-start;gap:12px;padding:0 12px;
    box-shadow:0 4px 14px rgba(27,16,48,.22)}
  .nav .fab::before{content:attr(data-label);font-family:inherit;font-size:13.5px;font-weight:700}
  .nav .fab:hover,.nav .fab:active{transform:none;background:var(--plum-mid)}

  /* --- содержимое --- */
  .scroll{grid-area:body;padding:0 0 40px}
  /* текст держит меру, сетка карточек занимает ширину */
  .block{max-width:1760px;margin:0 auto;padding:22px 32px 0}
  .res-note,.about,.sr-note{max-width:76ch}
  .res-right{display:flex;align-items:center;gap:14px}
  .dens{display:inline-flex;align-items:center;justify-content:center;
    width:32px;height:32px;border-radius:11px;border:1px solid var(--rule);
    background:var(--white);color:var(--muted);cursor:pointer;
    transition:background var(--t1) var(--ease),color var(--t1) var(--ease),border-color var(--t1) var(--ease)}
  .dens:hover{border-color:var(--plum-mid);background:var(--lilac);color:var(--plum)}
  .critwrap{max-width:1760px;margin:0 auto;padding:16px 32px 12px}
  .crit{min-height:74px;border-radius:18px}
  .seg{padding:14px 16px}
  .seg-v{font-size:15px}
  .crit-go{width:40px;height:40px;border-radius:14px}
  /* Баннер выравнен с сеткой карточек по краям.
     Соотношение 16:7 на такой ширине дало бы 700px высоты,
     поэтому на десктопе задаём высоту, а не пропорцию. */
  .hero{max-width:1760px;margin:18px auto 0;padding:0 32px}
  .slide{aspect-ratio:auto;height:clamp(210px,19vw,300px);
    align-items:center;padding:0 44px}
  .slide::after{background:linear-gradient(100deg,
    rgba(27,16,48,.82) 0%,rgba(27,16,48,.55) 42%,rgba(27,16,48,.12) 72%,transparent 100%)}
  .slide::before{background-size:64px 64px}
  .slide .adtag{left:44px;top:22px}
  /* текст держит меру, а не растягивается на всю ширину баннера */
  .slide-txt{max-width:520px;gap:7px}
  .slide-txt b{font-size:27px;letter-spacing:-.03em;line-height:1.15}
  .slide-txt span{font-size:13.5px;max-width:100%;line-height:1.5}
  .slide-cta{margin-top:14px;font-size:12.5px;padding:12px 18px}
  .hero-track{border-radius:22px}
  .cats{margin:0;padding:0 0 2px}

  /* --- лента: сетка карточек --- */
  #list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;align-items:start}
  .shell[data-dense="1"] #list{grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
  .card{margin:0;padding:0;border:1px solid var(--rule);border-radius:52px 52px 24px 24px;
    background:var(--white);overflow:hidden;
    transition:transform var(--t2) var(--ease),box-shadow var(--t2) var(--ease)}
  .card:hover{transform:translateY(-3px);box-shadow:0 10px 30px rgba(44,27,71,.10)}
  .card:last-child{border-bottom:1px solid var(--rule)}
  .promo-tag{padding:10px 16px 6px;background:var(--coral-soft)}
  /* фотографии крупнее и тянутся за колонкой */
  .ph{border-radius:51px 51px 0 0}
  .body{padding:16px 18px 18px}
  .b-name{font-size:16px}
  .b-price b{font-size:22px}
  .empty{grid-column:1/-1}
  .sortbar{max-width:none}

  /* --- экраны поверх: только над содержимым, панель остаётся --- */
  .screen{left:var(--rail, 72px);top:auto;height:calc(100dvh - 71px);top:71px}
  .pf-scroll,.rq-scroll,.sr-body{padding-left:max(28px,calc((100% - 900px) / 2));
    padding-right:max(28px,calc((100% - 900px) / 2))}
  .gal>div{aspect-ratio:3/2;max-height:420px}
  #profile .dp{max-width:460px}
  #profile .dp-g b{aspect-ratio:1/1}
  .pf-top{padding:16px 28px}
  .pf-bar,.rq-bar{padding-left:max(28px,calc((100% - 900px) / 2));
    padding-right:max(28px,calc((100% - 900px) / 2))}
  .sr-top{padding:16px 28px 14px}

  /* --- шторка и диалоги: по центру содержимого --- */
  .sheet{left:var(--rail, 72px);max-width:520px;margin:0 auto;right:0;
    border-radius:22px;bottom:24px;max-height:calc(100dvh - 120px)}
  .scrim,.perm-scrim{left:var(--rail, 72px);top:71px}
  .perm{left:auto;right:auto;margin:0 auto;max-width:460px;
    left:calc(var(--rail, 72px) + (100% - var(--rail, 72px) - 460px) / 2)}
  .toast{left:auto;right:32px;bottom:32px;max-width:420px}
  .splash{z-index:80}

  /* левая панель в премиуме */
    .shell[data-theme="lux"] .nav button[data-tab]:hover{background:var(--coral-soft)}
  .shell[data-theme="lux"] .nav button[aria-pressed="true"]{background:var(--coral-soft)}
}

@media (min-width:1024px){
  .shell{--rail:240px}
  .nav{padding:18px 14px;align-items:stretch}
  .nav button[data-tab]{width:auto;padding:0 12px;justify-content:flex-start}
  .nav .lbl{display:block}
  .nav .fab{width:100%;justify-content:flex-start;padding:0 12px;margin:0 0 10px}
  .nav .fab::before{display:block}
  .nav button[data-tab]::after{display:none}
}
@media (min-width:1180px){
  #list{grid-template-columns:repeat(3,minmax(0,1fr))}
  .shell[data-dense="1"] #list{grid-template-columns:repeat(4,minmax(0,1fr))}
}
@media (min-width:1500px){
  #list{grid-template-columns:repeat(4,minmax(0,1fr))}
  .shell[data-dense="1"] #list{grid-template-columns:repeat(5,minmax(0,1fr))}
}
@media (min-width:1860px){
  #list{grid-template-columns:repeat(5,minmax(0,1fr))}
  .shell[data-dense="1"] #list{grid-template-columns:repeat(6,minmax(0,1fr))}
}
/* в плотном режиме карточка мельче — иначе текст не помещается */
.shell[data-dense="1"] .b-name{font-size:14px}
.shell[data-dense="1"] .b-price b{font-size:19px}
.shell[data-dense="1"] .body{padding:14px 14px 16px}

:focus{outline:none}
:focus-visible{outline:2px solid var(--coral);outline-offset:3px;border-radius:8px}
.dp-g b:focus-visible,.card:focus-visible{outline-offset:4px}
.no-anim .card{animation:none}
.no-anim .sv-row{animation:none}

/* Смена вкладки и языка: содержимое въезжает, а не подменяется рывком. */
@keyframes gridInL{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
@keyframes gridInR{from{opacity:0;transform:translateX(-16px)}to{opacity:1;transform:none}}
.dp-g.inL{animation:gridInL var(--t2) var(--ease) both}
.dp-g.inR{animation:gridInR var(--t2) var(--ease) both}

@keyframes viewIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.view-in{animation:viewIn var(--t3) var(--ease) both}
.scroll.fading{opacity:0;transition:opacity var(--t1) var(--ease-in)}

/* Палец попадает по площади, а не по рисунку: элементы остаются
   прежнего размера, но ловят касание в радиусе 44px. */
.sv-x,.mt-x,.stepper button,.dp-nav button,.dens,.dots button,
#srClear,.rnd,.mt-edit,.sv-chk,.me-btn,.lang button{position:relative}
/* .heart сюда не входит: он уже position:absolute, и relative сбросил бы
   его в поток — кнопка уезжала в левый нижний угол фотографии */
.heart::after,.sv-x::after,.mt-x::after,.stepper button::after,
.dp-nav button::after,.dens::after,#srClear::after,.sv-chk::after{
  content:'';position:absolute;inset:-9px}
/* эти уже 38px — хватает небольшого запаса */
.rnd::after,.mt-edit::after,.me-btn::after,.lang button::after{content:'';position:absolute;inset:-5px}
.dots button::after{content:'';position:absolute;inset:-12px -3px}

/* ---- press feedback: the single biggest difference between web and native feel ---- */
button,.card,.sv-b,.mt-row,.me-row{-webkit-tap-highlight-color:transparent}
button:active,.card:active{transition-duration:60ms}
.pill:active,.cat:active,.preset:active,.bgt:active,.sv-all:active,.b-cta:active,.sv-go:active,.sv-back:active{opacity:.55}
.rq-send:active,.go:active,.pf-req:active,.slide-cta:active,.perm-acts button:active,
.cmp-acts button:active:not(:disabled),.cmp-bar button:active{transform:scale(.975)}
.card:active .ph{transform:scale(.985)}
.ph{transition:transform var(--t2) var(--ease)}
.dp-g b.ok:active{transform:scale(.9)}
.heart:active,.sv-chk:active,.cons-box:active{transform:scale(.85)}
.me-row:active,.mt-row:active,.sv-row:active{background:var(--lilac)}
.me-row,.mt-row{transition:background var(--t1) var(--ease-io)}

/* ---- entrances ---- */
@keyframes riseIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes popIn{0%{transform:scale(.7);opacity:0}60%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}
@keyframes heartPop{0%{transform:scale(1)}40%{transform:scale(1.32)}100%{transform:scale(1)}}
@keyframes sweep{from{transform:translateX(-100%)}to{transform:translateX(100%)}}

.card{animation:riseIn var(--t2) var(--ease) both}
.card:nth-child(2){animation-delay:35ms}
.card:nth-child(3){animation-delay:70ms}
.card:nth-child(4){animation-delay:105ms}
.card:nth-child(n+5){animation-delay:140ms}
.dp-g b{animation:popIn 260ms var(--ease) both}
.dp-g b:nth-child(7n+1){animation-delay:0ms}   .dp-g b:nth-child(7n+2){animation-delay:14ms}
.dp-g b:nth-child(7n+3){animation-delay:28ms}  .dp-g b:nth-child(7n+4){animation-delay:42ms}
.dp-g b:nth-child(7n+5){animation-delay:56ms}  .dp-g b:nth-child(7n+6){animation-delay:70ms}
.dp-g b:nth-child(7n+7){animation-delay:84ms}
.sv-row,.mt-row,.me-row{animation:riseIn 240ms var(--ease) both}
.sv-row:nth-child(2),.mt-row:nth-child(2),.me-row:nth-child(2){animation-delay:30ms}
.sv-row:nth-child(3),.mt-row:nth-child(3),.me-row:nth-child(3){animation-delay:60ms}
.sv-row:nth-child(n+4),.mt-row:nth-child(n+4),.me-row:nth-child(n+4){animation-delay:90ms}
.heart[aria-pressed="true"] svg{animation:heartPop 380ms var(--ease)}
.sent-i{animation:popIn 520ms var(--ease) both}
.perm-i{animation:popIn 400ms 60ms var(--ease) both}

/* the progress bar catches the light as it fills */

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:1ms!important;animation-duration:1ms!important;
    animation-iteration-count:1!important;scroll-behavior:auto!important}
}

/* ============ ПРЕМИУМ ============
   Тёмное поле, персиковый свет, никакой рекламы.
   Тот же интерфейс, другая температура. */
.lux-mute{display:none;width:34px;height:34px;flex:0 0 auto;
  align-items:center;justify-content:center;border-radius:11px;
  border:1px solid var(--rule);background:var(--white);color:var(--muted);
  cursor:pointer;position:relative;-webkit-tap-highlight-color:transparent;
  transition:background var(--t1) var(--ease),border-color var(--t1) var(--ease),color var(--t1) var(--ease)}
.shell[data-theme="lux"] .lux-mute{display:flex;background:none;border-color:var(--rule);color:var(--muted)}
.shell[data-theme="lux"] .lux-mute:hover{background:var(--lilac);border-color:var(--coral);color:var(--ink)}
.shell[data-theme="lux"] .lux-mute[aria-pressed="true"]{color:var(--muted);border-color:var(--rule)}
.lux-mute::after{content:'';position:absolute;inset:-5px}

/* В премиуме проверены все — значок на каждой карточке ничего не сообщает */
.shell[data-theme="lux"] #list .chip.ver{display:none}

/* ============ SUZANI ============
   Сюзане — вышивка из приданого. Три материала задают всю палитру:
   небелёный лён (фон), марена (то, что нажимают), индиго (весь текст).
