   70% льна, 20% индиго, 8% розового льна, 2% красного.
   Премиум переопределяет БАЗОВЫЕ токены, иначе любое правило
   с --muted или --coral останется от светлой темы. */
.shell[data-theme="lux"]{
  /* грунты */
  --paper:#EEE7DC;                    /* лён */
  --white:#FAF6EF;                    /* слоновая кость */
  --raise:#FFFDF8;                    /* хлопок */
  --rail-bg:#F3EDE3;                  /* бледный лён */
  --cell:#F4EEE4;  --cellWk:#EFE3D8;  /* клетки календаря */
  --busy:#FFFDF8;  --busyInk:#9E9384; /* занятый день выцветает, а не краснеет */
  /* текст */
  --ink:#1E2A4F;   --plum:#1E2A4F;    --plum-deep:#16203C;  --plum-mid:#2A3A66;
  --muted:#6A6357; --muted-lt:#6A6357;
  /* марена: только действия */
  --coral:#A3302A; --coral-deep:#A3302A;
  --coral-soft:rgba(163,48,42,.12);
  --accentHover:#8E2924; --accentPress:#7A231F;
  --btnInk:#FBF3E8; --selInk:#F6EEDF;
  /* линии */
  --rule:rgba(30,42,79,.12);  --line:rgba(30,42,79,.12);
  --lilac:rgba(163,48,42,.12);
  --peach:#A3302A;
  /* смысловые */
  --teal:#2F6B4F;  --teal-soft:#E4EDE8;
  --berry:#7A1E1A;
  background:var(--paper);
  background-image:radial-gradient(900px 420px at 70% -10%, rgba(163,48,42,.06), transparent 60%);
}
.shell[data-theme="lux"] .wordmark{display:none}
.shell[data-theme="lux"] .scroll{background:none;animation:luxIn 460ms var(--ease) both}
.shell[data-theme="lux"] 
.shell[data-theme="lux"] .crit{background:var(--white);border-color:var(--rule);box-shadow:none}
.shell[data-theme="lux"] .crit.empty{border-color:var(--ink);box-shadow:0 0 0 3px var(--rule)}
.shell[data-theme="lux"] .seg-l{color:var(--muted)}
.shell[data-theme="lux"] .seg-v{color:var(--muted)}
.shell[data-theme="lux"] .seg.on .seg-v{color:var(--ink)}
.shell[data-theme="lux"] .seg:hover{background:var(--lilac)}
.shell[data-theme="lux"] .seg-div{background:var(--rule)}
.shell[data-theme="lux"] .crit-go{background:var(--rule);color:var(--ink)}
.shell[data-theme="lux"] .crit.empty .crit-go{background:var(--coral);color:var(--btnInk)}

.shell[data-theme="lux"] .eyebrow{color:var(--muted)}
.shell[data-theme="lux"] .eyebrow::after{background:var(--rule)}
.shell[data-theme="lux"] .cat{border-color:var(--rule);color:var(--muted);background:none}
.shell[data-theme="lux"] .cat[aria-pressed="true"]{background:var(--coral);border-color:var(--coral);color:var(--btnInk)}
/* В Suzani подложек под знаками нет: у чипа уже есть заливка и линейка,
   вторая коробка внутри — приём светлой темы. Остаётся только знак. */
.shell[data-theme="lux"] .cat-i{background:none}
.shell[data-theme="lux"] .me-i{background:none}
/* по спецификации у чипа красный знак и ореховый текст */
.shell[data-theme="lux"] .cat svg{color:var(--coral)}
.shell[data-theme="lux"] .cat[aria-pressed="true"] svg{color:var(--btnInk)}

.shell[data-theme="lux"] .res-title{color:var(--ink)}
.shell[data-theme="lux"] .res-count,.shell[data-theme="lux"] .res-note{color:var(--muted)}
.shell[data-theme="lux"] .sortbar{border-bottom-color:var(--rule)}
.shell[data-theme="lux"] .sortbar>span{color:var(--muted)}
.shell[data-theme="lux"] .sortbtn{background:var(--white);border-color:var(--rule);color:var(--ink)}
.shell[data-theme="lux"] .sortbtn-i{background:none;color:var(--coral)}
.shell[data-theme="lux"] .sortbtn>svg{color:var(--muted)}
.shell[data-theme="lux"] .dens{background:var(--white);border-color:var(--rule);color:var(--muted)}

.shell[data-theme="lux"] .card{background:var(--white);border-color:var(--rule);box-shadow:none}
/* по спецификации карточка не отбрасывает тень: приподнимается и краснеет кромка */
.shell[data-theme="lux"] .card:hover{box-shadow:none;border-color:var(--coral);transform:translateY(-2px)}
.shell[data-theme="lux"] .b-name{color:var(--ink)}
.shell[data-theme="lux"] .b-meta{color:var(--muted)}
.shell[data-theme="lux"] .b-rate{color:var(--ink)}
.shell[data-theme="lux"] .b-rate i{color:var(--muted)}
.shell[data-theme="lux"] .b-price b{color:var(--ink)}
.shell[data-theme="lux"] .b-price span{color:var(--muted)}
.shell[data-theme="lux"] .chip{background:var(--lilac);color:var(--ink)}
/* «Заявка»: контурная красная, заливается при наведении */
.shell[data-theme="lux"] .b-cta{background:none;color:var(--coral);
  border:1.5px solid var(--coral);border-radius:10px;padding:6px 12px}
.shell[data-theme="lux"] .b-cta:hover{background:var(--coral);color:var(--btnInk);border-color:var(--coral)}
.shell[data-theme="lux"] .heart{background:var(--raise);color:var(--ink);
  border:1px solid var(--rule);box-shadow:none}
.shell[data-theme="lux"] .empty{color:var(--muted)}

/* Навигация в премиуме: тёмная и на телефоне, и в левой панели десктопа.
   Светлая полоса на тёмном фоне читается как чужой элемент. */
.shell[data-theme="lux"] .nav{
  background:var(--rail-bg);border-color:var(--rule);
  box-shadow:0 10px 34px rgba(30,42,79,.10),0 2px 6px rgba(85,58,50,.08)}
.shell[data-theme="lux"] .nav button[data-tab]{color:var(--muted)}
.shell[data-theme="lux"] .nav button[aria-pressed="true"]{color:var(--ink)}
.shell[data-theme="lux"] .nav .ico{color:inherit}
/* активный пункт: мягкая подложка, текст индиго, знак красный */
/* Подсветка ложится на скруглённую подложку знака.
   На всю кнопку она давала прямоугольник без радиуса во всю колонку. */
.shell[data-theme="lux"] .nav button[aria-pressed="true"]{background:none;color:var(--ink)}
.shell[data-theme="lux"] .nav button[aria-pressed="true"] .ico{background:var(--coral-soft);color:var(--coral)}
.shell[data-theme="lux"] .nav .fab{background:var(--coral);color:var(--btnInk);
  box-shadow:0 0 0 5px var(--paper), 0 7px 20px rgba(30,42,79,.12)}
.shell[data-theme="lux"] .nav .fab:hover{background:var(--accentHover)}
.shell[data-theme="lux"] .nav .dot{background:var(--coral);color:var(--btnInk);border-color:var(--paper)}
.shell[data-theme="lux"] .toast{background:#E6DED1}

/* Шапка и категории: правила темы должны жить здесь, вместе с остальными.
   Раньше они лежали выше по файлу и не попали под перекраску. */
.shell[data-theme="lux"] .lang{background:var(--lilac)}
.shell[data-theme="lux"] .lang button{color:var(--muted)}
.shell[data-theme="lux"] .lang button.on{color:var(--selInk)}
.shell[data-theme="lux"] .lang-pill{background:var(--ink);box-shadow:none}
.shell[data-theme="lux"] .me-btn{display:none}

/* липкая полоса критериев не должна оставаться кремовой на тёмном */
.shell[data-theme="lux"] .critwrap{background:linear-gradient(var(--paper) 72%, rgba(242,223,187,0))}
.shell[data-theme="lux"] .cat-n{color:inherit}
.shell[data-theme="lux"] .cat[aria-pressed="true"] .cat-n{color:var(--btnInk)}

/* Премиум открывается как отдельное приложение: панели нет,
   в шапке — возврат на bayram.uz. */
.lux-back,.lux-mark{display:none}

.shell[data-theme="lux"] .lux-back{
  display:inline-flex;align-items:center;gap:7px;flex:0 0 auto;
  border:1px solid var(--rule);background:none;color:var(--muted);
  font-family:inherit;font-size:11.5px;font-weight:700;letter-spacing:.02em;
  padding:8px 12px 8px 10px;border-radius:999px;cursor:pointer;position:relative;
  transition:background var(--t1) var(--ease),color var(--t1) var(--ease),border-color var(--t1) var(--ease)}
.shell[data-theme="lux"] .lux-back::after{content:'';position:absolute;inset:-6px}
.shell[data-theme="lux"] .lux-back:hover{background:var(--lilac);color:var(--ink);border-color:var(--ink)}
.shell[data-theme="lux"] .lux-mark{
  display:block;font-family:'Unbounded',sans-serif;font-size:15px;font-weight:600;
  letter-spacing:-.02em;color:var(--ink);margin-left:auto;margin-right:12px}

/* вход: приложение появляется, а не перекрашивается */
@keyframes luxIn{from{opacity:0;transform:scale(.985) translateY(10px)}to{opacity:1;transform:none}}

/* «Избранное» и «Событие» внутри премиума — те же экраны, другая температура.
   Список сохранённого общий: искать премиум-зал в отдельном списке человек не станет. */
.shell[data-theme="lux"] .sv-all{color:var(--muted)}
.shell[data-theme="lux"] .sv-all-b{border-color:var(--rule);background:none}
/* «выбрано» — это своё, а не действие: индиго */
.shell[data-theme="lux"] .sv-all-b.on,
.shell[data-theme="lux"] .sv-chk.on{background:var(--ink);border-color:var(--ink);color:var(--selInk)}
.shell[data-theme="lux"] .sv-chk{border-color:var(--rule);background:none}
.shell[data-theme="lux"] .sv-share{background:var(--coral);color:var(--btnInk)}
.shell[data-theme="lux"] .sv-row{border-bottom-color:var(--rule)}
.shell[data-theme="lux"] .sv-row:hover{background:var(--lilac)}
.shell[data-theme="lux"] .sv-n{color:var(--ink)}
.shell[data-theme="lux"] .sv-m,.shell[data-theme="lux"] .sv-cat{color:var(--muted)}
.shell[data-theme="lux"] .sv-x{color:var(--muted)}

.shell[data-theme="lux"] .mt-card{background:var(--white);border-color:var(--rule);box-shadow:none}
.shell[data-theme="lux"] .mt-ask-t,.shell[data-theme="lux"] .mt-h-t b{color:var(--ink)}
.shell[data-theme="lux"] .mt-ask-s,.shell[data-theme="lux"] .mt-h-t span{color:var(--muted)}
.shell[data-theme="lux"] .mt-bar{background:var(--lilac)}
.shell[data-theme="lux"] .mt-bar i{background:var(--ink)}
.shell[data-theme="lux"] .mt-i{background:none;color:var(--coral)}
.shell[data-theme="lux"] .mt-i.ok{background:var(--teal);color:var(--selInk)}
.shell[data-theme="lux"] .mt-go{color:var(--ink)}
.shell[data-theme="lux"] .mt-add{border-color:var(--rule);color:var(--muted)}
.shell[data-theme="lux"] .mt-add:hover{border-color:var(--ink);color:var(--ink)}
.shell[data-theme="lux"] .mt-row{border-bottom-color:var(--rule)}
.shell[data-theme="lux"] .mt-row b{color:var(--ink)}
.shell[data-theme="lux"] .mt-row span,.shell[data-theme="lux"] .mt-x{color:var(--muted)}
.shell[data-theme="lux"] .mt-oc{background:var(--lilac);color:var(--ink)}
.shell[data-theme="lux"] .mt-edit{color:var(--muted)}
.shell[data-theme="lux"] .bill-row{color:var(--muted)}
.shell[data-theme="lux"] .bill-row b,.shell[data-theme="lux"] .mt-total b{color:var(--ink)}
.shell[data-theme="lux"] .mt-sec{color:var(--muted)}
.shell[data-theme="lux"] .empty p{color:var(--muted)}

/* Накладные экраны — профиль, форма заявки, поиск — тоже часть премиум-приложения.
   Без этого человек нажимает на карточку и попадает обратно в белый интерфейс. */
.shell[data-theme="lux"] .screen{background:var(--paper)}
.shell[data-theme="lux"] .pf-bar,
.shell[data-theme="lux"] .rq-bar{background:var(--rail-bg);border-top-color:var(--rule)}
.shell[data-theme="lux"] .pf-top,
.shell[data-theme="lux"] .rq-top,
.shell[data-theme="lux"] .sr-top{border-bottom-color:var(--rule)}
.shell[data-theme="lux"] .pf-call{background:var(--white);border-color:var(--rule);color:var(--ink)}
.shell[data-theme="lux"] .rnd{background:var(--raise);color:var(--ink);
  border:1px solid var(--rule);box-shadow:none}

.shell[data-theme="lux"] .pf-name,
.shell[data-theme="lux"] .rq-title,
.shell[data-theme="lux"] .sr-title{color:var(--ink)}
.shell[data-theme="lux"] .pf-meta,
.shell[data-theme="lux"] .rq-who,
.shell[data-theme="lux"] .sr-note{color:var(--muted)}
.shell[data-theme="lux"] .about{color:var(--ink)}
.shell[data-theme="lux"] .ft{border-color:var(--rule);color:var(--muted)}
.shell[data-theme="lux"] .rv{border-bottom-color:var(--rule)}
.shell[data-theme="lux"] .rv b{color:var(--ink)}
.shell[data-theme="lux"] .rv p,.shell[data-theme="lux"] .rv i{color:var(--muted)}

/* календарь занятости */
.shell[data-theme="lux"] .dp{background:none;border-color:var(--rule)}
.shell[data-theme="lux"] .dp-mo{color:var(--ink)}
.shell[data-theme="lux"] .dp-yr{color:var(--muted)}
.shell[data-theme="lux"] .dp-nav button{border-color:var(--rule);color:var(--ink)}
.shell[data-theme="lux"] .dp-nav button:hover:not(:disabled){background:var(--lilac)}
.shell[data-theme="lux"] .dp-g b u{color:var(--ink)}
.shell[data-theme="lux"] .dp-g b s{color:var(--muted)}
.shell[data-theme="lux"] .dp-g b.we{background:var(--cellWk)}
.shell[data-theme="lux"] .dp-g b.ok:hover{background:var(--lilac)}
.shell[data-theme="lux"] .dp-g b.sel{background:var(--ink)}
.shell[data-theme="lux"] .dp-g b.sel u,.shell[data-theme="lux"] .dp-g b.sel s{color:var(--paper)}
.shell[data-theme="lux"] .dp-g em{color:var(--muted)}
.shell[data-theme="lux"] .dp-leg{border-top-color:var(--rule)}
.shell[data-theme="lux"] .dp-leg span{color:var(--muted)}
.shell[data-theme="lux"] .dp-we::before{background:var(--cellWk);border-color:var(--rule)}
.shell[data-theme="lux"] .dp-menu{background:var(--white);border-color:var(--rule)}
.shell[data-theme="lux"] .dp-menu button{color:var(--ink)}
.shell[data-theme="lux"] .dp-menu button:hover,
.shell[data-theme="lux"] .dp-menu button.on{background:var(--lilac)}

/* поля формы заявки */
.shell[data-theme="lux"] .dpick,
.shell[data-theme="lux"] .stepper,
.shell[data-theme="lux"] .ta,
.shell[data-theme="lux"] .tel,
.shell[data-theme="lux"] .bgt{background:var(--white);border-color:var(--rule);color:var(--ink)}
.shell[data-theme="lux"] .dpick-c{color:var(--muted)}
.shell[data-theme="lux"] .bgt.on{background:var(--ink);border-color:var(--ink);color:var(--selInk)}
.shell[data-theme="lux"] .ta::placeholder{color:var(--muted)}
.shell[data-theme="lux"] .stepper button{color:var(--ink)}

/* поиск */
.shell[data-theme="lux"] .sr-field{background:var(--white);border-color:var(--rule)}
.shell[data-theme="lux"] .sr-field input{color:var(--ink)}
.shell[data-theme="lux"] .sr-field input::placeholder{color:var(--muted)}
.shell[data-theme="lux"] .sr-chip{border-color:var(--rule);color:var(--muted)}
.shell[data-theme="lux"] .sr-chip:hover{background:var(--lilac);color:var(--ink)}
.shell[data-theme="lux"] .sr-row{border-bottom-color:var(--rule)}
.shell[data-theme="lux"] .sr-n{color:var(--ink)}
.shell[data-theme="lux"] .sr-m{color:var(--muted)}

/* Цвета, вписанные числом, переопределение токенов не перекрывает —
   им нужен явный премиум-вариант. */
.shell[data-theme="lux"] .ver small{color:var(--teal)}
.shell[data-theme="lux"] .ver li{color:var(--teal)}
.shell[data-theme="lux"] .cmp-acts button.dgr{color:var(--berry)}
.shell[data-theme="lux"] .dp-g b.no u{color:var(--berry)}
.shell[data-theme="lux"] .dp-g b.no{background:var(--busy)}

/* ---- мои заявки ---- */
.mr-title{font-family:'Unbounded',sans-serif;font-size:16px;font-weight:600;
  letter-spacing:-.02em;color:var(--plum)}
.mr-note{font-size:12.5px;line-height:1.5;color:var(--muted);margin:0 0 14px;max-width:44ch}
.mr-row{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;
  background:none;border:0;border-bottom:1px solid var(--rule);padding:14px 0;
  font-family:inherit;text-align:left;cursor:pointer;
  transition:background var(--t1) var(--ease)}
.mr-row:hover{background:var(--lilac)}
.mr-main{display:flex;flex-direction:column;gap:3px;min-width:0}
.mr-main b{font-size:15px;font-weight:700;color:var(--ink)}
.mr-meta{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mr-right{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex:0 0 auto}
.mr-left{font-size:11px;font-weight:600;color:var(--muted)}
.mr-left.late{color:var(--berry)}
.mr-empty{text-align:center;padding:48px 20px;color:var(--muted-lt)}
.mr-empty p{font-size:13.5px;line-height:1.5;color:var(--muted);max-width:30ch;margin:14px auto 0}
.mr-cnt{flex:0 0 auto;min-width:22px;height:22px;padding:0 6px;border-radius:999px;
  background:var(--coral-deep);color:#fff;font-size:11px;font-weight:700;
  display:flex;align-items:center;justify-content:center}

.mr-entry{border-bottom:1px solid var(--rule)}
.sv-reqs{display:flex;align-items:center;gap:12px;width:100%;margin-bottom:14px;
  background:var(--white);border:1px solid var(--rule);border-radius:18px;padding:14px 16px;
  font-family:inherit;text-align:left;cursor:pointer;
  transition:border-color var(--t1) var(--ease)}
.sv-reqs:hover{border-color:var(--plum-mid)}
.sv-reqs-i{width:34px;height:34px;flex:0 0 auto;border-radius:11px;background:var(--lilac);
  color:var(--plum);display:flex;align-items:center;justify-content:center}
.sv-reqs-b{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.sv-reqs-b b{font-size:14px;font-weight:700;color:var(--ink)}
.sv-reqs-b span{font-size:12.5px;color:var(--muted)}

.shell[data-theme="lux"] .mr-row{border-bottom-color:var(--rule)}
.shell[data-theme="lux"] .sv-reqs{background:var(--white);border-color:var(--rule)}
.shell[data-theme="lux"] .sv-reqs-i{background:none;color:var(--coral)}
.shell[data-theme="lux"] .mr-cnt{background:var(--coral);color:var(--btnInk)}

/* ---- уже отправленная заявка в карточке вендора ---- */
.pf-sent{display:flex;align-items:center;gap:12px;width:100%;margin:14px 0 0;
  background:var(--white);border:1px solid var(--rule);border-radius:18px;padding:12px 14px;
  font-family:inherit;text-align:left;cursor:pointer;position:relative;
  transition:border-color var(--t1) var(--ease)}
.pf-sent:hover{border-color:var(--plum-mid)}
.pf-sent-i{width:32px;height:32px;flex:0 0 auto;border-radius:11px;background:var(--lilac);
  color:var(--plum);display:flex;align-items:center;justify-content:center}
.pf-sent-b{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.pf-sent-b b{font-size:13.5px;font-weight:700;color:var(--ink)}
.pf-sent-b span{font-size:12.5px;color:var(--muted)}
.pf-sent-go{flex:0 0 auto;color:var(--muted-lt)}
.shell[data-theme="lux"] .pf-sent{background:var(--white);border-color:var(--rule)}
.shell[data-theme="lux"] .pf-sent-i{background:none;color:var(--coral)}

.me-go{flex:0 0 auto;color:var(--muted-lt);display:flex}
.shell[data-theme="lux"] .me-go{color:var(--muted)}
</style>
</head>
<body>
<div class="stage">
  <div class="shell">
    <header class="tg-bar">
      <div class="tg-lead">
        <button class="lux-back" id="luxBack"></button>
        <div class="wordmark">bayram<span>.</span>uz</div>
        <div class="lux-mark">Премиум</div>
      </div>
      <div class="tg-acts">
        <button class="lux-mute" id="luxMute"></button>
        <div class="lang" id="lang" role="tablist" data-l="ru">
          <i class="lang-pill"></i>
          <button role="tab" data-l="ru">RU</button>

   i_city_b:'<p>Мы набираем вендоров по одному городу за раз. Пустой каталог хуже, чем его отсутствие.</p><p>Следующими смотрим Самарканд и Бухару — но только после того, как в Ташкенте наберётся достаточно проверенных вендоров по каждой категории.</p>',
   i_ver_h:'Как мы проверяем вендоров',
   i_ver_b:'<p>Значок «Проверено» означает четыре вещи:</p><ul><li>Регистрация ИП или ООО существует</li><li>СТИР сверен с открытым реестром</li><li>Адрес площадки подтверждён</li><li>С нами подписан договор</li></ul><p class="warn">Мы не отвечаем за качество услуги и за договор между вами и вендором. Значок — про то, что бизнес настоящий, а не про то, что он вам понравится.</p><p>Если вендор обманул — напишите нам, мы снимаем значок по жалобам.</p>',
   i_book_h:'Почему мы не бронируем',
   i_book_b:'<p>Мы поисковик, а не сервис бронирования. Деньги через нас не проходят, комиссию мы не берём.</p><p>Когда вы отправляете заявку, вендор получает её в Telegram. <b>Место при этом не закрепляется.</b> Дату подтверждает вендор — звонком или в переписке.</p><p class="warn">Поэтому всегда звоните и подтверждайте дату напрямую. Заявка — это начало разговора, а не бронь.</p>',
   i_d1_h:'Политика обработки данных',
   i_d1_b:'<p>Полный текст будет опубликован до запуска и зарегистрирован вместе с базой в Госреестре.</p><p>Коротко: собираем номер, имя, ваши заявки и сохранённое. Передаём вендору только те данные и только тогда, когда вы нажимаете «Разрешить и отправить». Не публикуем номер и не продаём базу.</p>',
   i_d2_h:'Условия использования',
   i_d2_b:'<p>Полный текст будет опубликован до запуска.</p><p>Коротко: пользование бесплатное. Мы сводим вас с вендором и проверяем его регистрацию. Договор об услуге вы заключаете с вендором напрямую, и претензии по качеству — к нему.</p>',
   i_d3_h:'Публичная оферта',
   i_d3_b:'<p>Оферта касается вендоров и их подписки. Для вас площадка бесплатна — ни комиссий, ни платы за заявку.</p>',
   i_wipe_h:'Удалить аккаунт?',
   i_wipe_b:'<p>Аккаунт и всё, что с ним связано, удалим из наших систем:</p><ul><li>Номер телефона и имя</li><li>Сохранённых вендоров</li><li>Отправленные заявки</li><li>Настройки уведомлений</li></ul><p class="warn">Данные, уже отправленные вендорам, остаются у них — отозвать их мы не можем. Если нужно, напишите вендору напрямую.</p><p>Удаляем в течение десяти дней и подтверждаем в Telegram.</p>',

   i_city_h:'Hozircha faqat Toshkent',
   i_city_b:'<p>Hamkorlarni bir shahardan boshlab yig‘amiz. Bo‘sh katalog — katalog yo‘qligidan yomonroq.</p><p>Keyingi navbatda Samarqand va Buxoro — lekin Toshkentda har bir kategoriya bo‘yicha yetarli hamkor yig‘ilgandan keyin.</p>',
   i_ver_h:'Hamkorlarni qanday tekshiramiz',
   i_ver_b:'<p>«Tekshirilgan» belgisi to‘rt narsani bildiradi:</p><ul><li>YaTT yoki MChJ ro‘yxati mavjud</li><li>STIR ochiq reyestr bilan solishtirilgan</li><li>Maydon manzili tasdiqlangan</li><li>Biz bilan shartnoma imzolangan</li></ul><p class="warn">Xizmat sifati va siz bilan hamkor o‘rtasidagi shartnoma uchun javob bermaymiz. Belgi — biznes haqiqiy ekani haqida, sizga yoqishi haqida emas.</p><p>Hamkor aldagan bo‘lsa — bizga yozing, shikoyatga ko‘ra belgini olib tashlaymiz.</p>',
   i_book_h:'Nega bron qilmaymiz',
   i_book_b:'<p>Biz qidiruv tizimimiz, bron xizmati emas. Pul biz orqali o‘tmaydi, komissiya olmaymiz.</p><p>So‘rov yuborganingizda hamkor uni Telegramda oladi. <b>Joy bunda biriktirilmaydi.</b> Sanani hamkor tasdiqlaydi — qo‘ng‘iroq yoki yozishmada.</p><p class="warn">Shuning uchun doim qo‘ng‘iroq qilib sanani tasdiqlang. So‘rov — suhbat boshlanishi, bron emas.</p>',
   i_d1_h:'Ma’lumotlarni qayta ishlash siyosati',
   i_d1_b:'<p>To‘liq matn ishga tushirishdan oldin e’lon qilinadi va baza bilan birga Davlat reyestrida ro‘yxatdan o‘tkaziladi.</p><p>Qisqacha: raqam, ism, so‘rovlaringiz va saqlanganlarni yig‘amiz. Hamkorga faqat siz «Ruxsat va yuborish» bosganda beramiz. Raqamni e’lon qilmaymiz va bazani sotmaymiz.</p>',
   i_d2_h:'Foydalanish shartlari',
   i_d2_b:'<p>To‘liq matn ishga tushirishdan oldin e’lon qilinadi.</p><p>Qisqacha: foydalanish bepul. Biz sizni hamkor bilan bog‘laymiz va uning ro‘yxatini tekshiramiz. Xizmat shartnomasini hamkor bilan to‘g‘ridan-to‘g‘ri tuzasiz, sifat bo‘yicha da’volar unga.</p>',
   i_d3_h:'Ommaviy oferta',
   i_d3_b:'<p>Oferta hamkorlar va ularning obunasiga tegishli. Siz uchun platforma bepul — na komissiya, na so‘rov uchun to‘lov.</p>',
   i_wipe_h:'Hisob o‘chirilsinmi?',

/* Фокус на элементе, который ещё едет из-за края, заставляет браузер
   прокрутить .shell — и она остаётся сдвинутой навсегда. */
function focusSafe(el){
  if(!el||!el.focus) return;
  try{ el.focus({preventScroll:true}); }catch(_){ el.focus(); }
  unshift();
}
function unshift(){
  const sh=document.querySelector('.shell');

  document.querySelectorAll('.screen,.sheet,.perm').forEach(n=>{n.scrollLeft=0});

   оплаченные места — обман. */
function sortRows(rows){
  const busy=(a,b)=>busyNow(a)-busyNow(b);
  const by={
    cheap:  (a,b)=>busy(a,b)||a.p-b.p,
    rich:   (a,b)=>busy(a,b)||b.p-a.p,
    rating: (a,b)=>busy(a,b)||b.r-a.r||b.nrev-a.nrev,
    reviews:(a,b)=>busy(a,b)||b.nrev-a.nrev,
    def:    (a,b)=>busy(a,b)||(mode==='lux'?0:(b.promo-a.promo))||(b.r-a.r),
  };
  return rows.sort(by[sort]||by.def);
}

/* A day here is not an input — it is an availability map.
   Search view: how much choice that day gives you.
   Vendor view: what that specific day costs. */
function monthGrid(anchor, picked, vendor, ctx){
  const t=T[lang], y=anchor.getFullYear(), m=anchor.getMonth();
  const last=new Date(y,m+1,0).getDate();
  const lead=(new Date(y,m,1).getDay()+6)%7;
  const pool=vendor?null:matched();

  let g=WD_MON[lang].map((w,i)=>`<em class="${i>4?'we':''}">${w}</em>`).join('');
  for(let i=0;i<lead;i++) g+='<b class="pad"></b>';

  let freeDays=0, busyDays=0;
  for(let d=1;d<=last;d++){
    const dt=new Date(y,m,d), wd=dt.getDay(), we=(wd===0||wd===6);
    /* день, который уже прошёл, не показываем — место в сетке сохраняем */
    if(dt<TODAY && !sameDay(dt,TODAY)){ g+='<b class="pad"></b>'; continue; }
    const past=false;
    let cls='ok', note='', blocked=past;

    if(vendor){
      const busy=isBusy(vendor,dt);
      if(busy){cls='no';blocked=true;busyDays++}
      else{
        freeDays++;
        if(vendor.c==='hall'&&vendor.pk.length>1) note=we?vendor.pk[1][2]:vendor.pk[0][2];
      }
    }else{
      const n=pool.filter(v=>!isBusy(v,dt)).length;
      if(!n){cls='no';blocked=true;busyDays++}
      else{freeDays++; note=`<i class="bars" style="--f:${Math.round(n/Math.max(pool.length,1)*100)}%"></i>`}
    }
    if(past) cls='past';
    if(picked&&sameDay(dt,picked)) cls='sel';

    g+=`<b class="${cls}${we?' we':''}"${blocked?'':` data-pick="${y}-${m}-${d}" tabindex="0" role="button"`}>
          <u>${d}</u>${note!==''?`<s>${note}</s>`:''}</b>`;
  }

  const canBack=new Date(y,m,1)>new Date(TODAY.getFullYear(),TODAY.getMonth(),1);
  const canFwd =new Date(y,m,1)<LAST_MONTH;
  const sum = vendor
    ? (busyDays?t.calBusyN(busyDays):t.calAllFree)
    : t.calFreeN(freeDays);

  const minM = (y===TODAY.getFullYear()) ? TODAY.getMonth() : 0;
  const menu = (kind, items, cur, attr) => (pickOpen===kind && pickCtx===ctx) ? `
    <span class="dp-menu" role="listbox">
      ${items.map(o=>`<button role="option" aria-selected="${o.v===cur}"
        class="${o.v===cur?'on':''}" ${attr}="${o.v}">${o.t}
        ${o.v===cur?ico('checkFill',14):''}</button>`).join('')}
    </span>` : '';
  const monItems = MON_N[lang].map((nm,i)=>({v:i,t:nm})).filter(o=>o.v>=minM);
  const yrItems  = YEARS.map(yy=>({v:yy,t:String(yy)}));

  const dirCls = calDir>0 ? ' inL' : (calDir<0 ? ' inR' : '');
  calDir=0;
  return `<div class="dp">
    <div class="dp-h">
      <div class="dp-title">
        <span class="dp-pick">
          <button class="dp-mo" data-pickmenu="mon" data-ctx="${ctx}"
            aria-haspopup="listbox" aria-expanded="${pickOpen==='mon'&&pickCtx===ctx}"
            aria-label="${t.calMonth}">${MON_N[lang][m]}</button>
          ${menu('mon', monItems, m, 'data-setmon')}
        </span>
        <span class="dp-pick">
          <button class="dp-yr" data-pickmenu="yr" data-ctx="${ctx}"
            aria-haspopup="listbox" aria-expanded="${pickOpen==='yr'&&pickCtx===ctx}"
            aria-label="${t.calYear}">${y}</button>
          ${menu('yr', yrItems, y, 'data-setyr')}
        </span>
        <span class="dp-caret">${ico('caretDown',12)}</span>
        <span class="dp-sum">${sum}</span>
      </div>
      <div class="dp-nav">
        <button data-mo="-1" aria-label="←" ${canBack?'':'disabled'}>${ico('prev',14)}</button>
        <button data-mo="1" aria-label="→" ${canFwd?'':'disabled'}>${ico('next',14)}</button></div>
    </div>
    <div class="dp-g${dirCls}">${g}</div>
    <div class="dp-leg">
      ${vendor
        ? `<span><i class="sw ok"></i>${t.legFree}</span><span><i class="sw no"></i>${t.legBusy}</span>
           <span><i class="sw sel"></i>${t.legSel}</span>
           ${vendor.c==='hall'?`<span class="dp-hint">${t.calPrice}</span>`:''}`
        : `<span><i class="bars mini" style="--f:80%"></i>${t.calMany}</span>
           <span><i class="bars mini" style="--f:22%"></i>${t.calFew}</span>`}
      <span class="dp-we">${t.calWe}</span>
    </div>
  </div>`;
}

/* Звук премиум-раздела.
   Синтезируется на лету — файла нет, вес нулевой.
   Играет один раз за сессию: повторный вход молчит. */
const CHIME_VOL = 0.055;
let audioCtx = null, chimePlayed = false, soundOff = false;

function chime(){
  if(soundOff || chimePlayed) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  if(!AC) return;                       /* в старых вебвью Web Audio может не быть */
  if(typeof matchMedia==='function' && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  try{
    audioCtx = audioCtx || new AC();
    if(audioCtx.state === 'suspended') audioCtx.resume();
    const t = audioCtx.currentTime;
    /* два тона в квинту с долгим затуханием — удар по стеклу, не сигнал */
    [[880, 0], [1318.5, 0.09]].forEach(([f, d], i) => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0, t + d);
      g.gain.linearRampToValueAtTime(CHIME_VOL * (i ? .6 : 1), t + d + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + d + 1.6);
      o.connect(g).connect(audioCtx.destination);
      o.start(t + d); o.stop(t + d + 1.7);
    });
    chimePlayed = true;
  }catch(_){ /* звук не критичен: не смог — молчим */ }
}

/* Фоновая музыка премиума. Синтезируется — файла нет, лицензировать нечего.
   Тихо, с нарастанием за 6 секунд: успеть выключить, если вокруг люди. */
const MUSIC_VOL = 0.040;
const CHORD_MS  = 7000;
const CHORDS = [
  [220.00, 277.18, 329.63, 415.30],
  [184.997, 277.18, 369.99, 440.00],
  [146.83, 220.00, 293.66, 349.23],
  [164.81, 246.94, 329.63, 415.30],
];
let music = null, chordTimer = null, chordAt = 0;

function musicStart(){
  if(soundOff || music) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  if(!AC) return;
  if(typeof matchMedia==='function' && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  try{
    audioCtx = audioCtx || new AC();
    if(audioCtx.state === 'suspended') audioCtx.resume();
    const t = audioCtx.currentTime;
    const out = audioCtx.createGain();
    out.gain.setValueAtTime(0, t);
    out.gain.linearRampToValueAtTime(MUSIC_VOL, t + 6);
    const lp = audioCtx.createBiquadFilter();
    lp.type='lowpass'; lp.frequency.value=900; lp.Q.value=.4;
    const lfo = audioCtx.createOscillator(), lfoG = audioCtx.createGain();
    lfo.frequency.value=0.045; lfoG.gain.value=260;
    lfo.connect(lfoG).connect(lp.frequency); lfo.start(t);
    const voices = CHORDS[0].map((f,i)=>{
      const o=audioCtx.createOscillator(), g=audioCtx.createGain();
      o.type = i===0 ? 'triangle' : 'sine';
      o.frequency.setValueAtTime(f,t);
      g.gain.value = i===0 ? .5 : (i===3 ? .22 : .34);
      o.connect(g).connect(lp); o.start(t); return o;
    });
    lp.connect(out).connect(audioCtx.destination);
    music={out,lp,lfo,voices}; chordAt=0;
    chordTimer=setInterval(()=>{
      if(!music || document.hidden) return;
      chordAt=(chordAt+1)%CHORDS.length;
      const now=audioCtx.currentTime;
      music.voices.forEach((o,i)=>o.frequency.setTargetAtTime(CHORDS[chordAt][i], now, 1.6));
    }, CHORD_MS);
  }catch(_){ music=null }
}

function musicStop(){
  clearInterval(chordTimer); chordTimer=null;
  if(!music) return;
  const m=music; music=null;
  try{
    const t=audioCtx.currentTime;
    m.out.gain.cancelScheduledValues(t);
    m.out.gain.setValueAtTime(m.out.gain.value, t);
    m.out.gain.linearRampToValueAtTime(0, t+1.2);
    setTimeout(()=>{ try{ m.voices.forEach(o=>o.stop()); m.lfo.stop() }catch(_){} }, 1500);
  }catch(_){}
}

/* ============ ФОКУС В ДИАЛОГАХ ============
   Без этого пользователь клавиатуры открывает профиль, а фокус остаётся
   на карточке под ним: таб уводит по скрытому содержимому. */
const FOCUSABLE = 'a[href],button:not([disabled]),input:not([disabled]),select,textarea,[tabindex]:not([tabindex="-1"])';
let dlgReturn = null;

const visible = el => {
  let n = el;
  while(n && n.nodeType === 1){
    const c = getComputedStyle(n);
    if(c.display === 'none' || c.visibility === 'hidden') return false;
    n = n.parentElement;
  }
  return true;
};
const dlgItems = dlg => [...dlg.querySelectorAll(FOCUSABLE)].filter(visible);

function openDialog(dlg){
  if(!dlg) return;
  dlgReturn = document.activeElement;
  dlg.setAttribute('aria-hidden','false');
  /* фокус после окончания перехода: на едущем элементе он прокручивает контейнер */
  setTimeout(()=>{
    const first = dlgItems(dlg)[0];
    if(first) try{ first.focus({preventScroll:true}) }catch(_){ first.focus() }
  }, 60);
}

function closeDialog(dlg){
  if(!dlg) return;
  dlg.setAttribute('aria-hidden','true');
  const back = dlgReturn; dlgReturn = null;
  if(back && document.contains(back)) try{ back.focus({preventScroll:true}) }catch(_){ back.focus() }
}

/* таб не должен выходить за пределы открытого диалога */
document.addEventListener('keydown', e => {
  if(e.key !== 'Tab') return;
  const dlg = [...document.querySelectorAll('.screen.on')].pop();
  if(!dlg) return;
  const items = dlgItems(dlg);
  if(!items.length) return;
  const first = items[0], last = items[items.length-1];
  if(e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus() }
  else if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus() }
  else if(!dlg.contains(document.activeElement)){ e.preventDefault(); first.focus() }
});

const LANG_FADE = 170;   /* мс — растворение при смене языка */

/* Чип едет сразу: касание должно отзываться мгновенно.
   Текст меняется под затемнением, пока его не видно. */
function setLang(next, animate){
  if(next===lang) return;
  $('#lang').dataset.l = next;
  const still = animate===false
    || (typeof matchMedia==='function' && matchMedia('(prefers-reduced-motion: reduce)').matches);
  if(still){ lang=next; renderAll(); return }
  const sc=$('#scroll');
  sc.classList.add('fading');
  setTimeout(()=>{ lang=next; renderAll(); sc.classList.remove('fading') }, LANG_FADE);
}

function closePick(){
  const c=pickCtx; pickOpen=pickCtx=null; if(c) redrawCal(c);
}
function redrawCal(c){
  if(c==='req') renderReq(); else if(c==='pf') renderProfile(); else renderSheet();
}
function applyMonth(mm, yy){
  const c = pickCtx;
  const cur = c==='req' ? rqMonth : (c==='pf' ? pfMonth : calMonth);
  let m = mm!==null ? mm : cur.getMonth();
  let y = yy!==null ? yy : cur.getFullYear();
  /* прыжок в текущий год не должен приземлить в прошедший месяц */
  if(y===TODAY.getFullYear() && m<TODAY.getMonth()) m=TODAY.getMonth();
  const nd = clampMonth(new Date(y,m,1));
  if(c==='req') rqMonth=nd; else if(c==='pf') pfMonth=nd; else calMonth=nd;
  pickOpen=pickCtx=null;
  redrawCal(c);
}
function clampMonth(d){
  const lo=new Date(TODAY.getFullYear(),TODAY.getMonth(),1);
  if(d<lo) return lo;
  if(d>LAST_MONTH) return new Date(LAST_MONTH);
  return d;
}
function startMonth(d){
  if(d) return clampMonth(new Date(d.getFullYear(), d.getMonth(), 1));
  const last=new Date(TODAY.getFullYear(),TODAY.getMonth()+1,0).getDate();
  const m=(last-TODAY.getDate()<6)?TODAY.getMonth()+1:TODAY.getMonth();
  return clampMonth(new Date(TODAY.getFullYear(), m, 1));
}
const dateStr=d=>lang==='ru'?d.getDate()+' '+MONS.ru[d.getMonth()]:d.getDate()+'-'+MONS.uz[d.getMonth()];

let adTimer=null, adAuto=0, adWake=null;
/* Element.scrollTo есть не везде — без запасного пути карусель молча встанет */
function slideTo(el, left){
  if(el.scrollTo) el.scrollTo({left, behavior:'smooth'}); else el.scrollLeft = left;
}
function adPause(){ if(adTimer){clearInterval(adTimer); adTimer=null} }
/* Пролистал сам — не выключаем совсем, а даём дочитать и продолжаем. */
function adDefer(){
  adPause();
  clearTimeout(adWake);
  adWake=setTimeout(adStart, AD_RESUME);
}
function adStart(){
  adPause(); clearTimeout(adWake);
  if(tab!==TAB.home) return;
  /* авто-смена вредна тем, кто читает медленно или чувствителен к движению */
  if(typeof matchMedia==='function' && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  adTimer=setInterval(()=>{
    const tr=$('#heroTrack'); if(!tr||document.hidden) return;
    const n=tr.children.length; if(n<2) return;
    const i=Math.round(tr.scrollLeft/tr.clientWidth);
    adAuto=Date.now(); slideTo(tr, ((i+1)%n)*tr.clientWidth);
  }, AD_EVERY);
}

/* цена конкретного дня: у залов будни и выходные стоят по-разному */
function dayPrice(v,d){
  if(v.c==='hall'&&v.pk.length>1&&d){const we=(d.getDay()===0||d.getDay()===6);return we?v.pk[1][2]:v.pk[0][2]}
  return v.p;
}
/* статус ведёт вендор со своей стороны; здесь он смоделирован */
const stKey=v=>['new','ans','deal'][v.seed%3];

function renderToy(){
  const t=T[lang], el=$('#viewToy');
  const cats=CATS[occ||'all'];
  const byCat={}; reqs.forEach(r=>{const v=V.find(x=>x.n===r.n); if(v) byCat[v.c]=r});
  const savedByCat={}; V.filter(v=>saved.has(v.n)).forEach(v=>{savedByCat[v.c]=(savedByCat[v.c]||0)+1});

  const done=cats.filter(c=>byCat[c[0]]).length;
  const total=cats.length;
  const sum=reqs.reduce((a,r)=>{const v=V.find(x=>x.n===r.n);return a+(v?dayPrice(v,r.date):0)},0);

  const oc = occ ? OCC.find(o=>o.id===occ) : null;
  const ch = critHTML();

  /* шапка меняется, а прогресс и счёт нужны в любом случае */
  const inner = !occ ? `
    <div class="mt-ask">
      <div class="mt-ask-t">${t.mtPick}</div>

  const top = `
    <div class="mt-card">

        <div class="mt-prog-t"><span>${t.mtProgress}</span><b>${done} / ${total}</b></div>
        <div class="mt-bar"><i style="width:${Math.round(done/total*100)}%"></i></div>
      </div>
    </div>`;
  const prog = '';

  const bill = reqs.length ? `
    <div class="mt-bill">
      <div class="bill-h">${t.mtBudget}</div>

      <p class="bill-note">${t.mtBudgetNote}</p>
    </div>` : '';

  const head = top + prog + bill;

  const rows = cats.map(c=>{
    const id=c[0], label=lang==='ru'?c[1]:c[2];
    const r=byCat[id];
    if(r){
      const v=V.find(x=>x.n===r.n), st=stKey(v);
      return `<div class="mt-row done" data-card="${v.n}" tabindex="0" role="button">
        <span class="mt-i ok">${ico('checkFill',17)}</span>
        <span class="mt-b"><b>${label}</b><span>${v.n} · ${dayPrice(v,r.date)} ${t.mln}</span></span>
        <span class="st st-${st}">${t['st_'+st]}</span></div>`;
    }
    const nSaved=savedByCat[id]||0;
    return `<div class="mt-row" data-goto="${id}" tabindex="0" role="button">
      <span class="mt-i">${ico(id,15)}</span>
      <span class="mt-b"><b>${label}</b><span>${nSaved?t.mtSaved(nSaved):t.mtNone}</span></span>
      <span class="mt-go">${nSaved?t.mtChoose:t.mtFind}${ico('caret',12)}</span></div>`;
  }).join('');

  const extraRows = extras.map(x=>`
    <div class="mt-row" data-goto="" data-extra="${x.id}" tabindex="0" role="button">
      <span class="mt-i">${ico('sparkle',17)}</span>
      <span class="mt-b"><b>${x.name}</b><span>${t.mtNone}</span></span>
      <span class="mt-go">${t.mtFind}${ico('caret',12)}</span>

       <div class="cmp-acts">

/* Заявка живёт 12 часов до обещанного ответа — показываем, сколько осталось */
function hoursLeft(sentAt){
  const passed = (Date.now() - sentAt) / 3600000;
  return Math.max(0, 12 - passed);
}

function renderTab(){
  const t=T[lang];
  mode = inLux ? 'lux' : 'all';
  if(mode==='lux'){ chime(); musicStart() } else musicStop();
  document.querySelector('.shell').dataset.theme = mode;
  if(typeof tgChrome === 'function') tgChrome();
  /* Лента обслуживает две вкладки — перечислять её дважды нельзя:
     второй проход скрыл бы то, что показал первый. */
  const feed = (tab===TAB.home || tab===TAB.lux);
  const show = [[$('#viewSearch'), feed],
                [$('#viewSaved'),  tab===TAB.saved],
                [$('#viewToy'),    tab===TAB.event],
                [$('#viewSoon'),   tab===TAB.me]];
  show.forEach(([el,on])=>{
    el.style.display = on ? '' : 'none';
    if(on){ el.classList.remove('view-in'); void el.offsetWidth; el.classList.add('view-in') }
  });
  /* inactive views are emptied so they can never hold stale copy after a language switch */
  if(tab===TAB.home || tab===TAB.lux) renderList();
  if(tab===TAB.saved) renderSaved(); else $('#viewSaved').innerHTML='';
  if(tab===TAB.event) renderToy();   else $('#viewToy').innerHTML='';
  if(tab===TAB.me) renderMe();    else $('#viewSoon').innerHTML='';
}

let toastTimer;
function toast(m){const el=$('#toast');el.innerHTML=m;el.classList.add('on');
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('on'),3800)}

/* ---------- события ---------- */
document.addEventListener('click',e=>{
  const o=e.target.closest('[data-o]');
  if(o){occ=o.dataset.o||null;cat=null;renderAll();return}

  const inReq = !!e.target.closest('#req');
  const inPf  = !inReq && !!e.target.closest('#profile');

  if(e.target.closest('#dpBtn')){dpOpen=!dpOpen;renderSheet();return}
  if(e.target.closest('#rqDpBtn')){rqDpOpen=!rqDpOpen;renderReq();return}
  if(e.target.closest('#noDate2')){sel=null;dpOpen=false;renderSheet();renderCrit();return}

  const pk2=e.target.closest('[data-pickmenu]');
  if(pk2){
    const kind=pk2.dataset.pickmenu, c=pk2.dataset.ctx;
    const same = pickOpen===kind && pickCtx===c;
    pickOpen = same ? null : kind; pickCtx = same ? null : c;
    redrawCal(c); return;
  }
  const sm=e.target.closest('[data-setmon]');
  if(sm){ applyMonth(+sm.dataset.setmon, null); return }
  const sy=e.target.closest('[data-setyr]');
  if(sy){ applyMonth(null, +sy.dataset.setyr); return }
  if(pickOpen && !e.target.closest('.dp-menu')){ closePick() }

  const mo=e.target.closest('[data-mo]');
  if(mo){const n=+mo.dataset.mo;
    calDir=n;
    const step=d=>clampMonth(new Date(d.getFullYear(),d.getMonth()+n,1));
    if(inReq){rqMonth=step(rqMonth);renderReq()}
    else if(inPf){pfMonth=step(pfMonth);renderProfile()}
    else{calMonth=step(calMonth);renderSheet()}
    return}

  const pk=e.target.closest('[data-pick]');
  if(pk){const [y,m,dd]=pk.dataset.pick.split('-').map(Number);
    const nd=new Date(y,m,dd);
    if(inReq){rqDate=nd;rqDpOpen=false;renderReq()}
    else if(inPf){sel=nd;renderProfile();renderCrit();quiet=true;renderList();
                  toast(T[lang].pickDate(dateStr(sel)))}
    else{sel=(sel&&sameDay(nd,sel))?null:nd;dpOpen=false;renderSheet();renderCrit()}
    return}

  const g=e.target.closest('[data-g]');
  if(g){guests=+g.dataset.g||null;renderSheet();renderCrit();return}

  const c=e.target.closest('[data-c]');
  if(c){cat=cat===c.dataset.c?null:c.dataset.c;renderCats();renderList();return}

  const h=e.target.closest('[data-h]');
  if(h){const n=h.dataset.h;
    if(saved.has(n))saved.delete(n);else{saved.add(n);toast(T[lang].saved)}
    quiet=true;renderList();renderNav();if(tab===TAB.saved)renderSaved();return}

  if(e.target.closest('[data-open]')){openSheet();return}

  const r=e.target.closest('[data-req]');
  if(r){const v=V.find(x=>x.n===r.dataset.req);
        if(v){cur=v;openReq();} else toast(T[lang].req('<b>'+r.dataset.req+'</b>'));
        return}

  if(e.target.closest('#pfBack')){closeProfile();return}
  if(e.target.closest('#pfShare')){toast(T[lang].pfCopy('<b>'+cur.n+'</b>'));return}
  if(e.target.closest('#pfHeart')){
    saved.has(cur.n)?saved.delete(cur.n):saved.add(cur.n);
    quiet=true;renderProfile();renderList();renderNav();if(tab===TAB.saved)renderSaved();return}
  if(e.target.closest('#verBox')){$('#verBox').classList.toggle('open');return}
  if(e.target.closest('#pfCall')){toast(T[lang].pfCall('<b>'+cur.tel+'</b>'));return}
  if(e.target.closest('#pfReq')){openReq();return}

  if(e.target.closest('#rqBack')){closeReq();return}
  const bd=e.target.closest('[data-bud]');
  if(bd){rqBud=+bd.dataset.bud;renderReq();return}
  if(e.target.closest('#rqSend')){openPerm();return}
  if(e.target.closest('#permNo')||e.target.closest('#permScrim')){closePerm();return}
  if(e.target.closest('#permOk')){
    closePerm(); rqSent=true;
    if(!reqs.some(r=>r.n===cur.n)) reqs.push({n:cur.n,date:rqDate,guests:rqG,bud:rqBud,at:Date.now(),st:'new'});
    renderReq(); renderNav(); $('#rqScroll').scrollTop=0; return}
  if(e.target.closest('#sHome')){closeReq();closeProfile();tab=TAB.event;renderNav();renderTab();
    $('#scroll').scrollTop=0;return}
  if(e.target.closest('#sSearch')){closeReq();closeProfile();tab=TAB.home;renderNav();renderTab();
    $('#scroll').scrollTop=0;return}
  if(e.target.closest('#sCall')){toast(T[lang].pfCall('<b>'+cur.tel+'</b>'));return}
  if(e.target.closest('#sTg')){toast(T[lang].pfCall('<b>'+cur.tel+'</b>'));return}
  const nx=e.target.closest('[data-nxt]');
  if(nx){cat=nx.dataset.nxt;closeReq();closeProfile();renderCats();renderList();$('#scroll').scrollTop=0;return}

  const card=e.target.closest('[data-card]');
  if(card){openProfile(card.dataset.card);return}

  const lb=e.target.closest('#lang button[data-l]');
  if(lb){ setLang(lb.dataset.l); return }

  const nb=e.target.closest('[data-tab]');
  if(nb){
    const nt=+nb.dataset.tab;
    if(nt===TAB.lux) inLux=true;          /* вошли в премиум */
    if(nt===TAB.home) inLux=false;        /* «Главная» — это уже другое приложение */
    tab=nt;cmpOn=false;
    renderNav();renderTab();
    if(tab===TAB.home) adStart(); else adPause();
    $('#scroll').scrollTop=0;
    if(tab===TAB.home) adStart(); else adPause();
    const b=$('#nav').querySelector(`[data-tab="${tab}"]`);   /* не по индексу: центральная кнопка сдвигает нумерацию */
    if(b){b.classList.add('tapped');
      b.addEventListener('animationend',()=>b.classList.remove('tapped'),{once:true})}
    return}

  const ck=e.target.closest('[data-cmp]');
  if(ck){const n=ck.dataset.cmp; cmp.has(n)?cmp.delete(n):cmp.add(n); renderSaved(); return}

  if(e.target.closest('#svAll')){
    const rows=V.filter(v=>saved.has(v.n));
    rows.every(v=>cmp.has(v.n)) ? cmp.clear() : rows.forEach(v=>cmp.add(v.n));
    renderSaved();return}
  if(e.target.closest('#svFwd')){toast(T[lang].svShareMsg(cmp.size));return}

  const dt=e.target.closest('[data-slide]');
  if(dt){const tr=$('#heroTrack');
    adDefer(); adAuto=Date.now(); slideTo(tr, +dt.dataset.slide*tr.clientWidth);
    return}
  if(e.target.closest('#luxBack')){
    inLux=false; tab=TAB.home;
    renderNav(); renderTab(); renderAll(); $('#scroll').scrollTop=0; return}
  if(e.target.closest('#luxMute')){
    soundOff = !soundOff;
    if(soundOff) musicStop();
    else { chimePlayed = false; chime(); musicStart() }
    renderList(); return}
  if(e.target.closest('#meReqs')||e.target.closest('#svReqs')||e.target.closest('#pfSent')){
    renderMyReqs(); $('#myreqs').classList.add('on'); openDialog($('#myreqs')); return}
  if(e.target.closest('#mrBack')){ $('#myreqs').classList.remove('on'); closeDialog($('#myreqs')); return}
  const mrq=e.target.closest('[data-mrq]');
  if(mrq){ $('#myreqs').classList.remove('on'); closeDialog($('#myreqs')); openProfile(mrq.dataset.mrq); return}
  if(e.target.closest('#meBtn')){
    tab = tab===TAB.me ? TAB.home : TAB.me;
    renderNav();renderTab();renderAll();$('#scroll').scrollTop=0;return}
  if(e.target.closest('#navSearch')){openSearch();return}
  if(e.target.closest('#srBack')){closeSearch();return}
  if(e.target.closest('#srClear')){query='';renderSearch();$('#srIn').value='';
    focusSafe($('#srIn'));return}
  const sc=e.target.closest('[data-srcat]');
  if(sc){cat=sc.dataset.srcat;closeSearch();tab=TAB.home;renderNav();renderTab();renderCats();renderList();
    $('#scroll').scrollTop=0;return}
  const sq=e.target.closest('[data-srq]');
  if(sq){query=sq.dataset.srq;$('#srIn').value=query;renderSearch();return}
  if(e.target.closest('#mtEdit')){openSheet();return}
  if(e.target.closest('#mtAdd')){openAdd();return}
  if(e.target.closest('#sortBtn')){openSort();return}
  if(e.target.closest('#densBtn')){dense=!dense;renderList();return}
  const so=e.target.closest('[data-sort]');
  if(so){sort=so.dataset.sort;closePerm();renderList();$('#scroll').scrollTop=0;return}
  if(e.target.closest('#addGo')){
    const v=($('#addIn').value||'').trim();
    if(!v){toast(T[lang].mtAddEmpty);return}
    extras.push({id:'x'+Date.now(), name:v.slice(0,40)});
    closePerm(); renderToy(); toast(T[lang].mtAdded(v)); return}
  const rm=e.target.closest('[data-rmx]');
  if(rm){extras=extras.filter(x=>x.id!==rm.dataset.rmx);renderToy();return}

  const tg=e.target.closest('[data-tg]');
  if(tg){const k=tg.dataset.tg;notif[k]=!notif[k];renderMe();
    if(k==='news') toast(notif.news?T[lang].meNewsOn:T[lang].meNewsOff);
    return}
  const inf=e.target.closest('[data-info]');
  if(inf){const k=inf.dataset.info;openInfo(T[lang]['i_'+k+'_h'],T[lang]['i_'+k+'_b'],false);return}
  if(e.target.closest('#meCity')){openInfo(T[lang].i_city_h,T[lang].i_city_b,false);return}
  if(e.target.closest('#meWipe')){openInfo(T[lang].i_wipe_h,T[lang].i_wipe_b,true);return}
  if(e.target.closest('#wipeGo')){
    saved.clear();cmp.clear();reqs.length=0;notif={ans:true,saved:true,news:false};
    closePerm();renderAll();toast(T[lang].meWipeMsg);return}
  if(e.target.closest('#meSup')){openContact();return}
  if(e.target.closest('[data-ch]')){
    const ch=e.target.closest('[data-ch]').dataset.ch;
    closePerm(); toast(ch==='tg'?T[lang].chTgMsg:T[lang].chMailMsg); return}
  const gt=e.target.closest('[data-goto]');
  if(gt&&!e.target.closest('[data-rmx]')){cat=gt.dataset.goto||null;tab=TAB.home;cmpOn=false;renderNav();renderTab();renderCats();renderList();
         $('#scroll').scrollTop=0;return}
  if(e.target.closest('#svDel')){
    const n=cmp.size; cmp.forEach(x=>saved.delete(x)); cmp.clear();
    renderSaved();renderList();renderNav();toast(T[lang].svDelMsg(n));return}
  if(e.target.closest('#cmpGo')){cmpOn=true;renderSaved();$('#scroll').scrollTop=0;return}
  if(e.target.closest('#cmpBack')){cmpOn=false;renderSaved();return}
  if(e.target.closest('#svShare')){toast(T[lang].svShareMsg(saved.size));return}
});

/* --- keyboard --- */
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if ($('#myreqs').classList.contains('on')) { $('#myreqs').classList.remove('on'); closeDialog($('#myreqs')); return; }
    if (pickOpen) { closePick(); return; }
    if ($('#perm').classList.contains('on')) return closePerm();

    if ($('#profile').classList.contains('on')) return closeProfile();
    return;

  /* things that behave like buttons but are not <button> */
  if (e.key === 'Enter' || e.key === ' ') {
    const el = document.activeElement;
    if (el && el.matches('[data-card],[data-pick],[data-goto],[data-seg]')) {
      e.preventDefault();
      el.dispatchEvent(new MouseEvent('click', { bubbles: true }));

  }
});

/* ============ SPLASH ============
   Три числа, которыми настраивается вся заставка.
   Остальная хореография живёт в CSS-анимациях. */
const AD_EVERY  = 4000;   /* мс — сколько держится один баннер */
const AD_RESUME = 9000;   /* мс — пауза после ручного листания, потом снова сам */

const SPL_STAGGER = 55;    /* мс — шаг между слоями узора */
const SPL_SWAP    = 4400;  /* мс — узбекский слоган сменяется русским */
const SPL_END     = 5800;  /* мс — заставка начинает уходить (плавно, .6s) */

const splash = $('#splash');
let splTimers = [];

function splClear(){ splTimers.forEach(clearTimeout); splTimers = []; }

function splEnd(){
  if(!splash || splash.classList.contains('done')) return;
  splClear();
  splash.classList.add('done');
  setTimeout(() => splash.classList.add('hidden'), 620);
}

function splStart(){
  if(!splash) return;
  splClear();
  splash.classList.remove('done','hidden','is-live');
  splash.style.setProperty('--spl-stagger', SPL_STAGGER + 'ms');
  splash.querySelectorAll('.g-oct,.g-ring').forEach((n,i)=>n.style.animationDelay=(1550+i*SPL_STAGGER*4)+'ms');
  const uz = splash.querySelector('.uz'), ru = splash.querySelector('.ru');
  uz.className = 'uz'; ru.className = 'ru';
  void splash.offsetWidth;                    /* reflow, чтобы анимации пошли заново */
  splash.classList.add('is-live');

  /* в старых вебвью matchMedia может отсутствовать — без проверки заставка зависнет */
  const still = typeof matchMedia === 'function'
    && matchMedia('(prefers-reduced-motion: reduce)').matches;
  splTimers.push(setTimeout(() => uz.classList.add('on'), still ? 0 : 3300));
  splTimers.push(setTimeout(() => {
    uz.classList.remove('on'); uz.classList.add('up');
    ru.classList.add('on');
  }, still ? 0 : SPL_SWAP));
  splTimers.push(setTimeout(splEnd, still ? 1400 : SPL_END));
}

splash && splash.addEventListener('click', splEnd);   /* тап пропускает */
splStart();


/* ============ TELEGRAM MINI APP ============
   Каждый вызов защищён: приложение обязано работать и в обычном браузере,
   и в старом клиенте, где половины методов нет. */
const TG = (window.Telegram && window.Telegram.WebApp) || null;
const tgCall = (name, ...args) => {
  if(!TG || typeof TG[name] !== 'function') return null;
  try{ return TG[name](...args) }catch(_){ return null }
};

function tgInsets(){
  if(!TG) return;
  const r = document.documentElement.style;
  const put = (n, v) => { if(typeof v === 'number' && isFinite(v)) r.setProperty(n, v + 'px') };
  const sa = TG.safeAreaInset || {}, csa = TG.contentSafeAreaInset || {};
  put('--tg-safe-area-inset-top', sa.top);
  put('--tg-safe-area-inset-bottom', sa.bottom);
  put('--tg-safe-area-inset-left', sa.left);
  put('--tg-safe-area-inset-right', sa.right);
  put('--tg-content-safe-area-inset-top', csa.top);
  put('--tg-content-safe-area-inset-bottom', csa.bottom);
  const h = TG.viewportStableHeight;
  if(h) r.setProperty('--tg-viewport-stable-height', h + 'px');
}

/* цвет шапки клиента должен совпадать с фоном экрана — иначе виден стык */
/* Читаем токен, а не вычисленный фон: в премиуме фон — градиент,
   и backgroundColor там прозрачный, отчего шапка клиента стала бы чёрной. */
function tgChrome(){
  if(!TG) return;
  const el = document.querySelector('.shell');
  if(!el) return;
  const cs = getComputedStyle(el);
  let c = (cs.getPropertyValue('--paper') || '').trim();
  if(!/^#[0-9A-Fa-f]{3,6}$/.test(c)){
    const m = String(cs.backgroundColor).match(/rgba?\((\d+),\s*(\d+),\s*(\d+)(?:,\s*([\d.]+))?/);
    if(!m || (m[4] !== undefined && +m[4] === 0)) return;   /* прозрачный — не трогаем */
    c = '#' + [1,2,3].map(i => (+m[i]).toString(16).padStart(2,'0')).join('');
  }
  tgCall('setHeaderColor', c);
  tgCall('setBackgroundColor', c);
}

function tgInit(){
  if(!TG) return;
  tgCall('ready');
  tgCall('expand');
  const mobile = TG.platform === 'ios' || TG.platform === 'android';
  const canFull = typeof TG.isVersionAtLeast === 'function' && TG.isVersionAtLeast('8.0');
  if(mobile && canFull) tgCall('requestFullscreen');
  tgCall('disableVerticalSwipes');
  ['safeAreaChanged','contentSafeAreaChanged','viewportChanged','fullscreenChanged']
    .forEach(ev => { if(typeof TG.onEvent === 'function'){ try{ TG.onEvent(ev, tgInsets) }catch(_){} } });
  tgInsets();
  tgChrome();
}

tgInit();
renderAll();
