<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAF7F4">
<title>Bayram.uz — кабинет вендора</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;600;700&display=swap" rel="stylesheet">
<style>

:root{
  --paper:#FAF7F4;--white:#fff;--rule:#E4DCD6;--lilac:#F1EAF9;
  --ink:#2A2233;--muted:#6F6580;--muted-lt:#786E84;
  --plum:#2C1B47;--plum-mid:#4E3170;--plum-deep:#1B1030;
  --coral:#EE6C4D;--coral-deep:#C74627;--coral-soft:#FDE7DC;--peach:#F9CDB2;
  --teal:#2E9E93;--teal-soft:#E2F1EF;--berry:#A82F52;--berry-soft:#FAE7EC;
  --t0:90ms;--t1:150ms;--t2:270ms;--t3:400ms;
  --ease:cubic-bezier(.32,.72,0,1);--ease-in:cubic-bezier(.55,.06,.68,.19);--ease-io:cubic-bezier(.65,0,.35,1);
  --star:url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='52'%20height='52'%20viewBox='0%200%2052%2052'%3E%3Cg%20fill='none'%20stroke='%23FFFFFF'%20stroke-opacity='0.55'%20stroke-width='1'%3E%3Crect%20x='10'%20y='10'%20width='32'%20height='32'/%3E%3Crect%20x='10'%20y='10'%20width='32'%20height='32'%20transform='rotate(45%2026%2026)'/%3E%3Ccircle%20cx='26'%20cy='26'%20r='4'/%3E%3C/g%3E%3C/svg%3E");
  --star-lg:url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='84'%20height='84'%20viewBox='0%200%2084%2084'%3E%3Cg%20fill='none'%20stroke='%23FFFFFF'%20stroke-opacity='0.5'%20stroke-width='1.3'%3E%3Crect%20x='18'%20y='18'%20width='47'%20height='47'/%3E%3Crect%20x='18'%20y='18'%20width='47'%20height='47'%20transform='rotate(45%2042%2042)'/%3E%3Ccircle%20cx='42'%20cy='42'%20r='6'/%3E%3C/g%3E%3C/svg%3E");
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior:none}
body{font-family:'Manrope',system-ui,sans-serif;color:var(--ink);background:var(--paper);
  -webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;display:flex;justify-content:center;overflow:hidden}
.shell{width:100%;max-width:440px;height:100dvh;background:var(--paper);position:relative;overflow:hidden;overflow:clip;display:flex;flex-direction:column}
h1,h2,h3,.hd{font-family:'Unbounded',sans-serif;font-weight:600;color:var(--plum);letter-spacing:-.03em;line-height:1.1}
h1{font-size:27px;letter-spacing:-.04em}h2{font-size:23px;letter-spacing:-.035em}h3{font-size:19px}
p{line-height:1.5}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,textarea,select{font-family:inherit;font-size:14px;color:var(--ink);background:var(--white);border:1px solid var(--rule);border-radius:14px;padding:12px;width:100%;outline:none;transition:border-color var(--t1) var(--ease)}
input:focus,textarea:focus,select:focus{border-color:var(--plum-mid)}
input::placeholder,textarea::placeholder{color:var(--muted-lt)}
textarea{resize:none;min-height:88px;line-height:1.5}
:focus{outline:none}:focus-visible{outline:2px solid var(--coral);outline-offset:3px;border-radius:8px}

/* шапка */
.bar{flex:0 0 auto;background:var(--paper);border-bottom:1px solid var(--rule);
  padding:calc(16px + env(safe-area-inset-top)) 18px 12px;display:flex;align-items:center;justify-content:space-between;gap:12px;z-index:6}
.wordmark{font-family:'Unbounded',sans-serif;font-weight:700;font-size:16px;letter-spacing:-.02em;color:var(--plum);display:flex;align-items:baseline;gap:7px}
.wordmark span{color:var(--coral)}
.wordmark i{font-family:'Manrope',sans-serif;font-style:normal;font-size:10px;font-weight:700;color:var(--muted-lt)}
.bar-r{display:flex;align-items:center;gap:4px}
.gear{max-width:44vw;height:38px;padding:0 11px;border-radius:12px;color:var(--plum);display:flex;align-items:center;gap:6px;
  font-size:12.5px;font-weight:700;background:var(--lilac);transition:background var(--t1) var(--ease)}
.gear b{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gear:hover{background:#E6DBF3}
.gear[aria-pressed="true"]{background:var(--plum);color:#fff}
.lang{display:inline-flex;align-items:center;gap:9px;padding:10px 2px}
.lang-o{font-size:11px;font-weight:700;letter-spacing:.14em;line-height:1;color:#B6AEC2;transition:color var(--t2) var(--ease)}
.lang[aria-checked="false"] .lang-o:first-child,.lang[aria-checked="true"] .lang-o:last-child{color:var(--plum)}
.lang-t{width:46px;height:25px;border-radius:999px;position:relative;overflow:hidden;transition:background var(--t3) var(--ease);
  box-shadow:0 1px 1px rgba(27,16,48,.16),0 3px 8px rgba(27,16,48,.14),inset 0 0 0 1px rgba(27,16,48,.13);
  background:linear-gradient(180deg,#E9E6EE 0 33.3%,#17418C 33.3% 66.6%,#BE2A22 66.6% 100%)}
.lang[aria-checked="true"] .lang-t{background:linear-gradient(180deg,#0E8AA1 0 31%,#B72232 31% 34%,#E9E6EE 34% 66%,#B72232 66% 69%,#23A143 69% 100%)}
.lang-t i{position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;background:linear-gradient(180deg,#FFF,#F4F2F7);
  box-shadow:0 1px 1px rgba(27,16,48,.24),0 3px 6px rgba(27,16,48,.3),inset 0 0 0 1px rgba(27,16,48,.15);transition:transform 380ms cubic-bezier(.34,1.5,.5,1)}
.lang[aria-checked="true"] .lang-t i{transform:translateX(21px)}

/* прокрутка и блоки */
.scroll{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;padding-bottom:100px}
.scroll::-webkit-scrollbar{width:0}
.block{padding:16px 18px 0}
.eyebrow{font-size:9.5px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--muted-lt);margin-bottom:11px;display:flex;align-items:center;gap:9px}
.eyebrow::after{content:'';flex:1;height:1px;background:var(--rule)}
.sub{font-size:12.5px;color:var(--muted);margin-top:5px}
.note{font-size:11px;color:var(--muted-lt);line-height:1.5}
.card{background:var(--white);border:1px solid var(--rule);border-radius:18px;padding:14px 16px;box-shadow:0 2px 10px rgba(44,27,71,.05)}
.row{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--rule);width:100%;text-align:left}
.row:last-child{border-bottom:0}
.row-i{width:32px;height:32px;border-radius:11px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;background:var(--lilac);color:var(--plum)}
.row-b{flex:1;min-width:0}.row-b b{display:block;font-size:13.5px;font-weight:700}.row-b span{display:block;font-size:11px;color:var(--muted);margin-top:2px;line-height:1.4}
.go{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--plum);flex:0 0 auto}
.btn{display:inline-flex;text-decoration:none;align-items:center;justify-content:center;gap:7px;font-size:14px;font-weight:700;padding:14px 18px;border-radius:14px;
  background:var(--coral-deep);color:#fff;transition:background var(--t1) var(--ease),transform var(--t1) var(--ease);width:100%}
.btn:hover{background:#e2593a}.btn:active{transform:scale(.975)}
.btn:disabled{background:var(--rule);color:var(--muted-lt);cursor:not-allowed}
.btn.ghost{background:none;border:1px solid var(--plum);color:var(--plum)}.btn.ghost:hover{background:var(--lilac)}
.btn.plum{background:var(--plum)}.btn.plum:hover{background:var(--plum-mid)}
.btn.sm{padding:10px 14px;font-size:12.5px;width:auto;border-radius:11px}
.btn.lite{background:var(--lilac);color:var(--plum)}.btn.lite:hover{background:#E6DBF3}
.link{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--plum);border-bottom:1.5px solid var(--plum);padding:0 0 4px}
.link:hover{color:var(--coral);border-color:var(--coral)}
.chip{font-size:9.5px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;padding:5px 10px;border-radius:999px;background:var(--lilac);color:var(--muted);display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.chip.ok{background:var(--teal-soft);color:#1F6E66}.chip.warn{background:var(--coral-soft);color:#9E3F22}.chip.bad{background:var(--berry-soft);color:var(--berry)}
.chip.ad{background:rgba(255,255,255,.92);color:var(--plum)}
.pill{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;border:1px solid var(--rule);background:var(--white);color:var(--muted);padding:10px 14px;border-radius:999px;white-space:nowrap;transition:background var(--t1) var(--ease),color var(--t1) var(--ease)}
.pill[aria-pressed="true"]{background:var(--plum);border-color:var(--plum);color:#fff}
.pills{display:flex;flex-wrap:wrap;gap:7px}
.tabs{display:flex;gap:7px;overflow-x:auto;margin:0 -18px;padding:0 18px 2px}
.tabs::-webkit-scrollbar{height:0}
.toast{position:absolute;left:18px;right:18px;bottom:92px;background:var(--plum-deep);color:#fff;border-radius:14px;padding:12px 14px;font-size:12.5px;line-height:1.5;
  opacity:0;transform:translateY(10px) scale(.97);pointer-events:none;transition:opacity var(--t2) var(--ease),transform var(--t2) var(--ease);z-index:10;box-shadow:0 12px 30px rgba(0,0,0,.4)}
.toast.on{opacity:1;transform:none}.toast b{color:var(--peach)}
.empty{text-align:center;padding:50px 22px}
.empty>span{color:var(--rule);display:flex;justify-content:center;margin-bottom:14px}
.empty h3{font-size:16px;margin-bottom:6px}.empty p{font-size:12.5px;color:var(--muted)}

/* поля */
.fld{margin-top:18px}
.fld-l{font-size:9.5px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--muted-lt);margin-bottom:10px;display:flex;align-items:center;gap:9px}
.fld-l::after{content:'';flex:1;height:1px;background:var(--rule)}
.fld-l em{font-style:normal;color:var(--coral-deep);letter-spacing:0;text-transform:none;font-size:10px}
.fld-l i{font-style:normal;color:var(--muted-lt);letter-spacing:0;text-transform:none;font-size:10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.tel-in{display:flex;gap:9px}.tel-in input{flex:1}
.check{display:flex;align-items:flex-start;gap:12px;padding:12px 0;width:100%;text-align:left}
.check-b{width:22px;height:22px;border-radius:8px;border:1.5px solid var(--rule);background:var(--white);flex:0 0 auto;display:flex;align-items:center;justify-content:center;color:transparent;margin-top:1px;transition:all var(--t1) var(--ease)}
.check[aria-checked="true"] .check-b{background:var(--coral);border-color:var(--coral);color:#fff}
.check span{font-size:13.5px;line-height:1.5}.check small{display:block;font-size:11px;color:var(--muted)}
.sw{width:42px;height:24px;border-radius:999px;background:var(--rule);flex:0 0 auto;position:relative;transition:background var(--t2) var(--ease)}
.sw i{position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform var(--t2) var(--ease);box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw.on{background:var(--teal)}.sw.on i{transform:translateX(18px)}
.err{font-size:11px;color:var(--berry);margin-top:6px}
.pk-row{display:grid;grid-template-columns:1fr 1fr 84px 34px;gap:7px;margin-bottom:7px;align-items:center}
.pk-row input{padding:10px}
.x{width:34px;height:34px;border-radius:11px;border:1px solid var(--rule);color:var(--muted);display:flex;align-items:center;justify-content:center;position:relative}
.x::after{content:'';position:absolute;inset:-6px}
.x:hover{color:var(--berry);border-color:var(--berry)}
.add{width:100%;display:flex;align-items:center;justify-content:center;gap:7px;font-size:12.5px;font-weight:700;border:1px dashed var(--rule);color:var(--plum);padding:12px;border-radius:14px}
.add:hover{background:var(--lilac);border-style:solid}
.steps{display:flex;gap:5px;margin:14px 0 4px}
.steps i{flex:1;height:4px;border-radius:3px;background:var(--rule)}.steps i.on{background:var(--plum)}.steps i.done{background:var(--teal)}

/* лендинг */
.hero{margin:12px 18px 0;border-radius:22px;background:var(--plum);color:#fff;padding:26px 20px 22px;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;inset:0;background-image:var(--star-lg);background-size:84px 84px;opacity:.35;pointer-events:none}
.hero>*{position:relative}
.hero h1{color:#fff;font-size:26px;max-width:16ch}
.hero p{font-size:13.5px;color:rgba(255,255,255,.82);margin-top:12px;max-width:34ch}
.hero .btn{margin-top:20px;background:var(--coral-deep)}
.hero .cnt{margin-top:14px;font-size:11px;color:var(--peach);font-weight:600}
.how{display:flex;flex-direction:column;gap:0}
.how>div{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--rule)}
.how>div:last-child{border-bottom:0}
.how-n{width:28px;height:28px;border-radius:9px;background:var(--plum);color:var(--peach);font-size:12.5px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.how b{display:block;font-size:14px}.how p{font-size:12.5px;color:var(--muted);margin-top:3px}
.gets{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.gets>div{background:var(--white);border:1px solid var(--rule);border-radius:14px;padding:14px}
.gets>div span{color:var(--coral);display:block;margin-bottom:8px}
.gets b{font-size:13.5px;display:block}.gets p{font-size:11px;color:var(--muted);margin-top:3px}
.faq details{border-bottom:1px solid var(--rule)}
.faq summary{list-style:none;cursor:pointer;font-size:13.5px;font-weight:700;padding:14px 0;display:flex;justify-content:space-between;align-items:center;gap:12px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:'+';color:var(--muted-lt);font-weight:400;font-size:18px}
.faq details[open] summary::after{content:'–'}
.faq details p{font-size:12.5px;color:var(--muted);padding:0 0 14px}
.who{display:flex;flex-wrap:wrap;gap:7px}
.who span{font-size:12.5px;font-weight:600;border:1px solid var(--rule);padding:6px 12px;border-radius:999px}

/* заявки */
.rq{background:var(--white);border:1px solid var(--rule);border-radius:18px;padding:14px 16px;margin-bottom:12px;box-shadow:0 2px 10px rgba(44,27,71,.05)}
.rq.late{border-color:var(--berry);background:#FFFBFB}
.rq.closed{opacity:.72}
.rq-top{display:flex;align-items:flex-start;justify-content:space-between;gap:9px}
.rq-name{font-family:'Unbounded',sans-serif;font-size:15px;font-weight:600;color:var(--ink);letter-spacing:-.02em}
.rq-meta{font-size:12.5px;color:var(--muted);margin-top:4px}
.rq-svc{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:var(--plum);margin-top:9px}
.rq-facts{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.rq-facts span{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;color:var(--muted);
  background:var(--paper);border-radius:999px;padding:6px 11px}
.rq.late .rq-facts span{background:#FBEFED}
.rq-call{margin-top:12px;font-size:16px;letter-spacing:.01em;text-decoration:none;min-height:52px}
.rq-tg{margin-top:7px;text-decoration:none;min-height:44px}
.rq-ask{margin-top:14px;padding-top:12px;border-top:1px solid var(--rule)}
.rq-ask>b{display:block;font-size:12.5px;color:var(--muted);margin-bottom:9px}
.rq-two{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.rq-two .btn{width:100%}
.btn.ghost.dgr{border-color:var(--rule);color:var(--late)}
.btn.ghost.dgr:hover{background:#F6E3E1;border-color:var(--late)}
.rq-closed{margin-top:12px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.rq-com{font-size:13.5px;line-height:1.5;margin-top:10px;padding:10px 12px;background:var(--paper);border-radius:11px;border-left:2px solid var(--peach)}
/* счётчик 12 часов — это обязательство перед клиентом, а не украшение */
.tm{margin-top:12px}
.tm-t{display:flex;justify-content:space-between;font-size:11px;font-weight:700;margin-bottom:6px}
.tm-t b{color:var(--muted)}.tm-t i{font-style:normal;color:var(--muted-lt);font-weight:600}
.tm-bar{height:6px;border-radius:3px;background:var(--lilac);overflow:hidden}
.tm-bar i{display:block;height:100%;border-radius:3px;background:var(--teal);transition:width 620ms var(--ease)}
.tm.warn .tm-bar i{background:var(--coral)}.tm.warn .tm-t b{color:var(--coral-deep)}
.tm.late .tm-bar i{background:var(--berry);width:100%}.tm.late .tm-t b{color:var(--berry)}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:14px}
.stat3>div{background:var(--white);border:1px solid var(--rule);border-radius:14px;padding:12px 10px;text-align:center}
.stat3 b{font-family:'Unbounded',sans-serif;font-size:22px;font-weight:600;color:var(--plum);display:block;letter-spacing:-.03em}
.stat3 span{font-size:10px;font-weight:700;color:var(--muted-lt);text-transform:uppercase;letter-spacing:.12em}
.stat3>div.late b{color:var(--berry)}

/* календарь */
.dp{background:var(--white);border:1px solid var(--rule);border-radius:18px;padding:14px 12px 12px}
.dp-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;padding:0 2px}
.dp-mo{font-family:'Unbounded',sans-serif;font-size:19px;font-weight:600;color:var(--plum);letter-spacing:-.035em}
.dp-mo i{font-style:normal;color:var(--muted-lt);margin-left:7px}
.dp-nav{display:flex;gap:5px}
.dp-nav button{width:30px;height:30px;border-radius:8px;border:1px solid var(--rule);color:var(--plum);display:flex;align-items:center;justify-content:center;position:relative}
.dp-nav button::after{content:'';position:absolute;inset:-9px}
.dp-nav button:disabled{opacity:.35;cursor:not-allowed}
.dp-g{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.dp-g em{aspect-ratio:1/.62;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:9.5px;font-weight:700;color:var(--muted-lt);text-transform:uppercase;letter-spacing:.18em}
.dp-g em.we{color:var(--coral)}
.dp-g b{aspect-ratio:1/1.06;border-radius:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-weight:600;position:relative;overflow:hidden;cursor:pointer;transition:transform var(--t1) var(--ease),background var(--t1) var(--ease)}
.dp-g b.we{background:#FBF6F1}
.dp-g b u{text-decoration:none;font-size:13.5px;color:var(--ink);line-height:1}
.dp-g b s{text-decoration:none;font-size:10px;font-weight:600;color:var(--muted-lt);line-height:1}
.dp-g b:hover{background:var(--lilac)}
.dp-g b.busy{background:#FBEEF1}.dp-g b.busy u{color:#8C586B;text-decoration:line-through}
.dp-g b.past{opacity:.28;cursor:default;pointer-events:none}
.dp-g b.pad{visibility:hidden;pointer-events:none}
.dp-g b.rng{background:var(--plum)}.dp-g b.rng u{color:#fff}.dp-g b.rng s{color:var(--peach)}
.dp-g b.req::after{content:'';position:absolute;bottom:4px;width:5px;height:5px;border-radius:50%;background:var(--coral)}
.dp-g b.today{box-shadow:inset 0 0 0 1.5px var(--plum-mid)}
.dp-leg{display:flex;flex-wrap:wrap;gap:12px;margin-top:14px;padding-top:12px;border-top:1px solid var(--rule)}
.dp-leg span{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:600;color:var(--muted)}
.dot{width:9px;height:9px;border-radius:3px;flex:0 0 auto}
.dot.busy{background:#FBEEF1;border:1px solid #E7C3CD}.dot.rng{background:var(--plum)}.dot.req{width:5px;height:5px;border-radius:50%;background:var(--coral)}
.mode{display:flex;gap:7px;margin-bottom:12px}
.mode button{flex:1;font-size:12.5px;font-weight:700;padding:11px;border-radius:11px;border:1px solid var(--rule);background:var(--white);color:var(--muted)}
.mode button[aria-pressed="true"]{background:var(--lilac);border-color:var(--plum-mid);color:var(--plum)}
.rng-bar{margin-top:12px;background:var(--plum);border-radius:14px;padding:12px;display:flex;align-items:center;gap:9px;color:#fff;font-size:12.5px;font-weight:700}
.rng-bar span{flex:1}
.rng-bar .btn{width:auto;padding:9px 12px;font-size:11px;border-radius:9px}
.price2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.price2 label{font-size:11px;font-weight:700;color:var(--muted);display:block;margin-bottom:6px}

/* карточка */
.ph-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.ph-grid>div{aspect-ratio:1;border-radius:11px;background:var(--lilac) center/cover no-repeat;position:relative;overflow:hidden}
.ph-grid>div .x{position:absolute;right:5px;top:5px;width:26px;height:26px;background:rgba(255,255,255,.92);border:0;color:var(--plum)}
.ph-grid label{aspect-ratio:1;border-radius:11px;border:1px dashed var(--rule);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;color:var(--plum);font-size:11px;font-weight:700;cursor:pointer;text-align:center;padding:6px}
.ph-grid label:hover{background:var(--lilac)}
.ph-grid input{display:none}
.gate{display:flex;gap:9px;align-items:flex-start;padding:12px;border-radius:14px;font-size:12.5px;line-height:1.5}
.gate.no{background:var(--berry-soft);color:var(--berry)}.gate.ok{background:var(--teal-soft);color:#1F6E66}
.gate svg{flex:0 0 auto;margin-top:1px}
.saveBar{position:absolute;left:0;right:0;bottom:calc(76px + env(safe-area-inset-bottom));padding:10px 18px;z-index:6;pointer-events:none}
.saveBar .btn{pointer-events:auto;box-shadow:0 8px 26px rgba(27,16,48,.25)}
/* предпросмотр: карточка как в клиентском приложении */
.pv{padding:0 0 18px;border-bottom:1px solid var(--rule)}
.pv-ph{aspect-ratio:3/2;border-radius:18px;background:var(--lilac) center/cover;position:relative;display:flex;align-items:flex-end;padding:12px;gap:7px}
.pv-body{padding:12px 2px 0}
.pv-name{font-family:'Unbounded',sans-serif;font-size:15px;font-weight:600;letter-spacing:-.02em}
.pv-meta{font-size:12.5px;color:var(--muted);margin-top:3px}
.pv-foot{display:flex;align-items:flex-end;justify-content:space-between;margin-top:13px}
.pv-price{font-family:'Unbounded',sans-serif;font-size:22px;font-weight:600;color:var(--plum);letter-spacing:-.03em}

/* отзывы */
.rv{padding:14px 0;border-bottom:1px solid var(--rule)}
.rv-h{display:flex;justify-content:space-between;align-items:center}
.rv-h b{font-size:12.5px}.rv-h i{font-style:normal;font-size:11px;color:var(--muted-lt)}
.rv-s{color:var(--coral-deep);font-size:11px;letter-spacing:1px;margin-top:3px}
.rv p{font-size:12.5px;color:var(--muted);margin-top:5px}
.rv-rep{margin-top:10px;padding:10px 12px;background:var(--lilac);border-radius:11px;font-size:12.5px;line-height:1.5}
.rv-rep b{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--plum);display:block;margin-bottom:3px}
.rv-form{margin-top:10px;display:flex;flex-direction:column;gap:7px}
.rv-form .btn{align-self:flex-end}

/* статистика */
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.kpi>div{background:var(--white);border:1px solid var(--rule);border-radius:14px;padding:14px}
.kpi b{font-family:'Unbounded',sans-serif;font-size:23px;font-weight:600;color:var(--plum);display:block;letter-spacing:-.035em;line-height:1}
.kpi span{font-size:11px;color:var(--muted);display:block;margin-top:6px}
.kpi i{font-style:normal;font-size:11px;font-weight:700;color:var(--teal);margin-left:5px}
.kpi i.dn{color:var(--berry)}
.chart{display:flex;align-items:flex-end;gap:5px;height:120px;padding-top:10px}
.chart>div{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;height:100%;justify-content:flex-end}
.chart i{width:100%;background:var(--lilac);border-radius:4px 4px 0 0;position:relative;min-height:3px}
.chart i::after{content:'';position:absolute;left:0;right:0;bottom:0;height:var(--r);background:var(--coral);border-radius:4px 4px 0 0}
.chart s{text-decoration:none;font-size:9.5px;color:var(--muted-lt);font-weight:700}
.chart-leg{display:flex;gap:14px;margin-top:10px;font-size:10px;font-weight:600;color:var(--muted)}
.chart-leg span{display:inline-flex;align-items:center;gap:5px}
.lock{position:relative;overflow:hidden;border-radius:18px}
.lock::after{content:'';position:absolute;inset:0;background:linear-gradient(to bottom,rgba(250,247,244,.3),var(--paper) 70%);pointer-events:none}
.lock-cta{margin-top:-60px;position:relative;z-index:1;text-align:center}
.lock-cta p{font-size:12.5px;color:var(--muted);margin-bottom:12px}

/* тариф */
.plan{background:var(--white);border:1px solid var(--rule);border-radius:18px;padding:16px;margin-bottom:9px;position:relative}
.plan.cur{border-color:var(--plum);box-shadow:0 0 0 3px var(--lilac)}
.plan-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.plan-h b{font-family:'Unbounded',sans-serif;font-size:16px;font-weight:600;color:var(--plum)}
.plan-p{font-family:'Unbounded',sans-serif;font-size:19px;font-weight:600;color:var(--plum);letter-spacing:-.03em}
.plan-p i{font-style:normal;font-size:11px;font-weight:600;color:var(--muted-lt);font-family:'Manrope',sans-serif;letter-spacing:0}
.plan ul{list-style:none;margin-top:10px}
.plan li{font-size:12.5px;padding:5px 0 5px 18px;position:relative;color:var(--ink)}
.plan li::before{content:'';position:absolute;left:2px;top:12px;width:4px;height:4px;border-radius:50%;background:var(--teal)}
.plan .btn{margin-top:12px}
.freeTag{display:inline-block;background:var(--teal-soft);color:#1F6E66;font-size:9.5px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;padding:5px 10px;border-radius:999px;margin-bottom:10px}
.bill{display:flex;justify-content:space-between;gap:9px;padding:11px 0;border-bottom:1px solid var(--rule);font-size:12.5px}
.bill:last-child{border-bottom:0}
.bill b{font-family:'Unbounded',sans-serif;font-weight:600;color:var(--plum);white-space:nowrap}
.bill span{color:var(--muted)}
.tbl-wrap{overflow-x:auto;overflow-y:hidden;border:1px solid var(--rule);border-radius:14px;background:var(--white)}
.tbl{border-collapse:collapse;width:100%;min-width:420px;font-size:12.5px}
.tbl th,.tbl td{padding:9px 12px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--rule)}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl thead th{font-size:9.5px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--muted-lt)}
.tbl tbody tr:nth-child(2n){background:var(--paper)}
.tbl tfoot td{font-weight:800;color:var(--plum);border-bottom:0;border-top:1px solid var(--rule)}
.adslot{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--rule);border-radius:14px;margin-bottom:9px;background:var(--white)}
.adslot-b{flex:1;min-width:0}.adslot-b b{display:block;font-size:13.5px}.adslot-b span{display:block;font-size:11px;color:var(--muted);margin-top:2px}

/* проверка */
.pending{text-align:center;padding:40px 24px}
.pending>span{color:var(--teal);display:flex;justify-content:center;margin-bottom:14px}
.pending h2{margin-bottom:8px}.pending p{font-size:12.5px;color:var(--muted);max-width:32ch;margin:0 auto}
.pending ol{text-align:left;margin:22px auto 0;max-width:300px;list-style:none}
.pending li{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--rule);font-size:13.5px}
.pending li i{width:24px;height:24px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;font-style:normal;font-size:11px;font-weight:800;background:var(--lilac);color:var(--muted)}
.pending li.done i{background:var(--teal-soft);color:var(--teal)}

/* навигация */
.nav{position:absolute;left:14px;right:14px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:7;
  background:rgba(250,247,244,.92);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border:1px solid var(--rule);border-radius:22px;display:flex;align-items:flex-end;padding:6px 5px 10px;
  box-shadow:0 8px 26px rgba(27,16,48,.15),0 2px 5px rgba(27,16,48,.05)}
.nav button{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:5px;height:44px;justify-content:flex-end;color:var(--muted-lt);position:relative;transition:color var(--t1) var(--ease)}
.nav .ico{position:relative;width:32px;height:32px;border-radius:11px;display:flex;align-items:center;justify-content:center;transition:background var(--t2) var(--ease),color var(--t2) var(--ease)}
.nav .lbl{font-size:9.5px;font-weight:700;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;text-align:center}
.nav .ico{width:30px;height:30px}
/* шесть подписей в ряд не помещаются на узких экранах — оставляем иконки */
@media (max-width:359px){.nav .lbl{display:none}.nav button{height:38px}}
.nav button[aria-pressed="true"]{color:var(--coral)}
.nav button[aria-pressed="true"] .ico{background:var(--coral);color:#fff}
.nav .dot{position:absolute;top:-4px;right:-7px;min-width:15px;height:15px;background:var(--coral-deep);color:#fff;border-radius:999px;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 4px;border:1.5px solid var(--paper)}
.nav .dot.late{background:var(--berry)}


/* шторка и диалог */
.scrim{position:absolute;inset:0;background:rgba(20,11,36,.55);backdrop-filter:blur(2px);opacity:0;pointer-events:none;transition:opacity var(--t3) var(--ease);z-index:8}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--paper);z-index:9;border-radius:22px 22px 0 0;padding:8px 18px calc(20px + env(safe-area-inset-bottom));
  transform:translateY(102%);transition:transform var(--t3) var(--ease);max-height:92%;overflow-y:auto;overflow-x:hidden}
.sheet.on{transform:none}
.sheet::-webkit-scrollbar{width:0}
.grab{width:38px;height:4px;border-radius:999px;background:var(--rule);margin:0 auto 14px}
.sheet h3{margin-bottom:6px}
.sheet .row{padding:12px 0}
.sheet .btn{margin-top:14px}

/* заставка занятости на весь экран, пока карточка не сохранена */
@keyframes riseIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.view{animation:riseIn var(--t3) var(--ease) both}
.rq{animation:riseIn var(--t2) var(--ease) both}
.rq:nth-child(2){animation-delay:35ms}.rq:nth-child(3){animation-delay:70ms}.rq:nth-child(n+4){animation-delay:105ms}
button:active{transition-duration:60ms}
.row:active,.pill:active,.link:active{opacity:.55}

@media (min-width:521px) and (max-width:899px){
  body{background:#F2EEF6}
  .shell{border-left:1px solid var(--rule);border-right:1px solid var(--rule);box-shadow:0 0 60px rgba(44,27,71,.1)}
}
/* десктоп: та же разметка, навигация слева, поля шире */
@media (min-width:900px){
  .shell{max-width:none;display:grid;grid-template-columns:236px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);grid-template-areas:"head head" "rail body"}
  .bar{grid-area:head;padding:18px 28px 16px}
  .wordmark{font-size:19px}
  .scroll{grid-area:body;padding:0 0 40px}
  .block,.hero{max-width:820px;margin-left:auto;margin-right:auto;padding-left:32px;padding-right:32px}
  .hero{margin-top:22px;padding:40px 44px 36px}
  .hero h1{font-size:34px}
  .gets{grid-template-columns:repeat(3,1fr)}
  .nav{grid-area:rail;position:static;flex-direction:column;align-items:stretch;justify-content:flex-start;gap:5px;background:none;backdrop-filter:none;border:0;border-right:1px solid var(--rule);border-radius:0;padding:18px 14px;box-shadow:none}
  .nav button{flex:0 0 auto;height:46px;flex-direction:row;justify-content:flex-start;gap:12px;padding:0 12px;border-radius:14px}
  .nav button:hover{background:var(--lilac)}
  .nav button[aria-pressed="true"]{background:var(--lilac)}
  .nav .lbl{font-size:13.5px}
  .nav .dot{top:-2px;right:-4px}
  .gear{display:none}
  .nav .out{margin-top:auto;color:var(--muted)}
  .saveBar{left:236px;bottom:24px;padding:0 32px}
  .saveBar .btn{max-width:756px;margin:0 auto;display:flex}
  .scrim{left:236px;top:71px}
  .sheet{left:236px;right:0;max-width:520px;margin:0 auto;border-radius:22px;bottom:24px;max-height:calc(100dvh - 120px)}
  .toast{left:auto;right:32px;bottom:32px;max-width:420px}
  .two.desk3{grid-template-columns:1fr 1fr 1fr}
  .rq-acts{max-width:420px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:1ms!important;animation-duration:1ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}
}

/* ===== дополнения под ТЗ: §8.2 смысловые цвета, §6 премиум, §5.1–5.2 публичные экраны ===== */
:root{--done:#2F6B4F;--warn:#B7791F;--warn-ink:#8C5A10;--late:#7A1E1A;--gold:#7C5E28;--gold-soft:#F6EFE0}
/* §X.4 — запасная высота для браузеров без dvh */
.shell{height:100vh;height:100dvh}
.chip.done{background:#E4EFE8;color:var(--done)}
.chip.warnS{background:#FAF0DC;color:var(--warn-ink)}
.chip.lateS{background:#F6E3E1;color:var(--late)}
.chip.gold{background:var(--gold-soft);color:var(--gold)}
.tm.warn .tm-bar i{background:var(--warn)}.tm.warn .tm-t b{color:var(--warn-ink)}
.tm.late .tm-bar i{background:var(--late)}.tm.late .tm-t b{color:var(--late)}
.rq.late{border-color:var(--late);background:#FFFBFA}
.gate.no{background:#F6E3E1;color:var(--late)}
.gate.ok{background:#E4EFE8;color:var(--done)}
.gate.mod{background:#FAF0DC;color:var(--warn-ink)}
.stat3>div.late b{color:var(--late)}
.kpi i{color:var(--done)}.kpi i.dn{color:var(--late)}

/* премиум-статус: золото, не коралл — его нельзя спутать с тарифом */
.lux-h{background:var(--plum);color:#fff;border-radius:18px;padding:18px;position:relative;overflow:hidden}
.lux-h::before{content:'';position:absolute;inset:0;background-image:var(--star);background-size:52px 52px;opacity:.3}
.lux-h>*{position:relative}
.lux-h h3{color:#fff;font-size:17px}
.lux-h p{font-size:12.5px;color:rgba(255,255,255,.8);margin-top:6px}
.lux-h .chip{margin-bottom:10px}
.std{margin-top:12px}
.std-row{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--rule);width:100%;text-align:left}
.std-row:last-child{border-bottom:0}
.std-row i{flex:0 0 auto;margin-top:1px;display:flex}
.std-row b{display:block;font-size:13.5px;font-weight:700}
.std-row span{display:block;font-size:11px;color:var(--muted);margin-top:2px;line-height:1.5}
.meter{margin-top:9px}
.meter-t{display:flex;justify-content:space-between;font-size:11px;font-weight:700;margin-bottom:5px}
.meter-b{height:6px;border-radius:3px;background:var(--lilac);overflow:hidden}
.meter-b i{display:block;height:100%;border-radius:3px;background:var(--done)}
.meter.warn .meter-b i{background:var(--warn)}.meter.warn .meter-t b{color:var(--warn-ink)}
.meter.bad .meter-b i{background:var(--late)}.meter.bad .meter-t b{color:var(--late)}
.steps-v{list-style:none;margin-top:12px}
.steps-v li{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--rule);font-size:13.5px}
.steps-v li:last-child{border-bottom:0}
.steps-v li i{flex:0 0 auto;display:flex;margin-top:1px}
.steps-v li span{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.steps-v li.off{color:var(--muted-lt)}
.sep{font-size:12.5px;line-height:1.5;padding:12px;border-radius:14px;background:var(--lilac);color:var(--plum);margin-top:12px}
.sep b{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:4px}

/* реклама: всегда с пометкой */
.tbl-wrap{overflow-x:auto;overflow-y:hidden;border:1px solid var(--rule);border-radius:14px;background:var(--white)}
.tbl{border-collapse:collapse;width:100%;min-width:420px;font-size:12.5px}
.tbl th,.tbl td{padding:9px 12px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--rule)}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl thead th{font-size:9.5px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--muted-lt)}
.tbl tbody tr:nth-child(2n){background:var(--paper)}
.tbl tfoot td{font-weight:800;color:var(--plum);border-bottom:0;border-top:1px solid var(--rule)}
.adslot{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--rule);border-radius:14px;margin-bottom:9px;background:var(--white);flex-wrap:wrap}
.adslot-b{flex:1;min-width:140px}.adslot-b b{display:block;font-size:13.5px}.adslot-b span{display:block;font-size:11px;color:var(--muted);margin-top:2px}

/* публичные экраны */
.hero{margin:12px 18px 0;border-radius:22px;background:var(--plum);color:#fff;padding:26px 20px 22px;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;inset:0;background-image:var(--star-lg);background-size:84px 84px;opacity:.35;pointer-events:none}
.hero>*{position:relative}
.hero h1{color:#fff;font-size:26px;max-width:16ch}
.hero p{font-size:13.5px;color:rgba(255,255,255,.82);margin-top:12px;max-width:34ch}
.hero .btn{margin-top:20px}
.hero .cnt{margin-top:14px;font-size:11px;color:var(--peach);font-weight:600}
.how>div{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--rule)}
.how>div:last-child{border-bottom:0}
.how-n{width:28px;height:28px;border-radius:9px;background:var(--plum);color:var(--peach);font-size:12.5px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.how b{display:block;font-size:14px}.how p{font-size:12.5px;color:var(--muted);margin-top:3px}
.gets{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.gets>div{background:var(--white);border:1px solid var(--rule);border-radius:14px;padding:14px}
.gets>div span{color:var(--coral-deep);display:block;margin-bottom:8px}
.gets b{font-size:13.5px;display:block}.gets p{font-size:11px;color:var(--muted);margin-top:3px}
.faq details{border-bottom:1px solid var(--rule)}
.faq summary{list-style:none;cursor:pointer;font-size:13.5px;font-weight:700;padding:14px 0;display:flex;justify-content:space-between;align-items:center;gap:12px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:'+';color:var(--muted-lt);font-weight:400;font-size:18px}
.faq details[open] summary::after{content:'–'}
.faq details p{font-size:12.5px;color:var(--muted);padding:0 0 14px}
.who{display:flex;flex-wrap:wrap;gap:7px}
.who span{font-size:12.5px;font-weight:600;border:1px solid var(--rule);padding:6px 12px;border-radius:999px}
.steps{display:flex;gap:5px;margin:14px 0 4px}
.steps i{flex:1;height:4px;border-radius:3px;background:var(--rule)}
.steps i.on{background:var(--plum)}.steps i.done{background:var(--done)}
.tel-in{display:flex;gap:9px}.tel-in input{flex:1}
.check{display:flex;align-items:flex-start;gap:12px;padding:12px 0;width:100%;text-align:left}
.check-b{width:22px;height:22px;border-radius:8px;border:1.5px solid var(--rule);background:var(--white);flex:0 0 auto;display:flex;align-items:center;justify-content:center;color:transparent;margin-top:1px;transition:background var(--t1) var(--ease),border-color var(--t1) var(--ease),color var(--t1) var(--ease)}
.check[aria-checked="true"] .check-b{background:var(--coral-deep);border-color:var(--coral-deep);color:#fff}
.check span{font-size:13.5px;line-height:1.5}.check small{display:block;font-size:11px;color:var(--muted)}
.pending{text-align:center;padding:40px 24px}
.pending>span{color:var(--warn);display:flex;justify-content:center;margin-bottom:14px}

    :r.st==='ans'?['','' +T_.i_st_ans2]:r.st==='deal'?['done',T_.i_st_deal]:['lateS',T_.i_st_dec];
  /* один счётчик вместо двух: срок и сколько осталось в одной строке */
  const timer=r.st==='new'?`<div class="tm${tm.late?' late':tm.warn?' warn':''}">
      <div class="tm-t"><b>${tm.late?T_.i_lateBy+' '+hm(tm.left):T_.i_left+' '+hm(tm.left)}</b>
        <i>${tm.late?T_.i_lateAt(clock(due)):T_.i_untilAt(clock(due))}</i></div>
      <div class="tm-bar"><i style="width:${Math.max(0,Math.min(100,tm.left/HOURS*100))}%"></i></div></div>`:'';
  return `<article class="rq${tm.late?' late':''}${active?'':' closed'}" data-rq="${r.id}">
    <div class="rq-top"><div><div class="rq-name">${esc(r.name)}</div>
      <div class="rq-meta">${occName} · ${dateStr(r.date)}, ${WD[lang][(r.date.getDay()+6)%7]}</div></div>
      <span class="chip ${chip[0]}">${chip[1]}</span></div>
    <div class="rq-facts">
      <span>${ico('user',13)}${T_.i_guests(r.g)}</span>
      <span>${ico('wallet',13)}${BUDGETS[lang][r.bud]}</span>

    ${r.com?`<div class="rq-com">${esc(r.com)}</div>`:''}
    ${timer}
    ${active?`<a class="btn rq-call" href="tel:${r.tel.replace(/\s/g,'')}" data-contact="${r.id}">${ico('phone',18)}${esc(r.tel)}</a>
      <a class="btn lite rq-tg" href="https://t.me/${r.tel.replace(/\D/g,'')}" target="_blank" rel="noopener" data-contact="${r.id}">${ico('tg',16)}${T_.i_tg}</a>
      ${r.st==='ans'
        ?`<div class="rq-ask"><b>${T_.i_what}</b>
           <div class="rq-two"><button class="btn sm ghost" data-close="deal-${r.id}">${ico('checkFill',15)}${T_.i_dealBtn}</button>
             <button class="btn sm ghost dgr" data-dec="${r.id}">${T_.i_noBtn}</button></div></div>`
        :`<p class="note" style="margin-top:10px">${T_.i_callFirst}</p>`}`
    :`<div class="rq-closed">${r.st==='dec'?T_['i_dec'+(r.reason+1)]:esc(r.tel)}
        <button class="link" data-reopen="${r.id}">${T_.i_reopen}</button></div>`}
  </article>`;
}
function renderInbox(){const T_=t();

/* ---------- §5.4 календарь ---------- */
const MIN_M=new Date(NOW.getFullYear(),NOW.getMonth(),1),MAX_M=new Date(NOW.getFullYear()+2,NOW.getMonth(),1);
function renderCal(){const T_=t(),m=card();if(!m)return renderNoCards();
  const y=calMonth.getFullYear(),mo=calMonth.getMonth(),last=new Date(y,mo+1,0).getDate(),lead=(new Date(y,mo,1).getDay()+6)%7;
  const reqDays=new Set(REQS.filter(r=>r.st!=='dec'&&r.card===m.id).map(r=>dkey(r.date)));
  let g=WD[lang].map((w,i)=>`<em class="${i>4?'we':''}">${w}</em>`).join('');
  for(let i=0;i<lead;i++)g+='<b class="pad"></b>';
  let nb=0,nr=0;
  for(let d=1;d<=last;d++){const dt=new Date(y,mo,d),k=dkey(dt),we=dt.getDay()===0||dt.getDay()===6,
    past=dt<NOW&&k!==dkey(NOW),busy=m.busy.has(k),hasReq=reqDays.has(k);
    if(busy)nb++;if(hasReq)nr++;
    const inRng=rngStart&&dkey(rngStart)===k,price=busy?'':(m.c==='hall'?dayPrice(m,dt):'');
    g+=`<b class="${past?'past':''}${busy?' busy':''}${we?' we':''}${inRng?' rng':''}${hasReq?' req':''}${k===dkey(NOW)?' today':''}" data-day="${k}" tabindex="0" role="button" aria-pressed="${busy}"><u>${d}</u>${price?`<s>${price}</s>`:''}</b>`}
  return `<div class="view block"><h2>${T_.c_title}</h2><p class="sub">${T_.c_note}</p>
    <div style="height:14px"></div>${cardPills()}
    <div class="mode"><button data-mode="tap" aria-pressed="${calMode==='tap'}">${T_.c_tap}</button><button data-mode="range" aria-pressed="${calMode==='range'}">${T_.c_range}</button></div>
    <div class="dp"><div class="dp-h"><span class="dp-mo">${MON_N[lang][mo]}<i>${y}</i></span>
      <div class="dp-nav"><button data-mo="-1" aria-label="←" ${calMonth>MIN_M?'':'disabled'}>${ico('prev',14)}</button><button data-mo="1" aria-label="→" ${calMonth<MAX_M?'':'disabled'}>${ico('next',14)}</button></div></div>
      <div class="dp-g">${g}</div>
      <div class="dp-leg"><span><i class="dot busy"></i>${T_.c_busy}</span><span><i class="dot req"></i>${T_.c_req}</span><span style="margin-left:auto">${T_.c_sum(nb,nr)}</span></div>
      ${calMode==='range'?`<div class="rng-bar">${ico('sparkle',16)}<span>${rngStart?dateStr(rngStart)+' → '+T_.c_rngEnd:T_.c_rngHint}</span>${rngStart?`<button class="btn lite" data-act="rngcancel">${T_.c_cancel}</button>`:''}</div>`:''}
    </div>
    ${m.c==='hall'?`<div class="fld"><div class="fld-l">${T_.c_prices}</div>
      <div class="price2"><div><label>${T_.r_wd}, ${T_.k_mln}</label><input data-pkf="0-2" type="number" inputmode="decimal" value="${esc(m.pk[0]?m.pk[0][2]:'')}"></div>
      <div><label>${T_.r_we}, ${T_.k_mln}</label><input data-pkf="1-2" type="number" inputmode="decimal" value="${esc(m.pk[1]?m.pk[1][2]:'')}"></div></div>
      <p class="note" style="margin-top:9px">${T_.c_priceNote}</p></div>`:''}
    <p class="note" style="margin-top:12px">${T_.c_tz}</p></div>`;
}
function applyRange(set,a,b,busy){const [s,e]=a<b?[a,b]:[b,a];
  for(let d=new Date(s);d<=e;d.setDate(d.getDate()+1)){busy?set.add(dkey(d)):set.delete(dkey(d))}}

/* ---------- §5.7 статистика ---------- */
function renderStats(){const T_=t(),m=card();if(!m)return renderNoCards();
  const sum=k=>m.days.reduce((a,d)=>a+d[k],0),views=sum('views'),opens=sum('opens'),reqs=sum('reqs');
  const avg=avgResp(m.id),late=REQS.filter(r=>r.card===m.id&&timing(r).late).length;
  const mx=Math.max(1,...m.days.map(d=>d.views)),mr=Math.max(1,...m.days.map(d=>d.reqs));
  const over=statTab==='over';
  return `<div class="view block"><h2>${T_.s_title}</h2><p class="sub">${over?T_.s_period:T_['s_p'+statDays]}</p>
    <div style="height:14px"></div>${cardPills()}

      <button class="pill" data-stab="over" aria-pressed="${over}">${T_.s_tabOver}</button>
      <button class="pill" data-stab="rep" aria-pressed="${!over}">${T_.s_tabRep}</button>

      <div style="grid-column:1/-1"><b>${(reqs/views*100).toFixed(1)}%</b><span>${T_.s_conv}</span></div></div>
    <div class="card" style="margin-top:12px"><div class="eyebrow">${T_.s_chart}</div>
      <div class="chart">${m.days.map((d,i)=>{const dt=new Date(NOW);dt.setDate(dt.getDate()-13+i);
        return `<div><i style="height:${d.views/mx*100}%;--r:${Math.round(d.reqs/mr*100)}%"></i><s>${dt.getDate()}</s></div>`}).join('')}</div>
      <div class="chart-leg"><span><i class="dot" style="background:var(--lilac)"></i>${T_.s_lViews}</span><span><i class="dot" style="background:var(--coral)"></i>${T_.s_lReqs}</span></div></div>`:''}
    ${views?'':`<div class="empty"><span>${ico('chart',36)}</span><p>${T_.s_none}</p></div>`}</div>`;

/* ---------- отчёт: те же данные, сведённые по дням и по исходам ---------- */
function repRows(m){const out=[];
  for(let i=14-statDays;i<14;i++){const dt=new Date(NOW);dt.setDate(dt.getDate()-13+i);
    out.push({dt,...m.days[i]})}
  return out}
function renderReport(m){const T_=t(),rows=repRows(m);
  const sum=k=>rows.reduce((a,r)=>a+r[k],0),v=sum('views'),o=sum('opens'),q=sum('reqs');
  const from=rows[0].dt,to=rows[rows.length-1].dt;
  /* заявки за период — по времени поступления */
  const since=new Date(NOW);since.setDate(since.getDate()-statDays);
  const mine=REQS.filter(r=>r.card===m.id&&r.at>=since);
  const byState=[['new','i_st_new'],['ans','i_st_ans'],['deal','i_st_deal'],['dec','i_st_dec']]
    .map(([k,l])=>[T_[l],mine.filter(r=>r.st===k).length]);
  const answered=mine.filter(r=>r.ansAt!=null);
  const buckets=[['s_r1',answered.filter(r=>r.ansAt<3).length],['s_r2',answered.filter(r=>r.ansAt>=3&&r.ansAt<6).length],
    ['s_r3',answered.filter(r=>r.ansAt>=6&&r.ansAt<12).length],['s_r4',mine.filter(r=>timing(r).late||r.ansAt>=12).length]];
  const maxB=Math.max(1,...buckets.map(b=>b[1]));
  return `<div class="fld"><div class="fld-l">${T_.s_repH}<i>${dateStr(from)} — ${dateFull(to)}</i></div>
    <p class="note" style="margin-bottom:10px">${T_.s_repS}</p>
    <div class="tbl-wrap"><table class="tbl"><thead><tr>
      <th>${T_.s_tDay}</th><th>${T_.s_tViews}</th><th>${T_.s_tOpens}</th><th>${T_.s_tReqs}</th><th>${T_.s_tConv}</th></tr></thead>
      <tbody>${rows.map(r=>`<tr><td>${dateStr(r.dt)}, ${WD[lang][(r.dt.getDay()+6)%7]}</td><td>${r.views}</td><td>${r.opens}</td><td>${r.reqs}</td>
        <td>${r.views?(r.reqs/r.views*100).toFixed(1)+'%':'—'}</td></tr>`).join('')}</tbody>
      <tfoot><tr><td>${T_.s_tTotal}</td><td>${money(v)}</td><td>${money(o)}</td><td>${q}</td><td>${v?(q/v*100).toFixed(1)+'%':'—'}</td></tr></tfoot>
    </table></div></div>
  <div class="fld"><div class="fld-l">${T_.s_reqH}<i>${mine.length}</i></div>
    ${mine.length?byState.map(([l,c])=>`<div class="bill"><span>${l}</span><b>${c}</b></div>`).join('')
      :`<p class="note">${T_.s_reqNone}</p>`}</div>
  <div class="fld"><div class="fld-l">${T_.s_respH}</div>
    ${buckets.map(([k,c],i)=>`<div class="meter ${i===3&&c?'bad':i===2&&c?'warn':''}" style="margin-top:9px">
      <div class="meter-t"><b>${T_[k]}</b><i style="font-style:normal;color:var(--muted-lt)">${c}</i></div>
      <div class="meter-b"><i style="width:${c/maxB*100}%"></i></div></div>`).join('')}
    <p class="note" style="margin-top:10px">${T_.s_respLux}</p></div>
  <div class="fld"><button class="btn ghost" data-act="csv">${ico('db',16)}${T_.s_csv}</button>
    <p class="note" style="margin-top:9px">${T_.s_csvNote}</p></div>`;
}
/* выгрузка только сумм по дням: клиентских данных в файле нет (§9.4) */
function csvText(m){const rows=repRows(m),T_=t();
  const head=[T_.s_tDay,T_.s_tViews,T_.s_tOpens,T_.s_tReqs].join(';');
  const body=rows.map(r=>[r.dt.getFullYear()+'-'+String(r.dt.getMonth()+1).padStart(2,'0')+'-'+String(r.dt.getDate()).padStart(2,'0'),
    r.views,r.opens,r.reqs].join(';'));
  return [head,...body].join('\n')}

/* ---------- проверки форм ---------- */
const telOk=s=>/^\+998[\s\d]{9,14}$/.test(String(s).trim());
function validateReg(step){const T_=t(),m=reg;errs={};
  if(step===1){if(!m.n.trim())errs.n=T_.e_req;if(!telOk(m.tel))errs.tel=T_.e_tel;
    if(!m.codeSent||!/^\d{4}$/.test(m.code))errs.code=T_.e_code;if(!m.person.trim())errs.person=T_.e_req}
  if(step===2){if(!m.ru.trim()&&!m.uz.trim())errs.ru=T_.e_req;
    if(!(Number(m.price)>0))errs.price=T_.e_price;
    const filled=m.pk.filter(p=>p[0].trim()&&Number(p[2])>0).length;
    if(!filled)errs.pk=T_.e_pk;else if(m.c==='hall'&&filled<2)errs.pk=T_.e_pkHall}
  if(step===3){if(m.photos.length<3)errs.photos=T_.e_photos(3-m.photos.length);
    if(!m.stir.trim())errs.stir=T_.e_req;if(!m.addr.trim())errs.addr=T_.e_req;
    if(!m.consent)errs.consent=T_.e_consent}
  return !Object.keys(errs).length;
}
function validateCard(m){const T_=t();errs={};
  if(!m.n.trim())errs.n=T_.e_req;
  if(!m.ru.trim()&&!m.uz.trim())errs.ru=T_.e_req;
  if(!(Number(m.price)>0))errs.price=T_.e_price;
  if(m.c==='hall'&&m.pk.filter(p=>p[0].trim()&&Number(p[2])>0).length<2)errs.pk=T_.e_pkHall;
  return !Object.keys(errs).length;
}
/* §5.5 — цена, фото и описание уходят на модерацию, остальное применяется сразу */
let cardSnapshot=null;
const snap=m=>JSON.stringify({price:m.price,photos:m.photos.length,ru:m.ru,uz:m.uz,pk:m.pk});
function modFields(m){if(!cardSnapshot)return [];const was=JSON.parse(cardSnapshot),out=[];
  if(String(was.price)!==String(m.price)||JSON.stringify(was.pk)!==JSON.stringify(m.pk))out.push('price');
  if(was.photos!==m.photos.length)out.push('photos');
  if(was.ru!==m.ru||was.uz!==m.uz)out.push('desc');
  return out;
}

/* ---------- события. §X.1: атрибуты data-* не пересекаются ---------- */
document.addEventListener('input',e=>{const el=e.target,m=model();
  if(el.dataset.ak2!==undefined){auth[el.dataset.ak2]=el.value;return}
  if(el.dataset.ref!==undefined){luxDraft.refs[+el.dataset.ref]=el.value;return}
  if(el.dataset.mk!==undefined){
    const host=(route==='cab'&&tab==='co')?ACC:m;
    host[el.dataset.mk]=el.type==='number'?(el.value===''?'':Number(el.value)):el.value;return}
  if(el.dataset.pkf!==undefined){const [i,f]=el.dataset.pkf.split('-').map(Number);
    while(m.pk.length<=i)m.pk.push(['','','']);
    m.pk[i][f]=f===2?(el.value===''?'':Number(el.value)):el.value;
    if(f===2&&i===0&&m.c==='hall')m.price=Number(el.value)||m.price;return}
});
document.addEventListener('change',e=>{const el=e.target;
  if(el.dataset.act==='addph'){const m=model(),files=[...el.files].slice(0,10-m.photos.length);
    if([...el.files].length>files.length)toast(t().k_photoLimit);
    let n=files.length;if(!n)return;
    files.forEach(f=>{const r=new FileReader();r.onload=()=>{m.photos.push(r.result);if(!--n)render()};r.readAsDataURL(f)});return}
  if(el.tagName==='SELECT'&&el.dataset.mk){const host=(route==='cab'&&tab==='co')?ACC:model();
    host[el.dataset.mk]=el.dataset.mk==='dist'?+el.value:el.value;
    if(el.dataset.mk==='c'){host.feats=[]}
    render()}
});
document.addEventListener('click',e=>{const T_=t(),q=s=>e.target.closest(s),m=model();
  if(q('.lang')){lang=lang==='ru'?'uz':'ru';render();return}
  if(q('#gear')){goCab('co');return}
  if(q('#scrim')){closeSheet();return}

  const go=q('[data-go]');
  if(go){const k=go.dataset.go;
    if(k==='reg'){reg=blank();regStep=1;errs={};route='reg'}
    else if(k==='regback'){regStep--;errs={}}
    else if(k==='land'){route='land'}
    else if(k==='login'){auth={tel:'',code:'',sent:false};errs={};route='login'}
    else if(k==='cab'){goCab('card');return}
    render();$('#scroll').scrollTop=0;return}

  const act=q('[data-act]');
  if(act){const a=act.dataset.act;
    if(a==='authcode'){if(!telOk(auth.tel)){errs={tel:T_.e_tel};render();return}
      auth.sent=true;errs={};render();toast(T_.r_sent+': <b>'+esc(auth.tel)+'</b>');return}
    if(a==='authgo'){errs={};
      if(!telOk(auth.tel))errs.tel=T_.e_tel;
      else if(!auth.sent||!/^\d{4}$/.test(auth.code))errs.code=T_.e_code;
      if(Object.keys(errs).length){render();return}
      goCab('inbox');return}
    if(a==='regcode'){if(!telOk(reg.tel)){errs={tel:T_.e_tel};render();return}
      reg.codeSent=true;errs={};render();toast(T_.r_sent+': <b>'+esc(reg.tel)+'</b>');return}
    if(a==='regnext'){if(!validateReg(regStep)){render();return}
      if(regStep<3){regStep++;render();$('#scroll').scrollTop=0}
      else{route='pending';render();toast(T_.p_sent)}return}
    if(a==='addpk'){if(m.pk.length<4)m.pk.push(['','','']);render();return}
    if(a==='edit'){editing=true;cardSnapshot=snap(m);render();$('#scroll').scrollTop=0;return}
    if(a==='save'){if(!validateCard(m)){render();return}
      const f=modFields(m);editing=false;errs={};
      if(f.length){m.mod=f;render();toast(T_.k_modSent)}
      else{render();toast(canPublish(m)?T_.k_saved:T_.k_savedDraft)}
      cardSnapshot=null;$('#scroll').scrollTop=0;return}
    if(a==='backlist'){openCard=null;editing=false;errs={};render();$('#scroll').scrollTop=0;return}
    if(a==='newcard'){newCat=freeCats()[0]?freeCats()[0][0]:null;newCardSheet();return}
    if(a==='createcard'){if(!newCat)return;
      const c={id:++seq,n:'',c:newCat,dist:ACC.dist,ru:'',uz:'',price:'',pk:[['','',''],['','','']],cap:'',
        feats:[],occ:['toy'],photos:[],addr:ACC.addr,ok:false,plan:'base',r:0,nrev:0,lux:false,luxApp:null,
        complaints:0,busy:new Set(),days:days14(0),mod:null,revs:[]};
      CARDS.push(c);cardId=c.id;openCard=c.id;editing=true;cardSnapshot=snap(c);newCat=null;
      closeSheet();tab='card';render();$('#scroll').scrollTop=0;toast(T_.k_created(catName(c.c)));return}
    if(a==='delgo'){const c=byId(delId),nm=c.n||catName(c.c);CARDS=CARDS.filter(x=>x.id!==delId);
      if(cardId===delId)cardId=CARDS[0]?CARDS[0].id:null;
      openCard=null;editing=false;delId=null;closeSheet();render();toast(T_.k_deleted(nm));return}
    if(a==='coedit'){coEdit=true;render();return}
    if(a==='cosave'){errs={};
      if(!ACC.person.trim())errs.person=T_.e_req;
      if(ACC.tel2&&!telOk(ACC.tel2))errs.tel2=T_.e_tel;
      render();if(!Object.keys(errs).length){coEdit=false;render();toast(T_.co_saved)}return}
    if(a==='csv'){const m=card(),text=csvText(m);
      try{const blob=new Blob([text],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a2=document.createElement('a');
        a2.href=url;a2.download='bayram-'+(m.n||m.c)+'-'+statDays+'d.csv';document.body.appendChild(a2);a2.click();
        a2.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast(T_.s_csvDone)}
      catch(err){toast(T_.s_csvNo)}
      return}
    if(a==='autorenew'){ACC.autorenew=ACC.autorenew===false;render();return}
    if(a==='rngcancel'){rngStart=null;render();return}
    if(a==='closesheet'){closeSheet();return}
    if(a==='luxsend'){const d=luxDraft,c=card();errs={};
      if(d.common.length<5)errs.common=T_.x_needCommon;
      if(d.ind.length<3)errs.ind=T_.x_needInd;
      if(d.refs.filter(r=>r.trim()).length<3)errs.refs=T_.x_needRefs;
      if(Object.keys(errs).length){render();return}
      c.luxApp={step:1,at:NOW};luxDraft=null;render();toast(T_.x_sent);return}
    if(a==='flaggo'){const c=card(),v=($('#flagText')||{}).value||'';
      c.revs[flagId].flag=v.trim()||'—';c.complaints++;closeSheet();render();toast(T_.v_flagged);return}
  }

  const tb=q('[data-tab]');if(tb){closeSheet();goCab(tb.dataset.tab);return}
  const tb2=q('[data-tab2]');if(tb2){goCab(tb2.dataset.tab2);return}
  const mr=q('[data-more]');if(mr){const k=mr.dataset.more;
    if(k==='help'){window.open('https://t.me/bayramuz_help','_blank','noopener');return}
    if(k==='data'){dataSheet();return}
    if(k==='out'){route='land';render();$('#scroll').scrollTop=0;toast(T_.out_ok);return}
    return}
  const nc=q('[data-newcat]');if(nc){newCat=nc.dataset.newcat;newCardSheet();return}
  const op=q('[data-open]');if(op){openCard=+op.dataset.open;cardId=openCard;editing=false;render();$('#scroll').scrollTop=0;return}
  const dl=q('[data-del]');if(dl){delId=+dl.dataset.del;
    openSheet(`<h3>${T_.k_delH}</h3><p class="sub">${T_.k_delS}</p>
      <div style="display:flex;gap:9px;margin-top:16px"><button class="btn ghost" data-act="closesheet">${T_.c_cancel}</button>
      <button class="btn" style="background:var(--late)" data-act="delgo">${T_.k_delGo}</button></div>`);return}
  const cp=q('[data-card]');if(cp){cardId=+cp.dataset.card;luxDraft=null;errs={};render();return}
  const rmpk=q('[data-rmpk]');if(rmpk){m.pk.splice(+rmpk.dataset.rmpk,1);render();return}
  const rmph=q('[data-rmph]');if(rmph){m.photos.splice(+rmph.dataset.rmph,1);render();return}
  const ck=q('[data-chk]');if(ck){m[ck.dataset.chk]=!m[ck.dataset.chk];render();return}
  const tg=q('[data-tog]');if(tg){const arr=m[tg.dataset.tog],v=tg.dataset.v,i=arr.indexOf(v);
    i<0?arr.push(v):arr.splice(i,1);render();return}
  const lx=q('[data-lux]');if(lx){const v=lx.dataset.lux,d=luxDraft||(luxDraft=luxDraftNew());
    const arr=v[0]==='c'?d.common:d.ind,n=+v.slice(1),i=arr.indexOf(n);
    i<0?arr.push(n):arr.splice(i,1);render();return}
  const sb2=q('[data-stab]');if(sb2){statTab=sb2.dataset.stab;render();$('#scroll').scrollTop=0;return}
  const sd=q('[data-sdays]');if(sd){statDays=+sd.dataset.sdays;render();return}
  const fl=q('[data-filter]');if(fl){filter=fl.dataset.filter;render();return}
  const ct=q('[data-contact]');if(ct){const r=REQS.find(x=>x.id===+ct.dataset.contact);
    if(r&&r.st==='new'){r.st='ans';r.ansAt=(NOW-r.at)/3600000;r.log.push({from:'new',to:'ans',at:NOW});
      setTimeout(render,0)}   /* ссылка должна успеть сработать */
    return}
  const cl=q('[data-close]');if(cl){const [to,id]=cl.dataset.close.split('-');
    const r=REQS.find(x=>x.id===+id),from=r.st;r.st=to;
    if(r.ansAt==null)r.ansAt=(NOW-r.at)/3600000;
    r.log.push({from,to,at:NOW});render();toast(T_.i_dealDone+' '+T_.i_seen);return}
  const ro=q('[data-reopen]');if(ro){const r=REQS.find(x=>x.id===+ro.dataset.reopen),from=r.st;
    r.st='ans';r.log.push({from,to:'ans',at:NOW});filter='now';render();toast(T_.i_reopened);return}
  const dc=q('[data-dec]');if(dc){decId=+dc.dataset.dec;
    openSheet(`<h3>${T_.i_decTitle}</h3><p class="sub">${T_.i_decSub}</p>
      <div style="margin-top:10px">${[1,2,3].map(i=>`<button class="row" data-reason="${i-1}"><span class="row-b"><b>${T_['i_dec'+i]}</b></span><span class="go">${ico('caret',12)}</span></button>`).join('')}</div>
      <button class="btn ghost" data-act="closesheet">${T_.c_cancel}</button>`);return}
  const rs=q('[data-reason]');if(rs){const r=REQS.find(x=>x.id===decId),from=r.st;
    r.st='dec';r.reason=+rs.dataset.reason;
    if(r.ansAt==null)r.ansAt=(NOW-r.at)/3600000;
    r.log.push({from,to:'dec',reason:r.reason,at:NOW});
    if(r.reason===0){const c=byId(r.card);if(c)c.busy.add(dkey(r.date))}
    closeSheet();render();toast(T_.rq_declined);return}
  const md=q('[data-mode]');if(md){calMode=md.dataset.mode;rngStart=null;render();return}
  const mo=q('[data-mo]');if(mo){calMonth=new Date(calMonth.getFullYear(),calMonth.getMonth()+ +mo.dataset.mo,1);render();return}
  const day=q('[data-day]');if(day){const [y,mm,d]=day.dataset.day.split('-').map(Number),dt=new Date(y,mm,d),set=card().busy;
    if(calMode==='tap'){set.has(day.dataset.day)?set.delete(day.dataset.day):set.add(day.dataset.day);render();toast(T_.cal_saved)}
    else if(!rngStart){rngStart=dt;render()}
    else{const a=rngStart;rngStart=null;
      openSheet(`<h3>${dateStr(a<dt?a:dt)} — ${dateStr(a<dt?dt:a)}</h3>
        <div style="display:flex;gap:9px;margin-top:14px"><button class="btn" data-rng="busy">${T_.c_busyRange}</button>
        <button class="btn ghost" data-rng="free">${T_.c_freeRange}</button></div>`);
      $('#sheet').dataset.a=a.getTime();$('#sheet').dataset.b=dt.getTime()}
    return}
  const rg=q('[data-rng]');if(rg){const sh=$('#sheet');
    applyRange(card().busy,new Date(+sh.dataset.a),new Date(+sh.dataset.b),rg.dataset.rng==='busy');
    closeSheet();render();toast(T_.cal_saved);return}
  const sr=q('[data-sendrep]');if(sr){const i=+sr.dataset.sendrep,el=$('[data-rep="'+i+'"]'),v=(el&&el.value||'').trim();
    if(!v)return;card().revs[i].rep=v;render();toast(T_.v_sent);return}
  const fg=q('[data-flag]');if(fg){flagId=+fg.dataset.flag;
    openSheet(`<h3>${T_.v_flagH}</h3><p class="sub">${T_.v_flagS}</p>
      <textarea id="flagText" style="margin-top:12px" placeholder="${T_.v_flagH}"></textarea>
      <div style="display:flex;gap:9px;margin-top:12px"><button class="btn ghost" data-act="closesheet">${T_.c_cancel}</button>
      <button class="btn plum" data-act="flaggo">${T_.v_flagGo}</button></div>`);return}
  const pl=q('[data-plan]');if(pl){card().plan=pl.dataset.plan;render();
    toast(T_.t_changed(T_['t_'+card().plan]));$('#scroll').scrollTop=0;return}
  if(q('[data-ad]')){toast(T_.t_adBooked);return}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if($('#sheet').classList.contains('on'))closeSheet();return}
  if((e.key==='Enter'||e.key===' ')&&document.activeElement&&document.activeElement.matches('[data-day]')){
    e.preventDefault();document.activeElement.click()}
});
render();

</script>
</body>
</html>
