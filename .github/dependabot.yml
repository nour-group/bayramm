version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Совпадает с minimumReleaseAge (7 дней) в pnpm-workspace.yaml
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    # TypeScript 7 (новый компилятор) — отдельной оценкой, не в общей группе: иначе
    # мажорная версия тянет за собой патчи wrangler и vite-plugin и валит всю группу
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      dev-dependencies:
        dependency-type: development
      prod-dependencies:
        dependency-type: production

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
