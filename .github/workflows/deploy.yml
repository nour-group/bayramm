name: Deploy

# main → staging автоматически; production — вручную (workflow_dispatch) или по тегу v*,
# через GitHub Environment `production` с подтверждением
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: "Куда деплоить"
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        target: ${{ fromJSON((startsWith(github.ref, 'refs/tags/v') || inputs.target == 'production') && '["production"]' || '["staging"]') }}
    environment:
      name: ${{ matrix.target }}
      url: ${{ matrix.target == 'production' && 'https://bayramm.uz' || 'https://staging.bayramm.uz' }}
    concurrency:
      group: deploy-${{ matrix.target }}
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Check secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::В environment '$TARGET' не заданы CLOUDFLARE_API_TOKEN (secret) и CLOUDFLARE_ACCOUNT_ID (variable)"
            exit 1
          fi

      # Миграции — до воркеров, чтобы код не опережал схему
      - name: Database migrations
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then echo "::warning::SUPABASE_DB_URL не задан — миграции пропущены"; exit 0; fi
          if ! ls supabase/migrations/*.sql >/dev/null 2>&1; then echo "Миграций пока нет"; exit 0; fi
          npx --yes supabase@2.101.0 db push --db-url "$SUPABASE_DB_URL"

      - name: Deploy API
        working-directory: apps/api
        run: pnpm exec wrangler deploy --env "$TARGET" --var "GIT_SHA:${GITHUB_SHA::7}"

      # Варианты фото (Supabase Storage → Cloudflare Image Transformations). Без секретов
      - name: Deploy media
        working-directory: apps/media
        run: pnpm exec wrangler deploy --env "$TARGET"

      - name: Deploy web
        working-directory: apps/web
        run: |
          CLOUDFLARE_ENV="$TARGET" pnpm build
          pnpm exec wrangler deploy

      - name: Deploy vendor
        working-directory: apps/vendor
        run: |
          CLOUDFLARE_ENV="$TARGET" pnpm build
          pnpm exec wrangler deploy

      # Панель оператора: свой домен, без *.workers.dev. Бота виджета входа в сборке нет:
      # страница входа спрашивает его у API (GET /api/telegram/bot)
      - name: Deploy admin
        working-directory: apps/admin
        run: |
          CLOUDFLARE_ENV="$TARGET" pnpm build
          pnpm exec wrangler deploy

      # Бот окружения — из кода (apps/api/src/telegram/bot-profile.ts): команды, описания,
      # кнопка меню. Вызов идемпотентный. После всех воркеров, чтобы сбой Telegram не мешал
      # выкладке сайтов. Ключ — секрет TELEGRAM_SYNC_KEY и здесь, и в воркере API
      - name: Telegram bot sync
        env:
          TELEGRAM_SYNC_KEY: ${{ secrets.TELEGRAM_SYNC_KEY }}
        run: |
          if [ -z "$TELEGRAM_SYNC_KEY" ]; then
            echo "::notice::TELEGRAM_SYNC_KEY не задан в environment '$TARGET' — настройка бота пропущена"
            exit 0
          fi
          api=$([ "$TARGET" = production ] && echo api.bayramm.uz || echo api-staging.bayramm.uz)
          # Заголовок с ключом — через stdin (-H @-), не в аргументах команды
          code=$(printf 'Authorization: Bearer %s\n' "$TELEGRAM_SYNC_KEY" |
            curl -sS --retry 5 --retry-delay 3 --retry-all-errors -X POST -H @- \
              -o bot-sync.json -w '%{http_code}' "https://$api/telegram/sync" || true)
          if [ "$code" != 200 ]; then
            case "$code" in
              404) hint="в воркере API не задан секрет TELEGRAM_SYNC_KEY" ;;
              401) hint="TELEGRAM_SYNC_KEY в GitHub Environment и в воркере API различаются" ;;
              *) hint="см. логи воркера API" ;;
            esac
            echo "::error::POST https://$api/telegram/sync ответил HTTP $code: $hint"
            exit 1
          fi
          # Отчёт по каждому вызову: метод, язык, при ошибке — причина и код Telegram
          jq -r '.results[] | "\(if .ok then "ok    " else "FAILED" end) \(.method) \(.language)\(if .ok then "" else " — \(.error) \(.status)" end)"' bot-sync.json
          if ! jq -e '.ok == true and (.results | length > 0) and all(.results[]; .ok == true)' bot-sync.json >/dev/null; then
            echo "::error::Настройка бота прошла не полностью — подробности в логах воркера API"
            exit 1
          fi

      - name: Smoke test
        run: |
          host=$([ "$TARGET" = production ] && echo bayramm.uz || echo staging.bayramm.uz)
          curl -sSf --retry 5 --retry-delay 3 --retry-all-errors "https://$host/" -o /dev/null

          # Кабинет вендора: 200 и CSP на HTML. Свой домен wrangler deploy мог создать только что —
          # повторов больше, чем для клиента
          vendor=$([ "$TARGET" = production ] && echo vendor.bayramm.uz || echo vendor-staging.bayramm.uz)
          code=$(curl -sSf --retry 10 --retry-delay 6 --retry-all-errors -D vendor-headers.txt -o /dev/null -w '%{http_code}' "https://$vendor/")
          if [ "$code" != 200 ]; then echo "::error::https://$vendor/ ответил HTTP $code"; exit 1; fi
          if ! grep -qi '^content-security-policy:' vendor-headers.txt; then
            echo "::error::https://$vendor/ отдаёт HTML без Content-Security-Policy"; exit 1
          fi
          # Кэш (packages/edge, cache-headers.ts): страница — со сверкой, файл сборки с хэшем — год и immutable
          if ! grep -qiE '^cache-control: *no-cache' vendor-headers.txt; then
            echo "::error::https://$vendor/ отдаёт HTML без Cache-Control: no-cache"; exit 1
          fi
          asset=$(curl -sSf --retry 5 --retry-delay 3 --retry-all-errors "https://$vendor/" | grep -oE '/assets/[^"]+\.js' | head -n1 || true)
          if [ -z "$asset" ]; then echo "::error::в HTML https://$vendor/ нет скрипта /assets/*.js"; exit 1; fi
          cache=$(curl -sSf --retry 5 --retry-delay 3 --retry-all-errors -D - -o /dev/null "https://$vendor$asset" | grep -i '^cache-control:' || true)
          if ! grep -qiF "immutable" <<<"$cache"; then
            echo "::error::https://$vendor$asset — файл сборки без Cache-Control immutable"; exit 1
          fi

          # Панель оператора: 200 на странице входа. Она же Mini App (фрейм — только
          # web.telegram.org, SDK Telegram); вход в браузере — через хаб, виджета здесь нет
          admin=$([ "$TARGET" = production ] && echo admin.bayramm.uz || echo admin-staging.bayramm.uz)
          code=$(curl -sSf --retry 10 --retry-delay 6 --retry-all-errors -D admin-headers.txt -o /dev/null -w '%{http_code}' "https://$admin/login")
          if [ "$code" != 200 ]; then echo "::error::https://$admin/login ответил HTTP $code"; exit 1; fi
          csp=$(grep -i '^content-security-policy:' admin-headers.txt || true)
          if [ -z "$csp" ]; then echo "::error::https://$admin/ отдаёт HTML без Content-Security-Policy"; exit 1; fi
          for expected in "frame-ancestors https://web.telegram.org" "https://telegram.org/js/telegram-web-app.js"; do
            if ! grep -qiF "$expected" <<<"$csp"; then
              echo "::error::CSP панели оператора без «$expected»"; exit 1
            fi
          done
          for unexpected in "telegram-widget.js" "oauth.telegram.org" "challenges.cloudflare.com"; do
            if grep -qiF "$unexpected" <<<"$csp"; then
              echo "::error::CSP панели оператора пускает «$unexpected» — виджеты входа только на хабе"; exit 1
            fi
          done

          # Хаб входа: виджет Telegram и Turnstile разрешены только на /auth, на остальных страницах сайта — нет
          hub=$(curl -sSf --retry 5 --retry-delay 3 --retry-all-errors -D - -o /dev/null "https://$host/auth" | grep -i '^content-security-policy:' || true)
          home=$(curl -sSf --retry 5 --retry-delay 3 --retry-all-errors -D - -o /dev/null "https://$host/" | grep -i '^content-security-policy:' || true)
          for expected in "https://telegram.org/js/telegram-widget.js" "frame-src https://oauth.telegram.org" "https://challenges.cloudflare.com"; do
            if ! grep -qiF "$expected" <<<"$hub"; then echo "::error::CSP хаба /auth без «$expected»"; exit 1; fi
          done
          for unexpected in "telegram-widget.js" "challenges.cloudflare.com"; do
            if grep -qiF "$unexpected" <<<"$home"; then
              echo "::error::CSP главной пускает «$unexpected» — он нужен только на /auth"; exit 1
            fi
          done

          # media: несуществующее фото — 404, а не 500. Путь правильной формы, поэтому воркер
          # доходит до Storage: проверяются и воркер, и SUPABASE_URL, и разбор ошибок хранилища
          media=$([ "$TARGET" = production ] && echo media.bayramm.uz || echo media-staging.bayramm.uz)
          missing="listings/00000000-0000-4000-8000-000000000000/00000000-0000-4000-8000-000000000000.webp"
          code=$(curl -sS --retry 10 --retry-delay 6 --retry-all-errors -o /dev/null -w '%{http_code}' "https://$media/640/$missing")
          if [ "$code" != 404 ]; then echo "::error::https://$media/640/<нет такого> ответил HTTP $code, ожидался 404"; exit 1; fi

          # Бот окружения: API узнаёт его имя по токену (getMe) и отдаёт адрес Mini App — этот сайт.
          # Имя в лог не пишем: проверяем только, что оно есть
          bot=$(curl -sS --retry 5 --retry-delay 3 --retry-all-errors "https://$host/api/telegram/bot")
          if ! jq -e --arg url "https://$host" '(.username | type == "string" and length > 0) and .miniAppUrl == $url' <<<"$bot" >/dev/null; then
            echo "::error::https://$host/api/telegram/bot не отдал имя бота и адрес Mini App"; exit 1
          fi

          # Вебхук бота: без секрета Telegram — 401 (секрет выводится из ID_HASH_KEY, ставит его /telegram/sync)
          api=$([ "$TARGET" = production ] && echo api.bayramm.uz || echo api-staging.bayramm.uz)
          code=$(curl -sS --retry 5 --retry-delay 3 --retry-all-errors -o /dev/null -w '%{http_code}' -X POST "https://$api/telegram/webhook")
          if [ "$code" != 401 ]; then echo "::error::POST https://$api/telegram/webhook без секрета ответил HTTP $code, ожидался 401"; exit 1; fi

          # Демо-данные (POST /ops/demo) — только staging: в production маршрута нет ни с каким
          # ключом (404); на staging без ключа — 401, а пока секрет DEMO_SEED_KEY не задан — 404
          code=$(curl -sS --retry 5 --retry-delay 3 --retry-all-errors -o /dev/null -w '%{http_code}' -X POST "https://$api/ops/demo")
          if [ "$TARGET" = production ] && [ "$code" != 404 ]; then
            echo "::error::POST https://$api/ops/demo в production ответил HTTP $code, ожидался 404"; exit 1
          fi
          if [ "$TARGET" = staging ] && [ "$code" != 401 ] && [ "$code" != 404 ]; then
            echo "::error::POST https://$api/ops/demo без ключа ответил HTTP $code, ожидался 401 или 404"; exit 1
          fi

          # Только HTTPS (packages/edge/src/https.ts): по http — постоянный редирект на тот же адрес
          # с https, по https — Strict-Transport-Security. У каждого воркера: сайт, кабинет, панель,
          # API и media
          for url in "$host/catalog" "$vendor/" "$admin/login" "$api/health" "$media/640/$missing"; do
            got=$(curl -sS --retry 5 --retry-delay 3 --retry-all-errors -o /dev/null -w '%{http_code} %{redirect_url}' "http://$url")
            if [ "$got" != "301 https://$url" ]; then
              echo "::error::http://$url ответил «$got», ожидался 301 на https://$url"; exit 1
            fi
            if ! curl -sS --retry 5 --retry-delay 3 --retry-all-errors -D - -o /dev/null "https://$url" | grep -qiE '^strict-transport-security: *max-age=[1-9]'; then
              echo "::error::https://$url отдаёт ответ без Strict-Transport-Security"; exit 1
            fi
          done

          if true; then
            body=$(curl -sS --retry 5 --retry-delay 3 --retry-all-errors "https://$host/api/health")
            echo "$body"
            echo "$body" | jq -e --arg sha "${GITHUB_SHA::7}" '.ok and .db == "ok" and .sha == $sha' >/dev/null
          fi

      # Чек-лист выпуска (.github/scripts/release-check.sh): в production нет демо-витрин и
      # демо-телефонов, тестового бота и черновиков юридических текстов. Последним шагом: воркеры
      # уже выложены, красный шаг значит «выпуск ещё не готов», а не «выкладка сломана»
      - name: Release checklist
        if: matrix.target == 'production'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: bash .github/scripts/release-check.sh bayramm.uz
