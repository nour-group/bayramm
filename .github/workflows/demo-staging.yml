name: Demo data (staging)

# Демо-витрины на staging для показа: seed — завести три вымышленных зала и по две витрины в
# каждой другой включённой категории (вендор, карточка, фото, услуги, поля витрины, занятость;
# опубликованы теми же шагами, что в панели), reset — убрать всё демо вместе с заявками на
# них, reseed — reset и seed подряд (seed не меняет уже заведённое: новые тексты и фото —
# только так), check — только проверка. Только вручную и только staging: маршрут
# POST /ops/demo есть лишь там (apps/api/src/routes/ops.ts). Режимы можно запускать
# сколько угодно раз: seed заводит только то, чего нет, reset убирает только демо.
#
# После seed, reseed и в режиме check — проверка в браузере (e2e/staging, Chromium на
# телефоне и компьютере): лендинг, каждый раздел и каждая витрина, фото с воркера media,
# «Связаться», узбекский, занятый день.
#
# Фото рисует шаг ниже (apps/api/scripts/demo-photos.ts, sharp) — в репозитории их нет.
# Ключ — секрет DEMO_SEED_KEY в GitHub Environment staging и тот же — в воркере API staging.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "seed — завести демо-витрины, reseed — убрать и завести заново, reset — убрать всё демо, check — только проверить"
        type: choice
        options: [seed, reseed, reset, check]
        default: seed

permissions:
  contents: read

concurrency:
  group: demo-staging
  cancel-in-progress: false

jobs:
  demo:
    name: Demo ${{ inputs.mode }} (staging)
    if: inputs.mode != 'check'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: staging
      url: https://staging.bayramm.uz
    env:
      MODE: ${{ inputs.mode }}
      API: https://api-staging.bayramm.uz
    steps:
      - if: inputs.mode != 'reset'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: inputs.mode != 'reset'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - if: inputs.mode != 'reset'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Только API и его пакеты: sharp для фото
      - name: Install
        if: inputs.mode != 'reset'
        run: pnpm install --frozen-lockfile --filter @bayramm/api...

      - name: Draw demo photos
        if: inputs.mode != 'reset'
        run: pnpm --filter @bayramm/api demo:photos "$RUNNER_TEMP/demo-photos"

      - name: POST /ops/demo (${{ inputs.mode }})
        env:
          DEMO_SEED_KEY: ${{ secrets.DEMO_SEED_KEY }}
        run: |
          set -uo pipefail
          if [ -z "$DEMO_SEED_KEY" ]; then
            echo "::error::В environment staging не задан секрет DEMO_SEED_KEY"
            exit 1
          fi

          # POST /ops/demo с полями формы "$@": ответ — в demo.json, HTTP-код — в $code.
          # Оба режима идемпотентны: при сбое сети или 5xx — ещё раз
          post() {
            code=000
            for attempt in 1 2 3; do
              # Заголовок с ключом — через stdin (-H @-), не в аргументах команды
              code=$(printf 'Authorization: Bearer %s\n' "$DEMO_SEED_KEY" |
                curl -sS --max-time 120 -X POST -H @- "$@" \
                  -o demo.json -w '%{http_code}' "$API/ops/demo" || true)
              case "$code" in
                000 | 5??) if [ "$attempt" -lt 3 ]; then echo "::warning::попытка $attempt: HTTP $code"; sleep 15; fi ;;
                *) break ;;
              esac
            done
            [ "$code" = 200 ] && return 0
            case "$code" in
              404) hint="маршрута нет: в воркере API staging не задан секрет DEMO_SEED_KEY или код ещё не выкачен" ;;
              401) hint="DEMO_SEED_KEY в GitHub Environment staging и в воркере API различаются" ;;
              429) hint="слишком часто — подождите минуту" ;;
              # Код ошибки API и details (пункты готовности, поля) — без значений
              *) hint=$(jq -r '(.error.code // "ошибка") + (if ((.error.details // []) | length) > 0
                               then " " + (.error.details | join(",")) else "" end)' demo.json 2>/dev/null ||
                        echo "см. логи воркера API") ;;
            esac
            echo "::error::POST $API/ops/demo ($MODE) ответил HTTP $code: $hint"
            exit 1
          }

          # reseed: сначала убрать всё демо — seed заведёт заново с новыми текстами и фото
          if [ "$MODE" = reseed ]; then
            post -F mode=reset
            removed=$(jq -r '"Убрано перед seed — карточек: \(.removed.listings), фото: \(.removed.photos)."' demo.json)
            echo "$removed"
            printf '%s\n\n' "$removed" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "$MODE" = seed ] || [ "$MODE" = reseed ]; then
            # По витрине за запрос — каждый вызов воркера короткий. Фото — по три на витрину, по порядку
            photos=("$RUNNER_TEMP"/demo-photos/demo-*.webp)
            totals='{"active":0,"vendors":0,"listings":0,"photos":0,"busyDays":0,"published":0}'
            venue=1
            venues=1
            while [ "$venue" -le "$venues" ]; do
              form=(-F mode=seed -F "venue=$venue")
              for f in "${photos[@]:$(((venue - 1) * 3)):3}"; do form+=(-F "photo=@$f;type=image/webp"); done
              post "${form[@]}"
              venues=$(jq -r .venues demo.json)
              totals=$(jq -c --argjson t "$totals" '{active: ($t.active + .active),
                vendors: ($t.vendors + .created.vendors), listings: ($t.listings + .created.listings),
                photos: ($t.photos + .created.photos), busyDays: ($t.busyDays + .created.busyDays),
                published: ($t.published + .published)}' demo.json)
              venue=$((venue + 1))
            done
            # Итог — только счётчики
            summary=$(jq -r --arg venues "$venues" '"Демо-витрин: \($venues), опубликовано: \(.active).\nЗаведено сейчас — вендоров: \(.vendors), карточек: \(.listings), фото: \(.photos), занятых дней: \(.busyDays); опубликовано сейчас: \(.published)."' <<<"$totals")
          else
            post -F mode=reset
            summary=$(jq -r '"Убрано — вендоров: \(.removed.vendors), карточек: \(.removed.listings), фото: \(.removed.photos) (объектов в Storage: \(.storageObjects)), заявок: \(.removed.requests), пользователей кабинета: \(.removed.vendorUsers)."' demo.json)
          fi
          echo "$summary"
          printf '### Demo data (staging): %s\n\n%s\n' "$MODE" "$summary" >> "$GITHUB_STEP_SUMMARY"

  # Проверка в браузере: как демо-витрины видит человек на сайте staging. Без секретов —
  # сайт публичный; «Связаться» открывается у первой витрины раздела (лимит 30 в минуту)
  check:
    name: Check staging in the browser
    needs: demo
    if: ${{ !cancelled() && inputs.mode != 'reset' && (needs.demo.result == 'success' || needs.demo.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      STAGING_URL: https://staging.bayramm.uz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Playwright version
        id: playwright
        run: echo "version=$(pnpm --filter @bayramm/e2e exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache Chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium
        run: pnpm --filter @bayramm/e2e exec playwright install --with-deps --only-shell chromium
      # Выдача каталога кэшируется на 30 секунд (+60 stale): после seed — подождать
      - name: Wait for catalog cache
        if: inputs.mode != 'check'
        run: sleep 90
      - name: Staging check (phone and desktop)
        run: pnpm --filter @bayramm/e2e exec playwright test -c playwright.staging.config.ts
      - name: Upload report
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staging-check
          path: e2e/test-results/staging
          retention-days: 7
