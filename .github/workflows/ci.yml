name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # supabase db push не применяет миграцию старше последней уже применённой: новая
      # миграция PR обязана идти после всех миграций базовой ветки (иначе deploy падает)
      - name: Migration order
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          base=$(git ls-tree --name-only FETCH_HEAD supabase/migrations/ | xargs -n1 basename | grep '\.sql$' | sort)
          latest=$(printf '%s\n' "$base" | tail -n1)
          status=0
          for f in $(ls supabase/migrations | grep '\.sql$' | sort); do
            if ! printf '%s\n' "$base" | grep -qxF "$f" && [[ ! "$f" > "$latest" ]]; then
              echo "::error file=supabase/migrations/$f::Миграция $f старше последней в $BASE_REF ($latest) — переименуйте с более поздней меткой времени"
              status=1
            fi
          done
          exit $status
      - name: Lint
        run: pnpm exec biome ci .
      - name: Typecheck
        run: pnpm typecheck
      - name: Tests
        run: pnpm test
      - name: Build
        run: pnpm build
