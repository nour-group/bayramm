name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # supabase db push не применяет миграцию старше последней уже применённой: новая
      # миграция PR обязана идти после всех миграций базовой ветки (иначе deploy падает)
      - name: Migration order
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          base=$(git ls-tree --name-only FETCH_HEAD supabase/migrations/ | xargs -n1 basename | grep '\.sql$' | sort)
          latest=$(printf '%s\n' "$base" | tail -n1)
          status=0
          for f in $(ls supabase/migrations | grep '\.sql$' | sort); do
            if ! printf '%s\n' "$base" | grep -qxF "$f" && [[ ! "$f" > "$latest" ]]; then
              echo "::error file=supabase/migrations/$f::Миграция $f старше последней в $BASE_REF ($latest) — переименуйте с более поздней меткой времени"
              status=1
            fi
          done
          exit $status
      - name: Lint
        run: pnpm exec biome ci .
      - name: Typecheck
        run: pnpm typecheck
      - name: Tests
        run: pnpm test
      - name: Build
        run: pnpm build

  # Сквозные проверки в браузере (e2e/): правила продукта, доступность (axe), зона нажатия,
  # безопасные зоны Telegram. Без сети: у клиента демо-API, у кабинета и панели /api
  # перехватывает тест. Только Chromium, закэширован по версии Playwright
  e2e:
    name: E2E & accessibility (Playwright)
    runs-on: ubuntu-latest
    # Проверки категорий (каталог, витрина, заявка каждой) добавили к прогону минуты
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Playwright version
        id: playwright
        run: echo "version=$(pnpm --filter @bayramm/e2e exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache Chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # Браузер из кэша не качается заново; системные библиотеки ставятся всегда
      - name: Install Chromium
        run: pnpm --filter @bayramm/e2e exec playwright install --with-deps --only-shell chromium
      - name: E2E
        run: pnpm e2e
      - name: Upload report
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
