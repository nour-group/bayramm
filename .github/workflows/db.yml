name: DB

# Миграции и pgTAP на чистом локальном Postgres (Docker на раннере), затем на той же
# базе — сверка типов Kysely и интеграционные тесты API.
# Удалённые базы здесь не трогаются: только `supabase db start` / `test db --local`.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: db-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SUPABASE_CLI: supabase@2.101.0
  # Образы — из ghcr.io: анонимный лимит public.ecr.aws на раннерах GitHub заканчивается
  SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io
  DB_CONTAINER: supabase_db_bayramm # supabase_db_<project_id из supabase/config.toml>

jobs:
  pgtap:
    name: Migrations (up → down → up) & pgTAP
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Every migration has a rollback
        run: |
          status=0
          for f in supabase/migrations/*.sql; do
            down="supabase/rollbacks/$(basename "$f" .sql).down.sql"
            if [ ! -f "$down" ]; then
              echo "::error file=$f::нет отката $down"
              status=1
            fi
          done
          exit "$status"

      - name: Start Postgres (applies migrations and seed)
        run: npx --yes "$SUPABASE_CLI" db start

      - name: Roll back everything, then migrate again
        run: |
          psql_db() { docker exec -i "$DB_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 -q "$@"; }
          mapfile -t downs < <(printf '%s\n' supabase/rollbacks/*.down.sql | sort -r)
          for f in "${downs[@]}"; do echo "down: $f"; psql_db < "$f"; done
          left=$(psql_db -Atc "select count(*) from pg_namespace where nspname in ('app', 'pii')")
          if [ "$left" != "0" ]; then echo "::error::после отката остались схемы app/pii"; exit 1; fi
          for f in supabase/migrations/*.sql; do echo "up: $f"; psql_db < "$f"; done
          psql_db < supabase/seed.sql

      - name: pgTAP
        run: npx --yes "$SUPABASE_CLI" test db --local

      # Дальше — API на той же базе
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Типы Kysely генерируются из этой базы: миграция без обновления типов — ошибка
      - name: DB types are up to date (kysely-codegen)
        run: |
          pnpm --filter @bayramm/api db:types
          if ! git diff --exit-code -- apps/api/src/db/schema.generated.ts; then
            echo "::error file=apps/api/src/db/schema.generated.ts::типы устарели — pnpm --filter @bayramm/api db:types и закоммитить"
            exit 1
          fi

      - name: API integration tests
        run: pnpm --filter @bayramm/api test:integration
