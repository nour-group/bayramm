packages:
  - "apps/*"
  - "packages/*"
  - "prototypes/*"
  - "e2e"

# Supply chain: не ставить версии младше 7 дней, запрещать git/tarball-зависимости
# в транзитивных пакетах и откат уровня доверия (provenance) между версиями
minimumReleaseAge: 10080
blockExoticSubdeps: true
trustPolicy: no-downgrade

allowBuilds:
  esbuild: true
  workerd: true
  sharp: true

# miniflare (wrangler, vite-plugin) закрепил undici 7.29.0 — в нём DoS при распаковке
# WebSocket permessage-deflate (исправлено в 7.29.1). Только локальная разработка;
# убрать, когда miniflare поднимет версию сам
overrides:
  undici@>=7.28.0 <7.29.1: 7.29.1
