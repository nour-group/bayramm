<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: без него iOS не отдаёт env(safe-area-inset-*) — шапка и нижняя панель
         не знали бы про вырез и жест-бар -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="color-scheme" content="light" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Bayramm — панель оператора</title>
    <!-- Шрифты текста (@bayramm/ui/fonts.css) — сразу, а не после стилей: панель по-русски, нужна
         кириллица, цифры и знаки — из латинского файла. Заголовки — Unbounded, кириллица -->
    <link rel="preload" href="../../packages/ui/fonts/manrope-cyrillic.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="../../packages/ui/fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="../../packages/ui/fonts/unbounded-cyrillic.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
